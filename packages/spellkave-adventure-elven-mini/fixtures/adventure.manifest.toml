#:schema https://spellkave.dev/schema/world-manifest-1.0.0.json
applyset = "elven_mini"
schema_version = "1.0.0"

[[bundles]]
allow_flat_tags = false
author = "spellkave-srd-cc"
bundle_id = "elven_mini"
default_extent_params_json = '{"extent_m": 4.5}'
default_extent_shape_id = "core/area/cube"
depends_on = [
    "srd",
    "dm",
]
description = "Playing-the-Game proof mini-world (elven multi-graph)."
display_name = "Playing the Game proof scene"
version = "1.0.0"

[[bundles.tag_prefixes]]
prefix = "elven_mini"

[metadata]
publisher_list_bundle = "elven_mini"

[metadata.docs]
intro = "The elven-mini adventure starts as the level-0 candidate in the creation limbo; the recorder creates the hero, then the inn/tomb/level-up arc."
nav_group = "adventure"
page_id = "elven-mini"
source_base = "packages/spellkave-adventure-elven-mini/"
title = "Elven Mini"
version = 1

[[metadata.docs.attributions]]
body = "Elven Mini adventure material"

[metadata.docs.attributions.source]
anchor = "name-elven-mini"
license = "CC-BY-4.0"
path = "adventures/elven-mini.toml"

