[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/companion/command-bond"
default_visibility = "Public"
description = "The reach half of the companion command authority — granted only by Aldwin's authored bond activation, with a party extent over elven_mini.companion.bond. Offer gating and cross-graph addressee resolution read this grant's extent. It is the single capability id on both the action and the affordance of every command verb; stone possession is a separate affordance predicate, never this grant."
display_name = "Bonded companion reach"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/companion/stone-giver"
default_visibility = "Public"
description = "Hesper's may-do for handing the telepathy stone to the hero at her join."
display_name = "Gift the telepathy stone"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/dm/record-companion-bond"
default_visibility = "Public"
description = "Aldwin's may-do for the bond-latch write (the hearth-ledger entry that a telepathy stone has been recorded). May-do, self-only dispatch."
display_name = "DM: record companion bond"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/dm/watch"
default_visibility = "Public"
description = "The DM's watch over the adventure: carries the place_graph extent that broadens Aldwin's read scope to every body in the region, including the ephemeral combat grids of any session opened inside it. Read-only — it authorises no action and is never a gate_predicate's required_capability."
display_name = "DM: watch the adventure"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/dm/seat"
default_visibility = "Public"
description = "Holds the DM seat: the key a may-do gate checks to admit the game master specifically, as opposed to anyone who may write to the world (frontier.apply_manifest) or anyone widened into read range (elven_mini/dm/watch). Today's only consumer is the DM-only threshold (dm-threshold.ts); a future gate that needs 'is this actor the DM' should check this capability, not actor_identity.role (ADR-0007 D-3 forbids a hardcoded role match on a may-do)."
display_name = "DM: hold the seat"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/party/sight"
default_visibility = "Public"
description = "Party sight: extends the holder's read scope to every body reachable through the srd.party.heroes membership tag, including a fellow member's session peers on any battle map opened for that party (caller_scope's ExtentResolutionShape::Party arm, ADR-0007 D-1). Hidden elevation only — this widens what the holder SEES, never what they may DO, and never raises them to DM/operator read scope (ADR-0084; contrast elven_mini/dm/watch and elven_mini/dm/seat above, both elevation_class = full)."
display_name = "Party: see fellow members"

