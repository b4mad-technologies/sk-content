[[capability_definitions]]
actor_kind = "entity"
bundle_id = "elven_mini"
capability_id = "elven_mini/dm/watch-limbo"
default_visibility = "Public"
description = "The DM's watch over the creation limbo: carries the place_graph extent that broadens Aldwin's read scope to the limbo's own disjoint root graph, so his seat can decide when to walk the DM-only threshold without being co-located first. Read-only — it authorises no action and is never a gate_predicate's required_capability. Kept as its OWN capability id, distinct from the region-wide DM_WATCH_CAPABILITY_ID (dm-npc.ts): server/src/manifest/commit.rs's ADR-0085 upsert keys actor_capabilities on (entity_id, capability_id) alone, so a second grant row on the SAME id would silently replace the region-wide one instead of adding a second extent (sk-dms.28)."
display_name = "DM: watch the creation limbo"

