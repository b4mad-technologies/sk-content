[[kinds]]
kind = "place_graph_instances"
surface = "owner"
owner = "place_graphs"
# Two columns resolve to a `place_graphs` row — `blueprint_id` (the template
# being cloned; required, every row carries it) and `parent_graph_id` (the
# DIFFERENT relationship of nesting one instance's extent inside another's,
# per `dm-oversight.md`/`osm-mapping.md`; optional, empty on a world-rooted
# instance, which is the common case — see the mech_place_graph_instance_move
# fixture). `blueprint_id` is the owner join: it is the one the row always
# carries, so an authored instance is never left owned by nobody.
owner_field = "blueprint_id"
note = "An instantiation of a blueprint. It belongs on the blueprint's own page — the graph it clones from — not on a page of its own."

[[kinds]]
kind = "spatial_environment_state"
surface = "owner"
# THREE-way polymorphic: a row sets exactly one of `place_node_id` /
# `place_edge_key` / `location_def_id` (`SpatialEnvironmentStateRow` in
# `crates/spellkave-schema/src/lib.rs`, mutually exclusive per its own doc
# comment). This is a SMALL, FIXED set of possible owners, each with its own
# named column — unlike `metadata_attachments` (`owner = "*"`), which is any
# kind at all through one generic target column. `owner_candidates` says so:
# each candidate names the owner kind and, same rule as the singular
# `owner_field` elsewhere in this file, the join column only when it does not
# repeat that owner's own natural-key name.
#
# `place_nodes`' own natural key is `node_id`, so `place_node_id` needs
# naming; `place_edges`' is `edge_key`, so `place_edge_key` needs naming too;
# `location_definitions`' natural key is itself `location_def_id`, so that
# candidate needs no override. `place_nodes` and `location_definitions` carry
# no per-row page of their own to land on (place_nodes render as a raw list
# on their graph's page; location_definitions has zero authored rows across
# every registered root) — the reader wires up whichever candidates it can
# reach a carrier for and leaves the rest visibly in the overflow basin
# rather than inventing a page (sk-jay0.3.5.78).
owner_candidates = [{ owner = "place_nodes", owner_field = "place_node_id" }, { owner = "place_edges", owner_field = "place_edge_key" }, { owner = "location_definitions" }]
note = "Runtime state at a place, carrying updated_tick. Shown where it applies."

