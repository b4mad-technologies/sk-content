# Reader coverage: every manifest row kind, deliberately classified.
#
# WHY THIS FILE EXISTS
#
# The documentation reader used to answer "which row kind becomes a page?" in
# four places that disagreed with each other and were kept in step by hand.
# This file is the single answer. Code reads it; nobody restates it.
#
# It is also the thing a gate can check. `docs-coverage-validator.ts` reads the
# authoritative kind list from the KERNEL registry
# (`crates/spellkave-schema/src/row_kinds.rs`, reachable from TypeScript through
# `packages/spellkave-world-author/src/row-kinds.ts`) and fails when a kind
# registered there, or present in any manifest, is missing below. Reading the
# kernel rather than scanning the fixtures is deliberate: eleven registered
# kinds have no authored rows yet, and a fixture scan would call them absent
# and wave them through.
#
# THE FOUR SURFACES
#
#   page      The row is a subject in its own right and gets its own catalogue
#             page plus a component that renders it at all three view levels.
#   owner     The row is payload belonging to another row. It appears on that
#             row's page. `owner` names the kind it belongs to.
#   relation  The row is an edge between two other rows. It is never a page; it
#             becomes a link, reachable from both endpoints.
#   none      The row has no reader surface at all. `reason` says why, and the
#             reason must be a property of the row kind, never "we did not get
#             to it yet".
#
# WHAT IS NOT AUTHORED HERE
#
# The natural-key field per kind is NOT restated here. The kernel registry
# already carries it for every kind it knows; code reads it from there.
# `id_field` below appears only for kinds the kernel does not register, and
# only when something needs to address the row individually.
#
# `owner_field` is the one exception that IS authored here: the column an
# owner-surfaced row uses to point at its owner, when that column does not
# repeat the owner's own natural-key name (most do — the default is the
# owner's `ROW_KIND_NATURAL_KEY` column, and only a kind that disagrees with
# it needs this key at all).
#
# `owner_candidates` is for a row that belongs to whichever of SEVERAL fixed
# kinds it actually names (`spatial_environment_state`, below). Each candidate
# carries its own `owner`/`owner_field` pair, same rule as the singular form.
# It is not the same thing as `owner = "*"` (`metadata_attachments`): that
# owner is ANY kind at all, resolved from generic target columns; this one is
# a small, fixed set of typed columns, at most one of which a given row sets.
#
# `label` is the other authored exception: the reader-facing facet title on
# the owner's page, for an owner-surfaced kind whose generic prefix-strip
# label (drop the owner's table name off the front, title-case the rest)
# either reads badly or cannot even apply (`entities`' irregular plural strips
# to `entitie_`, which none of its owned kinds' columns start with). Editorial
# wording is authored data like everything else here — never a code table
# beside the projection that renders it — and applies wherever the kind is
# owner-surfaced, carrier page or not.
#
# Placement (which docs section, which family) stays in `sections.toml`. This
# file answers only whether a kind surfaces at all, and in what shape.
#
# TOML FOOTGUN, DO NOT REPEAT IT
#
# A bare `key = value` written after an `[[array_of_tables]]` header attaches to
# that array's LAST ELEMENT, not to the document root. `no_page_namespaces` in
# `sections.toml` was silently dead for exactly this reason. Root scalars belong
# above the first `[[kinds]]` header, nowhere else.

# ---------------------------------------------------------------------------
# page — a subject of its own
# ---------------------------------------------------------------------------

