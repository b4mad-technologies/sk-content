# ---------------------------------------------------------------------------
# none — no reader surface, and why
# ---------------------------------------------------------------------------

[[kinds]]
kind = "item_definitions"
surface = "none"
reason = "Legacy authoring shape: item_definition_overlay writes it straight into the matching entity_definitions row (by item_def_id); no distinct row or table exists to show."

[[kinds]]
kind = "anchor_kind_definitions"
surface = "none"
reason = "Parse/resolution handler for a spatial anchor (H3Cell or PlaceNode); no authored rows and no reader page built for it yet. Kernel-registered (manifest-natural-keys 1.1), so sk diff -k can see an edit, but publishing a page is separate work."

[[kinds]]
kind = "metadata_attachments"
surface = "owner"
owner = "*"
# The kernel registers no key for this table, and an attachment reaches a page
# as a parsed payload rather than as the authored row, so whole-row comparison
# can never recognise it. These three columns do: measured unique across all
# 3444 authored rows in the SRD bundle.
id_fields = ["target_kind", "target_ref", "namespace"]
note = """
Provenance: which source a subject's text came from, and under which licence.
It already renders on every entry page through catalogueProvenanceCandidates,
so calling it "no reader surface" was a contradiction inside this very file.

The owner is polymorphic — each row names its own target through target_kind
plus target_ref rather than belonging to one fixed kind — which is what the
`*` means here.
"""


[[kinds]]
