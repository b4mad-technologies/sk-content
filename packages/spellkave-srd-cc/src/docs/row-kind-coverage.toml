note = """
Standing work the world does on its own: "damages every occupant of the room
every 6 seconds for 3 pulses, attributed to the fire entity". A player meets
that rule and a DM steers it. The row is authored with a description, an
anchor place, a firing boundary and an enabled flag — not operational
plumbing, which is what an earlier reading of this file wrongly called it.
"""

