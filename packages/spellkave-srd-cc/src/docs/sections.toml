noun_singular = "resource"
noun_plural = "resources"

# ---------------------------------------------------------------------------
# identity_namespaces — which tag NAMESPACE names an entity of this family
# itself, as opposed to a tag it merely carries as vocabulary or linkage
# (sk-jay0.3.5.65, sk-jay0.3.5.61). The website's "belongs to this entity"
# block on a catalogue entry page only fires for a family listed here: an
# entity's own identity tag is the one tag among its own tags whose
# NAMESPACE (everything before the last dot segment) is exactly the
# `namespace` declared for its family below AND whose last segment equals
# its own slug — both conditions, not either. Matching on the slug alone is
# a coincidence detector, not an authored rule: the spell "Divination"
# carries `srd.spell.school.divination` as ordinary school membership, and
# that tag's last segment happens to equal the spell's own slug too; without
# the namespace check the website would treat the other thirty Divination
# spells as "belonging to" the spell Divination, which is wrong — they share
# a school, they are not owned by it.
#
# Declared ONLY where the relationship really is ownership: a class owns its
# subclasses and class features, a subclass owns its class features, a
# species owns its traits. `class-feature` deliberately has NO row: the
# same class feature id can legitimately appear once per class that grants
# it (sk-jay0.3.5.61), so "this class feature's own page" is never itself an
# owner — it only ever shows up as someone else's child. A family absent
# from this table gets no "belongs to" block at all.
[[identity_namespaces]]
family = "class"
namespace = "srd.class"

[[identity_namespaces]]
family = "subclass"
namespace = "srd.subclass"

[[identity_namespaces]]
family = "species"
namespace = "srd.species"

