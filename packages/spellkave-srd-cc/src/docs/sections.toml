# The chapter names about thirty-six tools; twenty-nine exist. The missing seven
# (Disguise Kit, Forgery Kit, Navigator's Tools, Poisoner's Kit and three Gaming
# Set variants) are a content gap, filed separately — the list shows what the
# ruleset actually holds rather than waiting for the rest.
