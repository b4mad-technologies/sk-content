ref_prefix = "srd.spell.school."

# `tag` is the third form, for a set the data names but no ref prefix gathers.
# The four origin feats are Alert, Magic Initiate, Savage Attacker and Skilled —
# spread across `srd/feat/` with nothing in their ids to tell them from the
# other thirteen. The tag `srd.feat.origin` is what says they belong together,
# so the tag is what the row asks for.
[[article_catalogue_lists]]
section = "gameplay-toolbox"
article = "gameplay-toolbox-creating-a-background"
title = "Origin feats in this ruleset"
tag = "srd.feat.origin"
# The same tag rides on a capability that grants Alert's initiative proficiency.
family = "feat"

# The fourth form, and the one row that covers thirty chapters.
#
# A monster group chapter — Goblins, Bugbears, Black Dragons — introduces a
# family whose members this bundle holds as creatures with their own pages, and
# nothing in the data groups them: `srd.creature_type.fey` is shared by Goblins
# AND Hobgoblins, `family` is "monster" for all 331, the role tags cut across
# groups entirely, and no ref prefix survives the naming (a chapter's members
# are `black-dragon-wyrmling` and `adult-black-dragon` — the age comes first).
#
# What DOES name them is the chapter's own text: one `###` heading per member,
# the same text each creature page was authored from. So the rule is authored
# once and the members are read out of each chapter, never copied into a list.
# Verified over all 31 group chapters: 85 headings, 85 creatures, no miss and
# nothing unwanted — and any heading that stops resolving fails the projection.
#
# `article_prefix` rather than `article` because this is one rule for a run of
# chapters. Black Dragons is the exception that proves the shape: its stat
# blocks were already replaced by embedded subjects (`collections.toml`), so it
# has no headings left and simply gets no list.
[[article_catalogue_lists]]
section = "monsters"
article_prefix = "monsters-a-z-"
title = "In this ruleset"
from_headings = "srd/creature/{slug}"
