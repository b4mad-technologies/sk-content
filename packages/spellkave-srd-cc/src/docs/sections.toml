# ---------------------------------------------------------------------------
# entity_owner_routes — entity definitions that render on ANOTHER entity's page
# rather than getting one of their own (sk-jay0.3.5.72).
#
# `entity_routes` above answers "which section does this entity's own page land
# in". This table answers the opposite question: which entity's page HOSTS a
# family that deliberately has no page. A fighting-style option is a menu member
# — "Archery" alone explains nothing, it is a thing you pick at Fighter level 1
# — so it belongs on the Fighter's page, listed with its level and choice group.
#
# The host is NOT discoverable from the data. A natural weapon is named by the
# creature that equips it, so the reader who names it can be found by looking;
# nothing on a class page mentions its advancement choices at all. The link runs
# the other way, through the option's own metadata attachment, and only an
# authored row can say which field of which namespace carries it.
#
#   prefix       — the id namespace of the hosted family
#   namespace    — the metadata attachment carrying the parent reference
#   field        — the payload field naming the parent, as a bare slug
#   owner_prefix — prepended to that slug to form the owning entity's id
#   label        — the heading the hosted rows appear under
[[entity_owner_routes]]
prefix = "srd/advancement-choice-option/"
namespace = "srd.advancement_choice"
field = "class"
owner_prefix = "srd/class/"
label = "Advancement choices"


