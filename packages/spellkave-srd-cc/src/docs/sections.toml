# Authored docs placement data for the SRD compendium catalogue
# (sk-jay0.3.5.53). Loaded by ../docs/catalogue.ts the same way
# ../compendium-metadata.ts loads collections.toml (smol-toml, PACKAGE_ROOT
# relative path). This file is the single source of truth for WHERE a
# catalogued subject lands and WHAT it is called; catalogue.ts contains no
# hand-maintained placement or slug tables.

# ---------------------------------------------------------------------------
# Root-level scalars. TOML nesting rule: a bare `key = value` after any
# `[[array_of_tables]]` header attaches to that array's MOST RECENT element,
# not to this file's root table — so anything meant to be read as
# `SECTIONS_FILE.<key>` (not `SECTIONS_FILE.<table>[i].<key>`) must be
# declared here, before the first `[[entity_routes]]` below (found the hard
# way, sk-jay0.3.5.66: the now-removed `no_page_namespaces` field had
# silently nested inside the last `[[identity_namespaces]]` row since it was
# authored, so `SECTIONS_FILE.no_page_namespaces` was `undefined` and the Set
# built from it was empty; the real exclusion of `srd.dm_npc`/`srd.faction`/
# `srd.party` from a docs page only ever worked by accident, because the
# RETIRED `[[tag_sections]]` table also had no row for those namespaces, so
# `tagSectionForId`'s "no matching namespace" fallback returned `undefined`
# for them too. Consolidating tag placement onto one fixed `tags_section`
# below removes that accidental fallback. sk-jay0.3.5.76 later removed
# `no_page_namespaces` itself: the owner ruled those three namespaces get tag
# pages like every other tag, so the exclusion mechanism had no remaining
# consumer).

# Every `tag_value_definition` catalogue subject routes to this ONE section
# id (sk-jay0.3.5.66), published under its own multi-segment route
# mirroring the tag id's own namespace structure (see `tagPathSlug` in
# catalogue.ts). The former `[[tag_sections]]` table placed a tag beside its
# related entities by namespace (`srd.cr` -> monsters, `srd.spell.school` ->
# spells, …); that per-chapter scattering is retired along with the table —
# every tag now lives under `/docs/srd/tags/...` instead, so there is no
# longer a per-namespace decision to author.
tags_section = "tags"

# The one section every mechanics row kind publishes under. Its route carries
# the kind as its first path segment, so `srd/attack/opportunity-attack` lands
# at `/docs/srd/mechanics/actions/attack/opportunity-attack` and the namespace
# index pages fall out of the path structure with no new page kind — the same
# shape `tags_section` above gave the tag vocabulary.
mechanics_section = "mechanics"


# ---------------------------------------------------------------------------
# resource_routes — placement for `resource_definition` catalogue subjects.
#
# First matching `prefix` wins (same precedence rule `entity_routes` uses). An
# id no row matches falls to `mechanics_section` above, never to a hard-coded
# default: that is what places a non-SRD bundle's own resources (`dm/...`,
# `elven_mini/quest/...`) beside its other mechanics rows, the same way
# `[[kind_sections]]` places every other mechanics row kind — those bundles
# declare a `mechanics` section on their own docs page but no SRD-shaped id
# namespace, so no row here should ever try to match their ids.
#
# The class rows exist because a class resource (barbarian rage uses, bard
# inspiration die, ...) reads as part of that class's own page, not as a
# generic "playing the game" mechanic. `magic_item`/`dragonborn`/`orc` route
# their own per-item and per-species resources the same way. The final
# `srd/` row is the catch-all every other SRD resource (ability scores, HP,
# AC, XP, death saves, ...) falls through to — kept explicit, not implicit,
# so an id matching no more specific SRD row still lands in `playing-the-game`
# rather than accidentally falling all the way to `mechanics_section`.
[[resource_routes]]
prefix = "srd/barbarian/"
section = "classes"

[[resource_routes]]
prefix = "srd/bard/"
section = "classes"

[[resource_routes]]
prefix = "srd/cleric/"
section = "classes"

[[resource_routes]]
prefix = "srd/druid/"
section = "classes"

[[resource_routes]]
prefix = "srd/fighter/"
section = "classes"

[[resource_routes]]
prefix = "srd/monk/"
section = "classes"

[[resource_routes]]
prefix = "srd/paladin/"
section = "classes"

[[resource_routes]]
prefix = "srd/ranger/"
section = "classes"

[[resource_routes]]
prefix = "srd/rogue/"
section = "classes"

[[resource_routes]]
prefix = "srd/sorcerer/"
section = "classes"

[[resource_routes]]
prefix = "srd/warlock/"
section = "classes"

[[resource_routes]]
prefix = "srd/wizard/"
section = "classes"

[[resource_routes]]
prefix = "srd/magic_item/"
section = "magic-items"

[[resource_routes]]
prefix = "srd/dragonborn/"
section = "character-origins"

[[resource_routes]]
prefix = "srd/orc/"
section = "character-origins"

[[resource_routes]]
prefix = "srd/cost_cp"
section = "equipment"

[[resource_routes]]
prefix = "srd/weight_lb10"
section = "equipment"

[[resource_routes]]
prefix = "srd/armor_"
section = "equipment"

[[resource_routes]]
prefix = "srd/"
section = "playing-the-game"

# ---------------------------------------------------------------------------
# entity_routes — placement for `entity_definition` catalogue subjects.
#
# Every catalogued entity id already lives under a root id prefix that names
# its authored editorial home (`srd/spell/acid-arrow`, `srd/item/longsword`).
# PRECEDENCE: catalogue.ts tries `prefix` first — the id namespace an entity
# is generated under is a stronger placement signal than any tag it happens
# to carry, because a tag is only a vocabulary claim ("this counts as a
# weapon for rule-matching purposes") and one entity can honestly carry two
# (`srd/item/potion-of-healing` is generated under the plain-item prefix but
# also carries `srd.magic_item`, reusing the magic-item rarity/category tag
# vocabulary for its own rules — that tag claim must not move it out of
# equipment). `tag` is the fallback, used only when an entity's id matches
# none of the prefixes below at all (hand-written unit-test fixtures that
# omit a real `srd/...` id; every real generated entity always matches one
# of these prefixes, verified against the committed fixtures — see the
# sk-jay0.3.5.53 report for the full audit, which found prefix-first
# reproduces all 1951 catalogued entities' served routes with zero
# exceptions).
[[entity_routes]]
tag = "srd.class_feature"
prefix = "srd/class-feature/"
family = "class-feature"
section = "classes"

[[entity_routes]]
tag = "srd.spell"
prefix = "srd/spell/"
family = "spell"
section = "spells"

[[entity_routes]]
tag = "srd.monster"
prefix = "srd/creature/"
family = "monster"
section = "monsters"

[[entity_routes]]
tag = "srd.magic_item"
prefix = "srd/magic_item/"
family = "magic-item"
section = "magic-items"

[[entity_routes]]
tag = "srd.feat"
prefix = "srd/feat/"
family = "feat"
section = "feats"

[[entity_routes]]
tag = "srd.class"
prefix = "srd/class/"
family = "class"
section = "classes"

[[entity_routes]]
tag = "srd.subclass"
prefix = "srd/subclass/"
family = "subclass"
section = "classes"

[[entity_routes]]
tag = "srd.species"
prefix = "srd/species/"
family = "species"
section = "character-origins"

[[entity_routes]]
tag = "srd.background"
prefix = "srd/background/"
family = "background"
section = "character-origins"

[[entity_routes]]
tag = "srd.trait"
prefix = "srd/trait/"
family = "trait"
section = "character-origins"

[[entity_routes]]
tag = "srd.weapon"
prefix = "srd/weapon/"
family = "weapon"
section = "equipment"

[[entity_routes]]
tag = "srd.armor"
prefix = "srd/armor/"
family = "armor"
section = "equipment"

[[entity_routes]]
tag = "srd.tool"
prefix = "srd/tool/"
family = "tool"
section = "equipment"

# A pregenerated character is a finished character to read while making one, so
# it lands beside character creation rather than beside the monsters its
# `srd.creature` tag would otherwise have suggested. It carries no tag that
# routes anywhere (`srd.creature` is not `srd.monster`), so the prefix is the
# whole rule — sk-jay0.3.5.75.
[[entity_routes]]
prefix = "srd/pregen/"
family = "pregen"
section = "character-creation"

# The four class-choice menus, added for sk-jay0.3.5.72. Every one of these 41
# entities is a named option a player picks and then looks up by name — a
# warlock builds a character around the invocation list — and none of them had
# a page at all, because no route claimed their id namespace. They carry NO
# tags in the manifest, so `tag` is deliberately absent rather than invented:
# a route needs a prefix, and minting tag vocabulary nothing wears would be a
# claim about the world, not a placement decision. They land in `classes`
# beside `srd/class-feature/`, which is what their own descriptions call them.
[[entity_routes]]
prefix = "srd/eldritch-invocation/"
family = "class-feature"
section = "classes"

[[entity_routes]]
prefix = "srd/metamagic/"
family = "class-feature"
section = "classes"

[[entity_routes]]
prefix = "srd/divine-order/"
family = "class-feature"
section = "classes"

[[entity_routes]]
prefix = "srd/primal-order/"
family = "class-feature"
section = "classes"

# `srd.item` is the generic "this is equipment" tag every weapon/armor/tool/gear/
# magic-item ALSO carries, so it stays last: for the tag fallback pass (an
# id matching none of the prefixes above), every more specific equipment/
# magic-item tag must be tried first.
[[entity_routes]]
prefix = "srd/service/"
family = "item"
section = "equipment"

[[entity_routes]]
prefix = "srd/trinket/"
family = "item"
section = "equipment"

[[entity_routes]]
prefix = "srd/catalogue/"
family = "item"
section = "equipment"

[[entity_routes]]
tag = "srd.item"
prefix = "srd/item/"
family = "item"
section = "equipment"

# ---------------------------------------------------------------------------
# section_primary_families — which catalogue `family` values ARE a section's
# own subject, for the website's section-page listing (sk-jay0.3.5.64). This
# is presentation grouping, not placement: it never moves an entry between
# sections (`section` above already decided that), it only decides whether an
# entry the section already carries renders in that section's headline list
# or in a secondary, family-grouped list further down the same page. A
# section absent here (only "character-creation" today, plus every non-SRD
# bundle section, which never appears in this file at all) declares no
# primary family, so its whole catalogue listing stays secondary — for
# character-creation that is fine because its page already leads with its
# authored Articles before any catalogue listing renders (see
# DocsPageOverview.svelte); a non-SRD bundle keeps listing everything
# ungrouped, exactly as before this table existed, because its section id
# never matches an `entity_routes` row at all (and every tag now routes to
# the one fixed `tags_section`, never through this table). This table
# (plus `family_headings` below) is read ONLY at build time, by the
# website's `project-metadata-docs.ts` (via `srd-sections.ts`), which
# projects the per-section result onto `DocsSection.primary_families` and
# the once-per-index `DocsIndexV1.family_headings` — the browser-side
# `srd-catalogue-groups.ts` consumes only that already-projected plain data
# and never reads this file itself (it must not: `srd-sections.ts` uses
# `node:fs`, which cannot ship into the client bundle).
[[section_primary_families]]
section = "classes"
family = "class"

[[section_primary_families]]
section = "monsters"
family = "monster"

[[section_primary_families]]
section = "spells"
family = "spell"

[[section_primary_families]]
section = "magic-items"
family = "magic-item"

[[section_primary_families]]
section = "feats"
family = "feat"

[[section_primary_families]]
section = "equipment"
family = "weapon"

[[section_primary_families]]
section = "equipment"
family = "armor"

[[section_primary_families]]
section = "equipment"
family = "tool"

[[section_primary_families]]
section = "equipment"
family = "item"

[[section_primary_families]]
section = "character-origins"
family = "species"

[[section_primary_families]]
section = "character-origins"
family = "background"

[[section_primary_families]]
section = "character-origins"
family = "trait"

[[section_primary_families]]
section = "playing-the-game"
family = "resource"

[[section_primary_families]]
