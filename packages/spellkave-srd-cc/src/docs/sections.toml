# ---------------------------------------------------------------------------
# family_headings — the heading text a secondary (non-primary) catalogue
# group renders under on a section page, plus the singular/plural noun its
# CatalogueList's own "N ___" count phrase uses (so a collapsed "Class
# features (352)" `<details>` opens onto "352 class features", never the
# generic "352 reference entries" — sk-jay0.3.5.64 round 2). Keyed by
# `family` (never by section: a family that is secondary anywhere reads the
# same heading and noun wherever it shows up). `noun_singular`/`noun_plural`
# are authored explicitly rather than mechanically pluralized from `heading`
# because English does not derive one from the other reliably here
# ("Vocabulary" the heading vs. "vocabulary entry"/"vocabulary entries" the
# noun; "Subclasses" vs. singular "subclass"). Only families that are ever
# secondary for at least one SRD section need a row here; a family absent
# from this table falls back to a plain humanized form of its own name (see
# `headingForFamily`/`fallbackNoun` in the website's
# `srd-catalogue-groups.ts`) rather than a hand-maintained TypeScript lookup
# table.
[[family_headings]]
family = "pregen"
heading = "Pregenerated characters"
noun_singular = "pregenerated character"
noun_plural = "pregenerated characters"

[[family_headings]]
family = "tag"
heading = "Vocabulary"
noun_singular = "vocabulary entry"
noun_plural = "vocabulary entries"

[[family_headings]]
