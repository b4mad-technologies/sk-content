# ---------------------------------------------------------------------------
# resource_blocks / resource_groups — the order and grouping a subject's own
# resource values are shown in on its page.
#
# A creature carries its authored numbers as `entity_definition_initial_state`
# rows, which reach the page as resource rows with the creature's own value.
# Listed the way a Map iterates them, that is alphabetical by id — ac, cha,
# con, dex, hp, … — an order no reader of the printed block expects. The
# printed stat block opens with defence, then movement, then the six ability
# scores in their fixed order, then the challenge line. That sequence is an
# editorial decision about presentation; nothing in the rows derives it, which
# is why it is authored here rather than coded in the reader.
#
# A value no group names is NOT dropped: it lands in the block's trailing
# group, named by `rest_title`. So authoring a new resource onto a creature
# always reaches the reader, and this table only decides where it sits.
#
# Measured over the 331 creature fixtures, exactly 14 distinct state ids are
# authored: the twelve every creature carries, plus `srd/spell_slot_1` and
# `srd/spell_slot_2` on the 48 casters. The speed ids beyond walking are
# defined resources that no creature seeds yet (sk-jay0.3.10); they are named
# here so the day one is authored it appears beside the walking speed instead
# of in the trailing group.
# ---------------------------------------------------------------------------

[[resource_blocks]]
family = "monster"
heading = "Statistics"
rest_title = "Other authored values"

[[resource_groups]]
family = "monster"
title = "Defense"
resources = ["srd/ac", "srd/hp"]

[[resource_groups]]
family = "monster"
title = "Speed"
resources = ["srd/speed-walk", "srd/speed-fly", "srd/speed-swim", "srd/speed-climb", "srd/reach_mm"]

[[resource_groups]]
family = "monster"
title = "Ability Scores"
resources = ["srd/str", "srd/dex", "srd/con", "srd/int", "srd/wis", "srd/cha"]

[[resource_groups]]
family = "monster"
title = "Challenge"
resources = ["srd/xp_value", "srd/proficiency_bonus"]

[[resource_groups]]
family = "monster"
title = "Spellcasting"
resources = ["srd/spell_slot_1", "srd/spell_slot_2"]

# ---------------------------------------------------------------------------
# Article link vocabulary — which chapters running prose may link to.
#
# The reader links rules terms inside an article's text to the page that
# defines them. The candidate labels are article titles, matched without regard
# to case, because a rules term is not a proper noun: the chapter "Combat" is
# written "combat" in a sentence.
#
# That match is only safe for a section whose article titles ARE rules terms.
# The glossary is exactly that (156 definitions: Attack Roll, Difficult
# Terrain, Prone). "Playing the Game" is too — its nine chapters are the
# activities the rules are about, and its opening sentence names three of them
# ("social interaction, exploration, and combat").
#
# Other sections title their articles by position in the book, not by meaning:
# the spells chapter has articles called "Range", "Effects" and "Targets", and
# linking every occurrence of "range" to the spellcasting chapter is wrong
# wherever the word means a weapon's range. Those sections stay out, which is
# why this is a list of what opts in rather than a list of exceptions.
#
# A section absent here still HAS its articles linked FROM elsewhere by ordinary
# authored links; it only stops donating its titles as automatic targets.
# ---------------------------------------------------------------------------

[[article_link_sections]]
section = "rules-glossary"

[[article_link_sections]]
section = "playing-the-game"

# ---------------------------------------------------------------------------
# Catalogue lists under a chapter — what this ruleset holds for what it just
# described.
#
# A chapter prints a table of rules the bundle also defines as executable
# entries, and the reader has no way from one to the other. The SRD's Actions
# table is the case that prompted this: all twelve of its rows exist here as
# capabilities, two of them (Dodge, Help) with a full action/affordance/outcome
# chain, and the table reaches none of them. The table itself stays as the SRD
# printed it; the list goes underneath.
#
# The refs are listed rather than derived because no rule picks out these twelve
# and only these. They share the prefix `srd/action/` with twelve more entries
# that are internal plumbing (Apply In Darkness, Drop Prone, the rest actions),
# and they share the tag `srd.action` with all of them. What makes these twelve
# a set is the source table, which is editorial, so it is authored — and
# `article-catalogue-list.test.ts` reads that table out of the chapter body and
# fails if the two ever disagree.
# ---------------------------------------------------------------------------

[[article_catalogue_lists]]
section = "playing-the-game"
article = "actions"
title = "In this ruleset"
refs = [
  "srd/action/attack",
  "srd/action/dash",
  "srd/action/disengage",
  "srd/action/dodge",
  "srd/action/help",
  "srd/action/hide",
  "srd/action/influence",
  "srd/action/magic",
  "srd/action/ready",
  "srd/action/search",
  "srd/action/study",
  "srd/action/utilize",
]

# A row either names its entries with `refs`, in the order the chapter prints
# them, or derives them with `ref_prefix`. Derived is the better form and the
# usual one: a weapon authored tomorrow reaches the reader without anyone
# remembering to edit a list. `family` narrows a prefix that spans families —
# `srd/armor/` names thirteen armors AND thirteen modifiers, `srd/feat/`
# seventeen feats and two capabilities. Derived entries are ordered by name;
# a named list keeps the chapter's own order.

[[article_catalogue_lists]]
section = "playing-the-game"
article = "proficiency"
title = "Skills in this ruleset"
ref_prefix = "srd/skill/"

[[article_catalogue_lists]]
section = "character-creation"
