# ---------------------------------------------------------------------------
# fact_namespaces — map from a catalogue fact's LABEL to the tag NAMESPACE
# that backs its value (sk-jay0.3.5.54 step 2), for facts that are entirely
# restatements of a tag the entity already carries. Equipment/feat/class
# facts (weapon damage, item cost/weight, feat prerequisite, class hit die,
# ...) have no tag counterpart and stay authored directly from typed source
# rows in `catalogue.ts` — this table never claims them. Read by
# `apps/website/src/compendium/project-metadata-docs.ts` at projection time:
# for a catalogued entity, find the ONE tag among its own
# `entity_definition_tag` rows matching `namespace` (itself or a
# `namespace.*` child — same ambiguity-checked lookup the old
# `factTagForNamespace` in `catalogue.ts` used; an entity that ALSO carries
# `namespace` itself bare, as its own self-identity tag, is skipped rather
# than treated as ambiguous or as a value — see `factTagForNamespace`'s own
# doc comment), then derive the fact's display value from that tag id's own
# last segment via `derive`. This is vocabulary-driven, not family-gated:
# every row is tried against every catalogued entity, regardless of the
# entity's own catalogue `family` string — a namespace unrelated to an
# entity's own vocabulary simply contributes no fact, so no `family` column
# is needed here to scope rows to "the spell rows" vs. "the monster rows".
#
# - "title": every word title-cased, space-joined (`evocation` -> "Evocation").
# - "kebab": every word lowercase, hyphen-joined (`bonus_action` -> "bonus-action").
# - "sentence": only the FIRST word capitalized, rest untouched, space-joined
#   (`90_feet` -> "90 Feet"... except real SRD range/duration text is
#   case-inconsistent at the source — see `fact_value_overrides` below for
#   the handful this rule alone cannot reproduce).
# - "level": spell level number -> "Cantrip" (0) or "Level <n>".
# - "cr": Challenge Rating slug -> bare number or "<n>/<d>" fraction, no "CR "
#   prefix (the prefix belongs to the tag CHIP label, not this fact).
# - "attunement": `required`/`none` -> "Requires Attunement" / "No Attunement
#   Required" (the two SRD magic-item attunement tag values).
[[fact_namespaces]]
label = "Level"
namespace = "srd.spell.level"
derive = "level"

[[fact_namespaces]]
label = "School"
namespace = "srd.spell.school"
derive = "title"

[[fact_namespaces]]
label = "Casting Time"
namespace = "srd.spell.casting_time"
derive = "kebab"

[[fact_namespaces]]
label = "Range"
namespace = "srd.spell.range"
derive = "sentence"

[[fact_namespaces]]
label = "Duration"
namespace = "srd.spell.duration"
derive = "sentence"

[[fact_namespaces]]
label = "Size"
namespace = "srd.size"
derive = "title"

[[fact_namespaces]]
label = "Type"
namespace = "srd.creature_type"
derive = "title"

[[fact_namespaces]]
label = "Challenge Rating"
namespace = "srd.cr"
derive = "cr"

[[fact_namespaces]]
label = "Category"
namespace = "srd.magic_item.category"
derive = "kebab"

[[fact_namespaces]]
label = "Rarity"
namespace = "srd.magic_item.rarity"
derive = "kebab"

[[fact_namespaces]]
label = "Attunement"
namespace = "srd.magic_item.attunement"
derive = "attunement"

# Equipment E3 (sk-jay0.3.5.59): weapon Category is the one equipment fact
# that DOES derive — `srd.weapon.category.<simple|martial>` reproduces it
# exactly (title-case, verified against all 38 weapons), with no
# self-identity collision (`srd.weapon.category` is never carried bare, only
# its `.simple`/`.martial` children). Everything else equipment-shaped
# (Range, Property, Mastery, Damage, Cost, Weight, all armor numbers, plain
# item Category) and feat Category (blocked by the SAME self-identity guard
# that keeps the subclass "Class" fact out — every feat entity carries the
# bare `srd.feat` tag alongside its own `srd.feat.<category>` child) stays
# authored in the residual — see `docs/catalogue.ts`'s own `equipmentFactsById`
# header for the full per-row finding.
[[fact_namespaces]]
label = "Category"
namespace = "srd.weapon.category"
derive = "title"

# ---------------------------------------------------------------------------
# fact_value_overrides — authored exceptions where `derive` above cannot
# mechanically reproduce the served wording, because the underlying SRD
# source text is itself case-inconsistent (Range's freeform values are
# capitalized — "Self", "Special" — while Duration's freeform values are not
# — "instantaneous", "special" — so no single casing rule fits both) or uses
# a different notation than the tag slug (Challenge Rating's fractional CRs
# are tagged `srd.cr.1-8` but the served fact reads the decimal source value
# "0.125", not "1/8"). Keyed by the shared TAG id, never by entity ref: every
# entity carrying a given tag reads the SAME override row, so this stays a
# small closed vocabulary override (7 rows, cache-verified against
# `cache/open5e/Spell.json` and `cache/open5e/Creature.json`), not a
# per-entity copy. Checked BEFORE the `derive` rule; an override always wins.
[[fact_value_overrides]]
tag = "srd.cr.1-8"
value = "0.125"

[[fact_value_overrides]]
