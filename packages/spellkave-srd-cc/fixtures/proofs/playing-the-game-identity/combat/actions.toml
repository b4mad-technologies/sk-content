[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd_proof"
capability_id = "srd_proof/check/attack-roll"
default_visibility = "Public"
description = "TEST-ONLY check capability for the Attack Rolls live proof (target-seeded AC 10, read via target.effective('srd/ac') — Equipment slice E1's F2 closure): proves the let-bound single-roll nat-20/nat-1 override parses through the verb layer and the wasm validator, and evaluates consistently with the engine's own admit/reject against a REAL target fact, not a baked literal."
display_name = "Attack roll (let-bound nat-20/nat-1 override, target.effective('srd/ac'))"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd_proof"
capability_id = "srd_proof/check/cover-grant"
default_visibility = "Public"
description = "TEST-ONLY check capability for the maxim-audit F1 Cover live proof: guaranteed-success gate (same boundary-DC trick as d20-easy/advantage-grant) whose success consequence lands the SHIPPED base-bundle 'srd/cover/half' condition on the manipulation's target via ApplyStatus — a cross-bundle reference, not a proof-authored condition."
display_name = "Grant Cover (maxim-audit F1 live proof — lands the shipped srd/cover/half condition)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd_proof"
capability_id = "srd_proof/check/attack-roll-cover"
default_visibility = "Public"
description = "TEST-ONLY check capability for the maxim-audit F1 Cover live proof (target-seeded base AC 10; the 'srd/cover/half' condition, once landed by cover-grant, widens it to 12): SAME predicate shape as the plain attack-roll check — proves the shipped condition's own modifier composes into target.effective('srd/ac'), not a generation-time coverModifiedAcExpr transform (retired)."
display_name = "Attack roll (target.effective('srd/ac'), vs a Half-Cover-conditioned target)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd_proof"
capability_id = "srd_proof/reaction-resolution"
