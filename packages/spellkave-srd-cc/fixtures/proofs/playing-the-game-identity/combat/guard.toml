bundle_id = "srd_proof"
description = "TEST-ONLY second actor for the generic-check verb rework (slice 2), plus the generic Unarmed Strike Damage live proof — a REAL actor blueprint, not an inert prop like training-dummy, carrying its own srd/int score, the srd/dc/athletics (guaranteed-failure override, the torn-down d20-impossible's own construction) and srd/dc/persuasion (0 sentinel, no override) states the Athletics-impossible and Persuasion-derived checks read against it (the design draft's own 'persuade the guard' shape), plus real srd/ac and srd/hp target facts for the shipped Unarmed Strike (finding #35 — every target an action can act against must carry every state its predicate and consequence touch, not just the ones it already needed). C5 (Step-5 derived numbers): also the CHECKING actor for the stealth-vs-passive-perception live proof (checks.ts) — carries its own srd/dex seed and srd/skill/stealth proficiency, chosen so its total Stealth modifier lands the guaranteed-success boundary trick exactly on the hero's own derived Passive Perception DC (checks.ts's own header)."
