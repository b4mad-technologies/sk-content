[[entity_definitions]]
affordance_seed_id = ""
bundle_id = "srd_proof"
description = "TEST-ONLY hero blueprint carrying inherited srd/skill/perception + srd/skill/athletics capabilities, proof Dexterity-save proficiency, and definition-level str/dex/con/int/wis/cha/level plus srd/hp seeds (C3: all six ability scores are the Fighter Standard Array column, `character-creation.md:355`) — proves the Playing the Game ability/skill identity rows are usable by a real entity, not just well-formed TOML. Tagged with the C1/C2 identity vocabulary (C3 'vocabulary never ships unattached' addendum): one srd.alignment.* value and two srd.language.* values, both authorial choices (see this file's own header). O1 (Character Origins): also tagged with the Soldier background (srd.background.soldier, authorial choice) and granted its concrete Intimidation + Gaming Set (Dice) proficiency capabilities below. O2 (Character Origins Species): also tagged with the Human species (srd.species.human, srd.creature_size.medium, authorial choice) and seeded with its def-level srd/size (Medium) + srd/speed-walk (30 ft / 6 cells) structural facts — this file's own O2 header above. K1 (Classes): also tagged with the Fighter class (srd.class.fighter, authorial choice) — vocabulary only, this file's own K1 header above. K2 (Classes, Fighter vertical): also granted Second Wind's own capability + seeded with 2 srd/fighter/second-wind-uses — an EXPLICIT proof grant (this substrate has no class-definition inheritance), this file's own K2 header above."
display_name = "Identity Proof Hero"
