capability_id = "srd_proof/check/poisoned-check"
default_visibility = "Public"
description = "TEST-ONLY check capability for the CONDITIONS PACKAGE Poisoned live proof (contested DC 15): poisoned-grant already landed the condition on THIS same acting creature, so its internal ability-check-disadvantage sub-condition's actor-side Disadvantage modifier composes into this roll via the 'srd/ability_check' resolution scope."
display_name = "Strength check (Poisoned-biased, bare d20 — CONDITIONS PACKAGE live proof)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd_proof"
capability_id = "srd_proof/check/poisoned-cure"
default_visibility = "Public"
description = "TEST-ONLY cleanup capability: unconditionally removes BOTH conditions poisoned-grant landed on the ACTING creature — 'srd/condition/poisoned' and its sibling 'srd/condition/poisoned/ability-check-disadvantage' — via TWO explicit RemoveCondition writes. Each targets a PRIMARY row (`parent_row_id = None`, since poisoned-grant applies both via twin ApplyStatus, never `implies`) — `RemoveCondition`'s own `primary_condition_matches` (`remove_condition.rs`) only ever matches primary rows, so an implies-cascaded child could never have been targeted this way (confirmed live on this proof's first attempt, when the sibling WAS `implies`-linked: the cure silently no-opped on the child, corrupting later checks sharing the 'srd/ability_check' resolution scope) — the reason POISONED_DESCRIPTION's own removability finding rules out `implies` for this condition."
display_name = "Cure Poisoned (test cleanup — two independent RemoveCondition writes)"

