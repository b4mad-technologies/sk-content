affordance_seed_id = ""
bundle_id = "srd_proof"
description = "TEST-ONLY inert target for the slice-1b modifier-proof affordances — the flex actions are not self_eligible, so the pair needs a co-located target; carries the flexed counter the admitted act increments, (generic-check verb rework) the four DC-override states the Athletics-easy/WIS-contested/Perception-proficient/Insight-unproficient checks read, and (Equipment slice E1, F2 closure) its own seeded srd/ac — the unarmored formula's no-Dexterity branch, since this entity carries no srd/dex (finding finding #35: attack-roll/attack-roll-cover both now read target.effective('srd/ac'), so their target must carry the fact) — see the proof-scene design record for why seeding these here is harmless to every other check in this scene (none of them reads srd/dc/*, srd/int, or srd/ac)."
display_name = "Training Dummy"
