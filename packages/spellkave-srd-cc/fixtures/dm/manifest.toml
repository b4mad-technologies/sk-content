[[action_definitions]]
action_id = "dm/ask-about-advancement"
bundle_id = "dm"
cost_time_ms = 0
description = "Ask Aldwin what you need to know about growing stronger."
display_name = "Ask Aldwin About Advancement"
non_steering = true
on_failure = ""
on_success = "dm/ask-about-advancement/success"
required_capability = "dm/action/ask-about-advancement"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/steady-advance"
bundle_id = "dm"
cost_time_ms = 0
description = "Draft the AVERAGE-HP advance to the next level: the flat srd/hp_per_level value instead of rolling 1d10. Drafts only — level-up/confirm executes it. Revisable: firing level-up/daring-advance afterward overwrites this draft, and vice versa. Gated on the shared XP threshold AND a seeded srd/hp_per_level (average HP is undefined without a class; a missing fact evaluates false, ADR-0035 D-4)."
display_name = "Take the average Hit Points"
non_steering = true
on_failure = ""
on_success = "dm/level-up/steady-advance/success"
required_capability = "dm/action/level-up/steady-advance"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/daring-advance"
bundle_id = "dm"
cost_time_ms = 0
description = "Draft the ROLLED-HP advance to the next level: roll 1d10 instead of the flat srd/hp_per_level average (the roll happens AT CONFIRM time, never here). Drafts only. Revisable: firing level-up/steady-advance afterward overwrites this draft, and vice versa. Gated ONLY on the shared XP threshold."
display_name = "Roll for Hit Points (1d10)"
non_steering = true
on_failure = ""
on_success = "dm/level-up/daring-advance/success"
required_capability = "dm/action/level-up/daring-advance"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/confirm"
bundle_id = "dm"
cost_time_ms = 0
description = "Execute the drafted level-up choice: srd/level +1, srd/hp += hp_per_level ('Take the average Hit Points') or 1d10 ('Roll for Hit Points (1d10)', rolled NOW), via ONE branching cond(...) delta_source, then resets the draft and the offer-accepted latch to 0 in the SAME dispatch. Gated on the shared XP threshold AND a non-zero draft."
display_name = "Confirm the level-up with Aldwin"
non_steering = true
on_failure = ""
on_success = "dm/level-up/confirm/success"
required_capability = "dm/action/level-up/confirm"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/discard"
bundle_id = "dm"
cost_time_ms = 0
description = "Tell Aldwin to forget the drafted level-up choice — zeroes the draft, nothing else. Gated on a non-zero draft only: nothing to discard otherwise."
display_name = "Discard the drafted choice"
non_steering = true
on_failure = ""
on_success = "dm/level-up/discard/success"
required_capability = "dm/action/level-up/discard"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/accept-offer"
bundle_id = "dm"
cost_time_ms = 0
description = "Accept Aldwin's offer to step into the advancement limbo and take the level you have earned. Drafts the consent latch only — Aldwin's own teleport sibling carries you there. Gated on the shared XP threshold."
display_name = "Accept Aldwin's offer"
non_steering = true
on_failure = ""
on_success = "dm/level-up/accept-offer/success"
required_capability = "dm/action/level-up/accept-offer"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/decline-offer"
bundle_id = "dm"
cost_time_ms = 0
description = "Tell Aldwin you are not ready to take the level yet — zeroes the consent latch, and closes the current drafting phase. Gated on the shared XP threshold so it only appears beside the offer."
display_name = "Decline Aldwin's offer"
non_steering = true
on_failure = ""
on_success = "dm/level-up/decline-offer/success"
required_capability = "dm/action/level-up/decline-offer"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/offer-level-up"
bundle_id = "dm"
cost_time_ms = 0
description = "The level-up condition lives IN THE WORLD as authored DSL. Gate mirrors the shared XP-threshold gate, read from Aldwin's side (target.stat(...)). Advisory ONLY: no world writes — exists purely so a seat can observe it appearing and speak the offer."
display_name = "Offer a Level Up"
non_steering = true
on_failure = ""
on_success = "dm/offer-level-up/success"
required_capability = "dm/action/offer-level-up"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/apply-level-up"
bundle_id = "dm"
cost_time_ms = 0
description = "Gate: trainee srd/level is strictly above Aldwin's last-applied latch (monotonic level latch, operator Q2). ADR-0096 D-5: the seat applies class-feature grants BEFORE this dispatch — the grant itself never lives in this consequence. Latch write advances the marker by exactly one level (sk-tyhy) — a trainee who crossed two thresholds in one XP grant gets two applies, one ceremony per level, the correct SRD choreography. Fighter Action Surge charge still seeds here when that resource exists on the body (L2 fighter path); other classes ignore a missing pool."
display_name = "Apply the Level Up"
non_steering = true
on_failure = ""
on_success = "dm/apply-level-up/success"
required_capability = "dm/action/apply-level-up"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

[[action_definitions]]
action_id = "dm/level-up/enroll"
bundle_id = "dm"
cost_time_ms = 0
description = "Zero-delta ModifyResource seed-and-apply for Aldwin's own level-up-applied latch and the trainee's own pending-hp-choice draft, and the offer-accepted consent latch — mechanical, ungated (must fire against a completely unseeded trainee), never a dialogue speech act."
display_name = "Enroll Level-Up Candidate"
non_steering = true
on_failure = ""
on_success = "dm/level-up/enroll/success"
required_capability = "dm/action/level-up/enroll"
resolution_mode = "Deterministic"
resolution_predicate_source = ""
resumable = false
self_eligible = false
self_only = false
session_def_id = ""

