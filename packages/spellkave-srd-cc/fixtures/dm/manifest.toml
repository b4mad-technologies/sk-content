[[resource_definitions]]
bundle_id = "dm"
description = "Aldwin's last-applied character level latch (operator Q2 / L9): seeded at 1 (every hero starts at character level 1, no ceremony owed for that starting level), N = ceremony completed through hero level N. ACTOR-carried on Aldwin; gate is latch < hero level. sk-tyhy: seeded at 1 (not 0) because the apply consequence now advances this latch by exactly 1 per apply (see `applyLevelUpCalls`'s own deltaSource comment) rather than snapping it to the hero's current level — a 0 seed would cost the FIRST-ever ceremony an extra phantom apply just to catch up from 0 to the hero's actual starting level of 1."
display_name = "Level-Up Applied (Aldwin)"
initial_value = 1
max_value = 20
min_value = 0
recovery_rule = "persistent"
resource_definition_id = "dm/aldwin/level-up-applied"
value_kind = "int"

[[resource_definitions]]
bundle_id = "dm"
description = "D11 draft-then-commit wizard: 0 = no draft, 1 = steady (average HP) drafted, 2 = daring (rolled HP) drafted. Revisable — re-choosing overwrites (set-to-exact-value idiom). level-up/confirm resets this to 0 in the same dispatch it executes the level-up."
display_name = "Pending HP-Growth Choice (level-up wizard)"
initial_value = 0
max_value = 2
min_value = 0
recovery_rule = "persistent"
resource_definition_id = "dm/level-up/pending-hp-choice"
value_kind = "int"

[[resource_definitions]]
bundle_id = "dm"
description = "sk-0m4.19 consent latch: 0 = not accepted (also the decline write), 1 = the hero accepted Aldwin's proactive offer. TARGET-carried on the trainee. Seeded in the dm bundle so the kavemouth hearth-return action can ModifyResource it; level-up/enroll still materialises the object_state row; the into-limbo teleport gates on 1; the hearth return clears it."
display_name = "Level-Up Offer Accepted"
initial_value = 0
max_value = 1
min_value = 0
recovery_rule = "persistent"
resource_definition_id = "dm/level-up/offer-accepted"
value_kind = "int"

