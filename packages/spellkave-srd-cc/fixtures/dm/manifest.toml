[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/ask-about-advancement"
default_visibility = "Public"
description = "Ask Aldwin what you need to know about growing stronger."
display_name = "Ask Aldwin About Advancement"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/steady-advance"
default_visibility = "Public"
description = "Draft the AVERAGE-HP advance to the next level: the flat srd/hp_per_level value instead of rolling 1d10. Drafts only — level-up/confirm executes it. Revisable: firing level-up/daring-advance afterward overwrites this draft, and vice versa. Gated on the shared XP threshold AND a seeded srd/hp_per_level (average HP is undefined without a class; a missing fact evaluates false, ADR-0035 D-4)."
display_name = "Take the average Hit Points"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/daring-advance"
default_visibility = "Public"
description = "Draft the ROLLED-HP advance to the next level: roll 1d10 instead of the flat srd/hp_per_level average (the roll happens AT CONFIRM time, never here). Drafts only. Revisable: firing level-up/steady-advance afterward overwrites this draft, and vice versa. Gated ONLY on the shared XP threshold."
display_name = "Roll for Hit Points (1d10)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/confirm"
default_visibility = "Public"
description = "Execute the drafted level-up choice: srd/level +1, srd/hp += hp_per_level ('Take the average Hit Points') or 1d10 ('Roll for Hit Points (1d10)', rolled NOW), via ONE branching cond(...) delta_source, then resets the draft and the offer-accepted latch to 0 in the SAME dispatch. Gated on the shared XP threshold AND a non-zero draft."
display_name = "Confirm the level-up with Aldwin"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/discard"
default_visibility = "Public"
description = "Tell Aldwin to forget the drafted level-up choice — zeroes the draft, nothing else. Gated on a non-zero draft only: nothing to discard otherwise."
display_name = "Discard the drafted choice"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/accept-offer"
default_visibility = "Public"
description = "Accept Aldwin's offer to step into the advancement limbo and take the level you have earned. Drafts the consent latch only — Aldwin's own teleport sibling carries you there. Gated on the shared XP threshold."
display_name = "Accept Aldwin's offer"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/decline-offer"
default_visibility = "Public"
description = "Tell Aldwin you are not ready to take the level yet — zeroes the consent latch, and closes the current drafting phase. Gated on the shared XP threshold so it only appears beside the offer."
display_name = "Decline Aldwin's offer"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/offer-level-up"
default_visibility = "Public"
description = "Allows Aldwin to see that a nearby creature has earned enough XP to level up, so his own seat can speak the offer."
display_name = "Offer a Level Up"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/apply-level-up"
default_visibility = "Public"
description = "Allows Aldwin to apply the level up he promised once the trainee's srd/level exceeds Aldwin's last-applied latch (per-level re-offerability, L9)."
display_name = "Apply the Level Up"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/level-up/enroll"
default_visibility = "Public"
description = "Allows Aldwin to enroll a fresh trainee — a mechanical, non-dialogue seed-and-apply of his own level-up-applied latch and the trainee's own pending-hp-choice draft (finding #35 class: neither resource's own initial_value auto-materialises as an object_state row until its owner's own first write)."
display_name = "Enroll Level-Up Candidate"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "dm"
capability_id = "dm/action/dialog/choose"
default_visibility = "Public"
description = "Fire a numbered answer offered by a talker."
