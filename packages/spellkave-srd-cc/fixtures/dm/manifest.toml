[metadata.docs]
intro = "The shared machinery every adventure reuses: the DM's numbered dialog answers, the character-creation and level-up handles, and the consent latch they write. Authored once here rather than in each adventure, and depended on by all of them. Rows carry the `dm` bundle id."
nav_group = "adventure"
page_id = "runtime"
title = "Adventure runtime"
version = 1

[[metadata.docs.sections]]
id = "mechanics"
intro = "What the DM's own seat can offer, resolve and change. These follow the same offer/resolution/consequence shape as the SRD's own rules, and are placed by the same rules, so an action here reads the way an action there does."
title = "Runtime rules"

