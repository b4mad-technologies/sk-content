[[metadata.docs.attributions]]
body = """
This work includes material from the System Reference Document 5.2 (“SRD 5.2”) by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2 is licensed under the Creative Commons Attribution 4.0 International License, available at https://creativecommons.org/licenses/by/4.0/legalcode.

This work includes material from the System Reference Document 5.2.1 (“SRD 5.2.1”) by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License, available at https://creativecommons.org/licenses/by/4.0/legalcode.

The normalized 5.2 JSON comes from [Open5e](https://github.com/open5e/open5e-api).
The 5.2.1 transcription comes from
[dnd-5e-srd-markdown](https://github.com/downfallx/dnd-5e-srd-markdown).
The converter’s original notice is in `MARKDOWN-LICENSE.md`. Exact fork
revisions and byte hashes are in `UPSTREAM.json`. Spellkave
selected, converted, and adapted these rules into executable manifests and
compendium documents.

`open5e-core/Language.json` comes from Open5e's 5e Core Concepts, derived
from the 2014 SRD. The pinned Open5e source credits Mike Mearls, Jeremy
Crawford, Chris Perkins, Rodney Thompson, Peter Lee, James Wyatt, Robert J.
Schwalb, Bruce R. Cordell, Chris Sims, and Steve Townshend, based on original
material by E. Gary Gygax and Dave Arneson. The source offers CC BY 4.0 and
OGL 1.0a. This distribution uses [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/legalcode).
Spellkave selected the language file and adapted language definitions into
manifest data. [Pinned Open5e core document](https://github.com/durandom/open5e-api/blob/d4276c586d79f2a27bf2b814aed151cf57605283/data/v2/open5e/core/Document.json)."""

[metadata.docs.attributions.source]
anchor = "Attribution"
license = "CC-BY-4.0"
path = "packages/spellkave-srd-cc/cache/NOTICE.md"

[[metadata.docs.attributions]]
body = """
SRD catalogue sprites
=====================

Copyright B4mad Technologies and Spellkave contributors.

These images are licensed under the Creative Commons Attribution 4.0
International License (CC BY 4.0):
https://creativecommons.org/licenses/by/4.0/legalcode

Suggested credit: "Spellkave art, CC BY 4.0".

Spellkave sprites for SRD catalogue entries: creatures, items, spells,
feats, species, backgrounds, skills, divine orders and character portraits.
The 387 magic item variants are composites of a base sprite and a badge from
`../../art/badge/`. They are original Spellkave material, generated with
PixelLab (https://www.pixellab.ai). The `.json` sidecar next to each image
records the generator, prompt, time and SHA-256 of the image bytes.

The SRD 5.2.1 names and rules text these images illustrate stay under their
own CC BY 4.0 grant and credit (see the repository NOTICE.md). The images are
not Wizards of the Coast material and do not imply endorsement.

Some images were generated with PixelLab. PixelLab's terms restrict using its outputs to train other models; that restriction may apply to you."""

[metadata.docs.attributions.source]
anchor = "SRD catalogue sprites"
license = "CC-BY-4.0"
path = "packages/spellkave-srd-cc/assets/srd-art/LICENSE"

