<text class="title-sub" x="16" y="38">Floor slice z=-3 · indoor</text>
<line class="title-rule" x1="12" y1="34" x2="1188" y2="34" />
</g>




<g data-node-id="srd_proof/cottage/cellar"><circle cx="58" cy="116" r="7" class="place" /><circle cx="70" cy="104" r="9" class="actor" /><text x="70" y="107.50" class="actor-label">1</text><text x="58" y="136" class="label">Cellar <tspan class="label-floor">(z=-3)</tspan></text></g>
<g class="map-chrome" data-chrome="legend" transform="translate(0 196)">
