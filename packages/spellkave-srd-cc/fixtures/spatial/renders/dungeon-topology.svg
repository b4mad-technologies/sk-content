<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="434" viewBox="0 0 1200 434" role="img" aria-label="srd_proof/dungeon — topology_only">
<style>
svg{font-family:Inter,system-ui,Arial,sans-serif}
.h3-cell{fill:#c9d8cf;fill-opacity:.32;stroke:#536758;stroke-width:1.4;stroke-opacity:.9}
.h3-cell--root{fill:#9bb8a8;fill-opacity:.45}
.h3-cell--settlement{fill:#d4b896;fill-opacity:.5}
.h3-cell--wilderness{fill:#b7c9b0;fill-opacity:.38}
.h3-cell--default{fill:#c9d8cf;fill-opacity:.28}
.place-portal{fill:#8b4513;stroke:#fff;stroke-width:2}
.portal-tag{fill:#6b3a12;font-size:9px;font-weight:600;text-anchor:middle}
.label-portal{font-weight:700}
.route{stroke:#b97012;stroke-width:3;stroke-linecap:round;opacity:.9}
.route-stairs{stroke:#6b4f9a;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 5;opacity:.95}
.place{fill:#148284;stroke:#fff;stroke-width:2.2}
.place-extent{fill:#148284;fill-opacity:.18;stroke:#0f5f61;stroke-width:1.5}
.grid-cell{fill:#148284;fill-opacity:.06;stroke:#0f5f61;stroke-opacity:.55;stroke-width:1}
.actor{fill:#245ebe;stroke:#fff;stroke-width:2}
.label{fill:#1d2428;font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.actor-label{fill:#fff;font-size:9px;font-weight:800;text-anchor:middle}
.chrome-label{fill:#3a454b;font-size:11px;font-weight:600;text-anchor:start}
.scale-bar{stroke:#3a454b;stroke-width:2;stroke-linecap:square}
.scale-bar-label{fill:#3a454b;font-size:11px;font-weight:700;text-anchor:middle}
.floor-box{fill:#e7efed;stroke:#7a9690;stroke-width:1.5;opacity:.95}
.floor-label{fill:#1d3a36;font-size:13px;font-weight:800;text-anchor:start}
.stairs-label{fill:#6b4f9a;font-size:11px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}
.title-main{fill:#14201e;font-size:15px;font-weight:800;text-anchor:start}
.title-sub{fill:#4a5a56;font-size:12px;font-weight:600;text-anchor:start}
.title-rule{stroke:#c5d0cc;stroke-width:1}
</style>
<rect width="100%" height="100%" fill="#f4f7f6" />
<g class="title-bar">
<text class="title-main" x="16" y="22">Forgotten Crypt</text>
<text class="title-sub" x="16" y="38">Topology layout (no metric positions) · indoor</text>
<line class="title-rule" x1="12" y1="34" x2="1188" y2="34" />
</g>



<line data-from="srd_proof/dungeon/entrance" data-to="srd_proof/dungeon/guard" x1="47" y1="215" x2="415.67" y2="215" class="route" />
<line data-from="srd_proof/dungeon/guard" data-to="srd_proof/dungeon/hall" x1="415.67" y1="215" x2="784.33" y2="215" class="route" />
<line data-from="srd_proof/dungeon/hall" data-to="srd_proof/dungeon/crypt" x1="784.33" y1="215" x2="1153" y2="92.11" class="route" />
<line data-from="srd_proof/dungeon/hall" data-to="srd_proof/dungeon/treasury" x1="784.33" y1="215" x2="1153" y2="337.89" class="route" />
<g data-node-id="srd_proof/dungeon/crypt"><circle cx="1153" cy="92.11" r="7" class="place" /><circle cx="1165" cy="80.11" r="9" class="actor" /><text x="1165" y="83.61" class="actor-label">1</text><text x="1153" y="112.11" class="label">Crypt</text></g>
<g data-node-id="srd_proof/dungeon/entrance"><circle cx="47" cy="215" r="7" class="place" /><text x="47" y="235" class="label">Entrance</text></g>
<g data-node-id="srd_proof/dungeon/guard"><circle cx="415.67" cy="215" r="7" class="place" /><circle cx="427.67" cy="203" r="9" class="actor" /><text x="427.67" y="206.50" class="actor-label">1</text><text x="415.67" y="235" class="label">Guard Room</text></g>
<g data-node-id="srd_proof/dungeon/hall"><circle cx="784.33" cy="215" r="7" class="place" /><text x="784.33" y="235" class="label">Great Hall</text></g>
<g data-node-id="srd_proof/dungeon/treasury"><circle cx="1153" cy="337.89" r="7" class="place" /><text x="1153" y="357.89" class="label">Treasury</text></g>
<g class="map-chrome" data-chrome="legend" transform="translate(0 394)">
<line x1="12" y1="0.5" x2="1188" y2="0.5" stroke="#c5d0cc" stroke-width="1" />
<g class="scale-bar-group" data-scale-metres="2" data-scale-px="122.89">
<line class="scale-bar" x1="12" y1="14" x2="134.89" y2="14" />
<line class="scale-bar" x1="12" y1="9" x2="12" y2="19" />
<line class="scale-bar" x1="134.89" y1="9" x2="134.89" y2="19" />
<text class="scale-bar-label" x="73.44" y="30">2 m</text>
</g>
<g class="symbol-legend" transform="translate(162.89 0)">
<circle cx="6" cy="14" r="6" class="place" />
<text class="chrome-label" x="18" y="18">place</text>
<line class="route" x1="62" y1="14" x2="86" y2="14" />
<text class="chrome-label" x="92" y="18">route</text>
<circle cx="148" cy="14" r="9" class="actor" />
<text class="actor-label" x="148" y="17.5">n</text>
<text class="chrome-label" x="164" y="18">occupants</text>
</g></g>
</svg>
