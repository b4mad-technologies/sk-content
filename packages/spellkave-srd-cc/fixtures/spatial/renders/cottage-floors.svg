<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="srd_proof/cottage — all_floors_offset floors=[-3,0]">
<style>
svg{font-family:Inter,system-ui,Arial,sans-serif}
.h3-cell{fill:#c9d8cf;fill-opacity:.32;stroke:#536758;stroke-width:1.4;stroke-opacity:.9}
