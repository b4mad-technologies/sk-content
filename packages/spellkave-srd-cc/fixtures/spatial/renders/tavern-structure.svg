<g data-node-id="srd_proof/tavern/bar"><circle cx="600" cy="634" r="7" class="place" /><text x="600" y="654" class="label">Bar</text></g>
<g data-node-id="srd_proof/tavern/kitchen"><circle cx="1142" cy="634" r="7" class="place" /><text x="1142" y="654" class="label">Kitchen</text></g>
<g data-node-id="srd_proof/tavern/booth"><circle cx="58" cy="92" r="7" class="place" /><text x="58" y="112" class="label">Private Booth</text></g>
<g data-node-id="srd_proof/tavern/stairs"><circle cx="600" cy="92" r="7" class="place" /><text x="600" y="112" class="label">Stairs</text></g>
<g class="map-chrome" data-chrome="legend" transform="translate(0 690)">
