[[trace_kind_definitions]]
bundle_id = "srd"
description = "An attack that missed, inscribed at the TARGET's own current place (TargetSpatialRef, never the target's entity — sk-oj6). Local visibility: free perception for anyone co-located with the target falls out for free, same as srd/speech. Carries a fixed authored 'label' string (the missed attack's display name + verb, e.g. 'Ranged Attack misses') and the target's entity id under 'addressee' (carry_addressee) — never a raw action/consequence id."
kind_id = "srd/attack-miss"
location_kinds = "place_node"
perceptible_for_ticks = 0
schema_json = '{"label":"string","addressee":"integer?"}'
