[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/acrobatics"
default_visibility = "Public"
description = "You can attempt an Acrobatics check when balance, agility, or controlled movement is relevant. Whether you add your proficiency bonus depends on your training."
display_name = "Check: Acrobatics"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/animal-handling"
default_visibility = "Public"
description = "You can make an Animal Handling check when you try to influence, calm, or understand an animal. Your proficiency applies if you have it."
display_name = "Check: Animal Handling"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/arcana"
default_visibility = "Public"
description = "You can attempt Arcana checks when the rules call for them. Whether you add your proficiency bonus depends on your Arcana proficiency."
display_name = "Check: Arcana"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/athletics"
default_visibility = "Public"
description = "You can attempt an Athletics check when the GM calls for one. Your proficiency, if any, is applied by the Athletics skill itself."
display_name = "Check: Athletics"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/cha"
default_visibility = "Public"
description = "You can attempt a Charisma check when the rules call for one. Proficiency, if applicable, is determined separately."
display_name = "Check: Charisma (raw ability)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/con"
default_visibility = "Public"
description = "You can attempt a Constitution check when the rules call for one. Your proficiency, if applicable, is determined separately."
display_name = "Check: Constitution (raw ability)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/deception"
default_visibility = "Public"
description = "You can make Deception checks when you try to mislead someone through words, behavior, or a false presentation. Your proficiency, if any, applies separately."
display_name = "Check: Deception"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/dex"
default_visibility = "Public"
description = "You can attempt a Dexterity check when the task calls for agility, balance, coordination, or quick movement."
display_name = "Check: Dexterity (raw ability)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/history"
default_visibility = "Public"
description = "You can make History checks when recalling or interpreting past events, people, and cultures. Your proficiency, if any, applies as normal."
display_name = "Check: History"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/insight"
default_visibility = "Public"
description = "You can attempt an Insight check when you try to read a creature’s motives, behavior, or trustworthiness."
display_name = "Check: Insight"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/int"
default_visibility = "Public"
description = "You can attempt an Intelligence check when a task calls for reasoning, recall, or analysis. Proficiency applies only if another rule grants it."
display_name = "Check: Intelligence (raw ability)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/intimidation"
default_visibility = "Public"
description = "You can make an Intimidation check when you try to frighten, coerce, or cow someone. Whether you add your proficiency bonus depends on your training."
display_name = "Check: Intimidation"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/investigation"
default_visibility = "Public"
description = "You can make an Intelligence check using Investigation when you try to uncover clues, analyze details, or deduce how something works."
display_name = "Check: Investigation"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/medicine"
default_visibility = "Public"
description = "You can attempt checks that use the Medicine skill when the rules or GM call for one."
display_name = "Check: Medicine"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/nature"
default_visibility = "Public"
description = "You can attempt checks that use your knowledge of natural environments, plants, animals, and weather."
display_name = "Check: Nature"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/perception"
default_visibility = "Public"
description = "You can make a Perception check when you try to notice something using your senses. Whether you add your proficiency bonus depends on your training."
display_name = "Check: Perception"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/performance"
default_visibility = "Public"
description = "You can make a Performance check when you try to entertain, impress, or convey emotion through a performance."
display_name = "Check: Performance"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/persuasion"
default_visibility = "Public"
description = "You can attempt to influence someone through tact, charm, or honest appeal when the situation calls for it."
display_name = "Check: Persuasion"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/religion"
default_visibility = "Public"
description = "You can make Intelligence checks to recall religious traditions, rites, symbols, and divine lore."
display_name = "Check: Religion"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/sleight-of-hand"
default_visibility = "Public"
description = "You can attempt Sleight of Hand checks when the rules call for careful manual work or misdirection."
display_name = "Check: Sleight Of Hand"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/stealth"
default_visibility = "Public"
description = "You can make a Stealth check when you try to avoid notice or move without drawing attention."
display_name = "Check: Stealth"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/str"
default_visibility = "Public"
description = "You can attempt a Strength check when a task calls for raw physical power, force, or endurance."
display_name = "Check: Strength (raw ability)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/survival"
default_visibility = "Public"
description = "You can make a Survival check when you try to track creatures, navigate wild places, or understand natural signs."
display_name = "Check: Survival"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/check/wis"
default_visibility = "Public"
description = "You can attempt a Wisdom check when the rules call for one. Any proficiency bonus comes from the relevant skill or other feature."
display_name = "Check: Wisdom (raw ability)"

