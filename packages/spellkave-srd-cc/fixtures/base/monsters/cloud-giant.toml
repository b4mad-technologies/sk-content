payload_json = '{"text":"### Cloud Giant\n\n_Huge Giant, Neutral_\n\n**AC** 14 **Initiative** +4 (14) <br>\n**HP** 200 (16d12 + 96) <br>\n**Speed** 40 ft., Fly 20 ft. (hover) <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>27</td>\n      <td>+8</td>\n      <td>+8</td>\n      <td><strong>DEX</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+0</td>\n      <td><strong>CON</strong></td>\n      <td>22</td>\n      <td>+6</td>\n      <td>+10</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>WIS</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+7</td>\n      <td><strong>CHA</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Insight +7, Perception +11<br>\n**Senses** Passive Perception 21<br>\n**Languages** Common, Giant<br>\n**CR** 9 (XP 5,000; PB +4)\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The giant makes two attacks, using Thunderous Mace or Thundercloud in any combination. It can replace one attack with a use of Spellcasting to cast _Fog Cloud_.\n\n**_Thunderous Mace._** _Melee Attack Roll:_ +12, reach 10 ft. _Hit:_ 21 (3d8 + 8) Bludgeoning damage plus 7 (2d6) Thunder damage.\n\n**_Thundercloud._** _Ranged Attack Roll:_ +12, range 240 ft. _Hit:_ 18 (3d6 + 8) Thunder damage, and the target has the Incapacitated condition until the end of its next turn.\n\n**_Spellcasting._** The giant casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 15): <br>\n&emsp;**At Will:** _Detect Magic_, _Fog Cloud_, _Light_ <br>\n&emsp;**1/Day Each:** _Control Weather_, _Gaseous Form_, _Telekinesis_\n\n#### Bonus Actions\n\n<hr>\n\n**_Misty Step._** The giant casts the _Misty Step_ spell, using the same spellcasting ability as Spellcasting.","source":"cache/markdown/monsters-A-Z.md:3901-3981","license":"CC-BY-4.0"}'
