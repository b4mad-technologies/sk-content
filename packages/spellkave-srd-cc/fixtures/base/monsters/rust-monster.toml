l on the armor or weapon.\n\n**_Destroy Metal._** The rust monster touches a nonmagical metal object within 5 feet of itself that isn't being worn or carried. The touch destroys a 1-foot Cube of the object.\n\n#### Reactions\n\n<hr>\n\n**_Reflexive Antennae._** _Trigger:_ An attack roll hits the rust monster. _Response:_ The rust monster uses Antennae.","source":"cache/markdown/monsters-A-Z.md:14401-14484","license":"CC-BY-4.0"}'''
