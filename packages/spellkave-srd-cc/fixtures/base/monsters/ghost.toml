payload_json = '''{"text":"### Ghost\n\n_Medium Undead, Neutral_\n\n**AC** 11 **Initiative** +1 (11) <br>\n**HP** 45 (10d8) <br>\n**Speed** 5 ft., Fly 40 ft. (hover) <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>7</td>\n      <td>−2</td>\n      <td>−2</td>\n      <td><strong>DEX</strong></td>\n      <td>13</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>CON</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+0</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+0</td>\n      <td><strong>WIS</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>CHA</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n  </tbody>\n</table>\n\n**Resistances** Acid, Bludgeoning, Cold, Fire, Lightning, Piercing, Slashing, Thunder<br>\n**Immunities** Necrotic, Poison; Charmed, Exhaustion, Frightened, Grappled, Paralyzed, Petrified, Poisoned, Prone, Restrained<br>\n**Senses** Darkvision 60 ft.; Passive Perception 11<br>\n**Languages** Common plus one other language<br>\n**CR** 4 (XP 1,100; PB +2)\n\n#### Traits\n\n<hr>\n\n**_Ethereal Sight._** The ghost can see 60 feet into the Ethereal Plane when it is on the Material Plane.\n\n**_Incorporeal Movement._** The ghost can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The ghost makes two Withering Touch attacks.\n\n**_Withering Touch._** _Melee Attack Roll:_ +5, reach 5 ft. _Hit:_ 19 (3d10 + 3) Necrotic damage.\n\n**_Etherealness._** The ghost casts the _Etherealness_ spell, requiring no spell components and using Charisma as the spellcasting ability. The ghost is visible on the Material Plane while on the Border Ethereal and vice versa, but it can't affect or be affected by anything on the other plane.\n\n**_Horrific Visage._** _Wisdom Saving Throw:_ DC 13, each creature in a 60-foot Cone that can see the ghost and isn't an Undead. _Failure:_ 10 (2d6 + 3) Psychic damage, and the target has the Frightened condition until the start of the ghost's next turn. _Success:_ The target is immune to this ghost's Horrific Visage for 24 hours.\n\n**_Possession (Recharge 6)._** _Charisma Saving Throw:_ DC 13, one Humanoid the ghost can see within 5 feet. _Failure:_ The target is possessed by the ghost; the ghost disappears, and the target has the Incapacitated condition and loses control of its body. The ghost now controls the body, but the target retains awareness. The ghost can't be targeted by any attack, spell, or other effect, except ones that specifically target Undead. The ghost's game statistics are the same, except it uses the possessed target's Speed, as well as the target's Strength, Dexterity, and Constitution modifiers. <br>\n&emsp;The possession lasts until the body drops to 0 Hit Points or the ghost leaves as a Bonus Action. When the possession ends, the ghost appears in an unoccupied space within 5 feet of the target, and the target is immune to this ghost's Possession for 24 hours. <br>\n&emsp;_Success:_ The target is immune to this ghost's Possession for 24 hours.","source":"cache/markdown/monsters-A-Z.md:6760-6845","license":"CC-BY-4.0"}'''
