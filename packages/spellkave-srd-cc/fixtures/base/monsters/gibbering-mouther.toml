.\n\n#### Actions\n\n<hr>\n\n**_Bite._** _Melee Attack Roll:_ +2, reach 5 ft. _Hit:_ 7 (2d6) Piercing damage. If the target is a Medium or smaller creature, it has the Prone condition. The target dies if it is reduced to 0 Hit Points by this attack. Its body is then absorbed into the mouther, leaving only equipment behind.\n\n**_Blinding Spittle (Recharge 5–6)._** _Dexterity Saving Throw:_ DC 10, each creature in a 10-foot-radius Sphere centered on a point within 30 feet. _Failure:_ 7 (2d6) Radiant damage, and the target has the Blinded condition until the end of the mouther's next turn.","source":"cache/markdown/monsters-A-Z.md:6923-7002","license":"CC-BY-4.0"}'''
