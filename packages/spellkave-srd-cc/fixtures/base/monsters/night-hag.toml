payload_json = '''{"text":"### Night Hag\n\n_Medium Fiend, Neutral Evil_\n\n**AC** 17 **Initiative** +5 (15) <br>\n**HP** 112 (15d8 + 45) <br>\n**Speed** 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CON</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>WIS</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CHA</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Deception +6, Insight +5, Perception +5, Stealth +5<br>\n**Resistances** Cold, Fire<br>\n**Immunities** Charmed<br>\n**Senses** Darkvision 120 ft.; Passive Perception 15<br>\n**Languages** Abyssal, Common, Infernal, Primordial<br>\n**CR** 5 (XP 1,800; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Coven Magic._** While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 14): _Augury_, _Find Familiar_, _Identify_, _Locate Object_, _Scrying_, or _Unseen Servant_. The hag must finish a Long Rest before using this trait to cast that spell again.\n\n**_Magic Resistance._** The hag has Advantage on saving throws against spells and other magical effects.\n\n**_Soul Bag._** The hag has a soul bag. While holding or carrying the bag, the hag can use its Nightmare Haunting action. <br>\n&emsp;The bag has AC 15, HP 20, and Resistance to all damage. The bag turns to dust if reduced to 0 Hit Points. If the bag is destroyed, any souls the bag is holding are released. The hag can create a new bag after 7 days.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The hag makes two Claw attacks.\n\n**_Claw._** _Melee Attack Roll:_ +7, reach 5 ft. _Hit:_ 13 (2d8 + 4) Slashing damage.\n\n**_Nightmare Haunting (1/Day; Requires Soul Bag)._** While on the Ethereal Plane, the hag casts _Dream_, using the same spellcasting ability as Spellcasting. Only the hag can serve as the spell's messenger, and the target must be a creature the hag can see on the Material Plane. The spell fails and is wasted if the target is under the effect of the _Protection from Evil and Good_ spell or within a _Magic Circle_ spell. <br>\n&emsp;If the target takes damage from the _Dream_ spell, the target's Hit Point maximum decreases by an amount equal to that damage. If the spell kills the target, its soul is trapped in the hag's soul bag, and the target can't be raised from the dead until its soul is released.\n\n**_Spellcasting._** The hag casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 14): <br>\n&emsp;**At Will:** _Detect Magic_, _Etherealness_, _Magic Missile_ (level 4 version) <br>\n&emsp;**2/Day Each:** _Phantasmal Killer_, _Plane Shift_ (self only)\n\n#### Bonus Actions\n\n<hr>\n\n**_Shape-Shift._** The hag shape-shifts into a Small or Medium Humanoid, or it returns to its true form. Other than its size, its game statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed.","source":"cache/markdown/monsters-A-Z.md:12158-12252","license":"CC-BY-4.0"}'''
