bundle_id = "srd"
namespace = "srd.text"
payload_json = '''{"text":"### Sphinx of Lore\n\n_Large Celestial, Lawful Neutral_\n\n**AC** 17 **Initiative** +10 (20) <br>\n**HP** 170 (20d10 + 60) <br>\n**Speed** 40 ft., Fly 60 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CON</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>WIS</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>CHA</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Arcana +12, History +12, Perception +8, Religion +12<br>\n**Resistances** Necrotic, Radiant<br>\n**Immunities** Psychic; Charmed, Frightened<br>\n**Senses** Truesight 120 ft.; Passive Perception 18<br>\n**Languages** Celestial, Common<br>\n**CR** 11 (XP 7,200, or 8,400 in lair; PB +4)\n\n#### Traits\n\n<hr>\n\n**_Inscrutable._** No magic can observe the sphinx remotely or detect its thoughts without its permission. Wisdom (Insight) checks made to ascertain its intentions or sincerity are made with Disadvantage.\n\n**_Legendary Resistance (3/Day, or 4/Day in Lair)._** If the sphinx fails a saving throw, it can choose to succeed instead.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The sphinx makes three Claw attacks.\n\n**_Claw._** _Melee Attack Roll:_ +8, reach 5 ft. _Hit:_ 14 (3d6 + 4) Slashing damage.\n\n**_Mind-Rending Roar (Recharge 5–6)._** _Wisdom Saving Throw:_ DC 16, each enemy in a 300-foot Emanation originating from the sphinx. _Failure:_ 35 (10d6) Psychic damage, and the target has the Incapacitated condition until the start of the sphinx's next turn.\n\n**_Spellcasting._** The sphinx casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 16): <br>\n&emsp;**At Will:** _Detect Magic_, _Identify_, _Mage Hand_, _Minor Illusion_, _Prestidigitation_ <br>\n&emsp;**1/Day Each:** _Dispel Magic_, _Legend Lore_, _Locate Object_, _Plane Shift_, _Remove Curse_, _Tongues_\n\n#### Legendary Actions\n\n<hr>\n\n_Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the sphinx can expend a use to take one of the following actions. The sphinx regains all expended uses at the start of each of its turns._\n\n**_Arcane Prowl._** The sphinx can teleport up to 30 feet to an unoccupied space it can see, and it makes one Claw attack.\n\n**_Weight of Years._** _Constitution Saving Throw:_ DC 16, one creature the sphinx can see within 120 feet. _Failure:_ The target gains 1 Exhaustion level. While the target has any Exhaustion levels, it appears 3d10 years older. _Failure or Success:_ The sphinx can't take this action again until the start of its next turn.","source":"cache/markdown/monsters-A-Z.md:15978-16072","license":"CC-BY-4.0"}'''
