s turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.\n\n#### Bonus Actions\n\n<hr>\n\n**_Shape-Shift._** The doppelganger shape-shifts into a Medium or Small Humanoid, or it returns to its true form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed.","source":"cache/markdown/monsters-A-Z.md:5123-5202","license":"CC-BY-4.0"}'''
