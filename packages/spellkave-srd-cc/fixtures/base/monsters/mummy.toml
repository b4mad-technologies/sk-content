 feet. _Failure:_ The target has the Frightened condition until the end of the mummy's next turn. _Success:_ The target is immune to this mummy's Dreadful Glare for 24 hours.","source":"cache/markdown/monsters-A-Z.md:11879-11950","license":"CC-BY-4.0"}'''
