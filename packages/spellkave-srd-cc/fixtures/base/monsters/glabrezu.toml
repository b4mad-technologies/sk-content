payload_json = '{"text":"### Glabrezu\n\n_Large Fiend (Demon), Chaotic Evil_\n\n**AC** 17 **Initiative** +6 (16) <br>\n**HP** 189 (18d10 + 90) <br>\n**Speed** 40 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>20</td>\n      <td>+5</td>\n      <td>+9</td>\n      <td><strong>DEX</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CON</strong></td>\n      <td>21</td>\n      <td>+5</td>\n      <td>+9</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>19</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>WIS</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+7</td>\n      <td><strong>CHA</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+7</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Deception +7, Perception +7<br>\n**Resistances** Cold, Fire, Lightning<br>\n**Immunities** Poison; Poisoned<br>\n**Senses** Truesight 120 ft.; Passive Perception 17<br>\n**Languages** Abyssal; telepathy 120 ft.<br>\n**CR** 9 (XP 5,000; PB +4)\n\n#### Traits\n\n<hr>\n\n**_Demonic Restoration._** If the glabrezu dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.\n\n**_Magic Resistance._** The glabrezu has Advantage on saving throws against spells and other magical effects.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The glabrezu makes two Pincer attacks and uses Pummel or Spellcasting.\n\n**_Pincer._** _Melee Attack Roll:_ +9, reach 10 ft. _Hit:_ 16 (2d10 + 5) Slashing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 15) from one of two pincers.\n\n**_Pummel._** _Dexterity Saving Throw:_ DC 17, one creature Grappled by the glabrezu. _Failure:_ 15 (3d6 + 5) Bludgeoning damage. _Success:_ Half damage.\n\n**_Spellcasting._** The glabrezu casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 16): <br>\n&emsp;**At Will:** _Darkness, Detect Magic, Dispel Magic_ <br>\n&emsp;**1/Day Each:** _Confusion, Fly, Power Word Stun_","source":"cache/markdown/monsters-A-Z.md:7006-7090","license":"CC-BY-4.0"}'
