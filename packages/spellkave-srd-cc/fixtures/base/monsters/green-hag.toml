payload_json = '''{"text":"### Green Hag\n\n_Medium Fey, Neutral Evil_\n\n**AC** 17 **Initiative** +1 (11) <br>\n**HP** 82 (11d8 + 33) <br>\n**Speed** 30 ft., Swim 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>CON</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>13</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>WIS</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CHA</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+2</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Arcana +5, Deception +4, Perception +4, Stealth +3<br>\n**Senses** Darkvision 60 ft.; Passive Perception 14<br>\n**Languages** Common, Elvish, Sylvan<br>\n**CR** 3 (XP 700; PB +2)\n\n#### Traits\n\n<hr>\n\n**_Amphibious._** The hag can breathe air and water.\n\n**_Coven Magic._** While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 11): _Augury_, _Find Familiar_, _Identify_, _Locate Object_, _Scrying_, or _Unseen Servant_. The hag must finish a Long Rest before using this trait to cast that spell again.\n\n**_Mimicry._** The hag can mimic animal sounds and humanoid voices. A creature that hears the sounds can tell they are imitations only with a successful DC 14 Wisdom (Insight) check.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The hag makes two Claw attacks.\n\n**_Claw._** _Melee Attack Roll:_ +6, reach 5 ft. _Hit:_ 8 (1d8 + 4) Slashing damage plus 3 (1d6) Poison damage.\n\n**_Spellcasting._** The hag casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 12, +4 to hit with spell attacks): <br>\n&emsp;**At Will:** _Dancing Lights_, _Disguise Self_ (24-hour duration), _Invisibility_ (self only, and the hag leaves no tracks while Invisible), _Minor Illusion_, _Ray of Sickness_ (level 3 version)","source":"cache/markdown/monsters-A-Z.md:8367-8448","license":"CC-BY-4.0"}'''
