**At Will:** _Animal Friendship, Charm Monster_ (lasts 24 hours; ends early if the dryad casts the spell again), _Druidcraft_ <br>\n&emsp;**1/Day Each:** _Entangle, Pass without Trace_\n\n#### Bonus Actions\n\n<hr>\n\n**_Tree Stride._** If within 5 feet of a Large or bigger tree, the dryad teleports to an unoccupied space within 5 feet of a second Large or bigger tree that is within 60 feet of the previous tree.","source":"cache/markdown/monsters-A-Z.md:5531-5619","license":"CC-BY-4.0"}'
