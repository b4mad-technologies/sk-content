can't do so again for 365 days.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The efreeti makes three attacks, using Heated Blade or Hurl Flame in any combination.\n\n**_Heated Blade._** _Melee Attack Roll:_ +10, reach 5 ft. _Hit:_ 13 (2d6 + 6) Slashing damage plus 13 (2d12) Fire damage.\n\n**_Hurl Flame._** _Ranged Attack Roll:_ +8, range 120 ft. _Hit:_ 24 (7d6) Fire damage.\n\n**_Spellcasting._** The efreeti casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 16): <br>\n&emsp;**At Will:** _Detect Magic, Elementalism_ <br>\n&emsp;**1/Day Each:** _Gaseous Form, Invisibility, Major Image, Plane Shift, Tongues, Wall of Fire_ (level 7 version)","source":"cache/markdown/monsters-A-Z.md:5706-5790","license":"CC-BY-4.0"}'''
