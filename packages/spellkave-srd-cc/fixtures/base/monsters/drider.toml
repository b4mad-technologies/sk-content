payload_json = '{"text":"### Drider\n\n_Large Monstrosity, Chaotic Evil_\n\n**AC** 19 **Initiative** +4 (14) <br>\n**HP** 123 (13d10 + 52) <br>\n**Speed** 30 ft., Climb 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>DEX</strong></td>\n      <td>19</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>CON</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>13</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>WIS</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>CHA</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Perception +6, Stealth +10<br>\n**Senses** Darkvision 120 ft.; Passive Perception 16<br>\n**Languages** Elvish, Undercommon<br>\n**CR** 6 (XP 2,300; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Spider Climb._** The drider can climb difficult surfaces, including along ceilings, without needing to make an ability check.\n\n**_Sunlight Sensitivity._** While in sunlight, the drider has Disadvantage on ability checks and attack rolls.\n\n**_Web Walker._** The drider ignores movement restrictions caused by webs, and the drider knows the location of any other creature in contact with the same web.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The drider makes three attacks, using Foreleg or Poison Burst in any combination.\n\n**_Foreleg._** _Melee Attack Roll:_ +7, reach 10 ft. _Hit:_ 13 (2d8 + 4) Piercing damage.\n\n**_Poison Burst._** _Ranged Attack Roll:_ +6, range 120 ft. _Hit:_ 13 (3d6 + 3) Poison damage.\n\n#### Bonus Actions\n\n<hr>\n\n**_Magic of the Spider Queen (Recharge 5–6)._** The drider casts _Darkness_, _Faerie Fire_, or _Web_, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 14).","source":"cache/markdown/monsters-A-Z.md:5361-5447","license":"CC-BY-4.0"}'
