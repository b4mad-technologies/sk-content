n 10 feet. _Failure:_ 11 (2d6 + 4) Bludgeoning damage plus 7 (2d6) Fire damage. The target has the Grappled condition (escape DC 14), and it has the Restrained condition until the grapple ends.","source":"cache/markdown/monsters-A-Z.md:14577-14654","license":"CC-BY-4.0"}'''
