payload_json = '''{"text":"### Adult Bronze Dragon\n\n_Huge Dragon (Metallic), Lawful Good_\n\n**AC** 18 **Initiative** +10 (20) <br>\n**HP** 212 (17d12 + 102) <br>\n**Speed** 40 ft., Fly 80 ft., Swim 40 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>25</td>\n      <td>+7</td>\n      <td>+7</td>\n      <td><strong>DEX</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+5</td>\n      <td><strong>CON</strong></td>\n      <td>23</td>\n      <td>+6</td>\n      <td>+6</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>WIS</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+7</td>\n      <td><strong>CHA</strong></td>\n      <td>20</td>\n      <td>+5</td>\n      <td>+5</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Insight +7, Perception +12, Stealth +5<br>\n**Immunities** Lightning<br>\n**Senses** Blindsight 60 ft., Darkvision 120 ft.; Passive Perception 22<br>\n**Languages** Common, Draconic<br>\n**CR** 15 (XP 13,000, or 15,000 in lair; PB +5)\n\n#### Traits\n\n<hr>\n\n**_Amphibious._** The dragon can breathe air and water.\n\n**_Legendary Resistance (3/Day, or 4/Day in Lair)._** If the dragon fails a saving throw, it can choose to succeed instead.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The dragon makes three Rend attacks. It can replace one attack with a use of (A) Repulsion Breath or (B) Spellcasting to cast _Guiding Bolt_ (level 2 version).\n\n**_Rend._** _Melee Attack Roll:_ +12, reach 10 ft. _Hit:_ 16 (2d8 + 7) Slashing damage plus 5 (1d10) Lightning damage.\n\n**_Lightning Breath (Recharge 5–6)._** _Dexterity Saving Throw:_ DC 19, each creature in a 90-foot-long, 5-foot-wide Line. _Failure:_ 55 (10d10) Lightning damage. _Success:_ Half damage.\n\n**_Repulsion Breath._** _Strength Saving Throw:_ DC 19, each creature in a 30-foot Cone. _Failure:_ The target is pushed up to 60 feet straight away from the dragon and has the Prone condition.\n\n**_Spellcasting._** The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 17, +10 to hit with spell attacks): <br>\n&emsp;**At Will:** _Detect Magic_, _Guiding Bolt_ (level 2 version), _Shapechange_ (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell), _Speak with Animals_, _Thaumaturgy_ <br>\n&emsp;**1/Day Each:** _Detect Thoughts_, _Water Breathing_\n\n#### Legendary Actions\n\n<hr>\n\n_Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns._\n\n**_Guiding Light._** The dragon uses Spellcasting to cast _Guiding Bolt_ (level 2 version).\n\n**_Pounce._** The dragon moves up to half its Speed, and it makes one Rend attack.\n\n**_Thunderclap._** _Constitution Saving Throw:_ DC 17, each creature in a 20-foot-radius Sphere centered on a point the dragon can see within 90 feet. _Failure:_ 10 (3d6)\nThunder damage, and the target has the Deafened condition until the end of its next turn.","source":"cache/markdown/monsters-A-Z.md:2944-3042","license":"CC-BY-4.0"}'''
