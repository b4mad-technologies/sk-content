payload_json = '''{"text":"### Horned Devil\n\n_Large Fiend (Devil), Lawful Evil_\n\n**AC** 18 **Initiative** +7 (17) <br>\n**HP** 199 (19d10 + 95) <br>\n**Speed** 30 ft., Fly 60 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>22</td>\n      <td>+6</td>\n      <td>+10</td>\n      <td><strong>DEX</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+7</td>\n      <td><strong>CON</strong></td>\n      <td>21</td>\n      <td>+5</td>\n      <td>+5</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>WIS</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+7</td>\n      <td><strong>CHA</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+8</td>\n    </tr>\n  </tbody>\n</table>\n\n**Resistances** Cold<br>\n**Immunities** Fire, Poison; Poisoned<br>\n**Senses** Darkvision 150 ft. (unimpeded by magical Darkness); Passive Perception 13<br>\n**Languages** Infernal; telepathy 120 ft.<br>\n**CR** 11 (XP 7,200; PB +4)\n\n#### Traits\n\n<hr>\n\n**_Diabolical Restoration._** If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.\n\n**_Magic Resistance._** The devil has Advantage on saving throws against spells and other magical effects.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The devil makes three attacks, using Searing Fork or Hurl Flame in any combination. It can replace one attack with a use of Infernal Tail.\n\n**_Searing Fork._** _Melee Attack Roll:_ +10, reach 10 ft. _Hit:_ 15 (2d8 + 6) Piercing damage plus 9 (2d8) Fire damage.\n\n**_Hurl Flame._** _Ranged Attack Roll:_ +8, range 150 ft. _Hit:_ 26 (5d8 + 4) Fire damage. If the target is a flammable object that isn't being worn or carried, it starts burning.\n\n**_Infernal Tail._** _Dexterity Saving Throw:_ DC 17, one creature the devil can see within 10 feet. _Failure:_ 10 (1d8 + 6) Necrotic damage, and the target receives an infernal wound if it doesn't have one. While wounded, the target loses 10 (3d6) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, doing so by succeeding on a DC 17 Wisdom (Medicine) check.","source":"cache/markdown/monsters-A-Z.md:9609-9690","license":"CC-BY-4.0"}'''
