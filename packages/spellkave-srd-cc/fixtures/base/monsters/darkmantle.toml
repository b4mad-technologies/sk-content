le can detach itself by using 5 feet of movement.\n\n**_Darkness Aura (1/Day)._** Magical Darkness fills a 15-foot Emanation originating from the darkmantle. This effect lasts while the darkmantle maintains Concentration on it, up to 10 minutes. Darkvision can't penetrate this area, and no light can illuminate it.","source":"cache/markdown/monsters-A-Z.md:4792-4862","license":"CC-BY-4.0"}'''
