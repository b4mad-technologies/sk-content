n**_Horror Nimbus (Recharge 5–6)._** _Wisdom Saving Throw:_ DC 15, each creature in a 15-foot Emanation originating from the nalfeshnee. _Failure:_ 28 (8d6) Psychic damage, and the target has the Frightened condition for 1 minute, until it takes damage, or until it ends its turn with the nalfeshnee out of line of sight. _Success:_\nThe target is immune to this nalfeshnee's Horror Nimbus for 24 hours.\n\n#### Reactions\n\n<hr>\n\n**_Pursuit._** Trigger: Another creature the nalfeshnee can see ends its move within 120 feet of the nalfeshnee. Response: The nalfeshnee uses Teleport, but its destination space must be within 10 feet of the triggering creature.","source":"cache/markdown/monsters-A-Z.md:12062-12154","license":"CC-BY-4.0"}'''
