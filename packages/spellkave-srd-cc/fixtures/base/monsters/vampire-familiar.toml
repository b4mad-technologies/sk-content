 becomes Stable but has the Poisoned condition for 1 hour. While it has the Poisoned condition, the target has the Paralyzed condition.\n\n#### Bonus Actions\n\n<hr>\n\n**_Deathless Agility._** The familiar takes the Dash or Disengage action.","source":"cache/markdown/monsters-A-Z.md:17446-17529","license":"CC-BY-4.0"}'''
