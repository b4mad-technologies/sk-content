dditional 30 feet.\n\n**_Water Susceptibility._** The elemental takes 3 (1d6) Cold damage for every 5 feet the elemental moves in water or for every gallon of water splashed on it.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The elemental makes two Burn attacks.\n\n**_Burn._** _Melee Attack Roll:_ +6, reach 5 ft. _Hit:_ 10 (2d6 + 3) Fire damage. If the target is a creature or a flammable object, it starts burning.","source":"cache/markdown/monsters-A-Z.md:6052-6133","license":"CC-BY-4.0"}'''
