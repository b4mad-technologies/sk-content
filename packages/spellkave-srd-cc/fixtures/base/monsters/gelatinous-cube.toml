payload_json = '''{"text":"### Gelatinous Cube\n\n_Large Ooze, Unaligned_\n\n**AC** 6 **Initiative** −4 (6) <br>\n**HP** 63 (6d10 + 30) <br>\n**Speed** 15 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>DEX</strong></td>\n      <td>3</td>\n      <td>−4</td>\n      <td>−4</td>\n      <td><strong>CON</strong></td>\n      <td>20</td>\n      <td>+5</td>\n      <td>+5</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>1</td>\n      <td>−5</td>\n      <td>−5</td>\n      <td><strong>WIS</strong></td>\n      <td>6</td>\n      <td>−2</td>\n      <td>−2</td>\n      <td><strong>CHA</strong></td>\n      <td>1</td>\n      <td>−5</td>\n      <td>−5</td>\n    </tr>\n  </tbody>\n</table>\n\n**Immunities** Acid; Blinded, Charmed, Deafened, Exhaustion, Frightened, Prone<br>\n**Senses** Blindsight 60 ft.; Passive Perception 8<br>\n**Languages** None<br>\n**CR** 2 (XP 450; PB +2)\n\n#### Traits\n\n<hr>\n\n**_Ooze Cube._** The cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to the cube's Engulf and has Disadvantage on the saving throw. <br>\n&emsp;Creatures inside the cube have Total Cover, and the cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time. <br>\n&emsp;As an action, a creature within 5 feet of the cube can pull a creature or an object out of the cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.\n\n**_Transparent._** Even when the cube is in plain sight, a creature must succeed on a DC 15 Wisdom (Perception) check to notice the cube if the creature hasn't witnessed the cube move or otherwise act.\n\n#### Actions\n\n<hr>\n\n**_Pseudopod._** _Melee Attack Roll:_ +4, reach 5 ft. _Hit:_ 12 (3d6 + 2) Acid damage.\n\n**_Engulf._** The cube moves up to its Speed without provoking Opportunity Attacks. The cube can move through the spaces of Large or smaller creatures if it has room inside itself to contain them (see the Ooze Cube trait). _Dexterity Saving Throw:_ DC 12, each creature whose space the cube enters for the first time during this move. _Failure:_ 10 (3d6) Acid damage, and the target is engulfed. An engulfed target is suffocating, can't cast spells with a Verbal component, has the Restrained condition, and takes 10 (3d6) Acid damage at the start of each of the cube's turns. When the cube moves, the engulfed target moves with it. An engulfed target can try to escape by taking an action to make a DC 12 Strength (Athletics) check. On a successful check, the target escapes and enters the nearest unoccupied space. _Success:_ Half damage, and the target moves to an unoccupied space within 5 feet of the cube. If there is no unoccupied space, the target fails the save instead.","source":"cache/markdown/monsters-A-Z.md:6599-6677","license":"CC-BY-4.0"}'''
