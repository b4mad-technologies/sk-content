ken.\n\n**_Create Specter._** The wraith targets a Humanoid corpse within 10 feet of itself that has been dead for no longer than 1 minute. The target's spirit rises as a **Specter** in the space of its corpse or in the nearest unoccupied space. The specter is under the wraith's control. The wraith can have no more than seven specters under its control at a time.","source":"cache/markdown/monsters-A-Z.md:19169-19250","license":"CC-BY-4.0"}'''
