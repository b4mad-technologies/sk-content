o damage to the roper, and a destroyed tentacle regrows at the start of the roper's next turn.\n\n**_Reel._** The roper pulls each creature Grappled by it up to 30 feet straight toward it.","source":"cache/markdown/monsters-A-Z.md:14318-14397","license":"CC-BY-4.0"}'''
