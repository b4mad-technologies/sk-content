\n**_Multiattack._** The hydra makes as many Bite attacks as it has heads.\n\n**_Bite._** _Melee Attack Roll:_ +8, reach 10 ft. _Hit:_ 10 (1d10 + 5) Piercing damage.","source":"cache/markdown/monsters-A-Z.md:9694-9773","license":"CC-BY-4.0"}'
