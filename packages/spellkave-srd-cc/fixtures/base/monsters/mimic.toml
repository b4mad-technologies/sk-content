ks made to escape this grapple have Disadvantage.\n\n#### Bonus Actions\n\n<hr>\n\n**_Shape-Shift._** The mimic shape-shifts to resemble a Medium or Small object while retaining its game statistics, or it returns to its true blob form. Any equipment it is wearing or carrying isn't transformed.","source":"cache/markdown/monsters-A-Z.md:11722-11803","license":"CC-BY-4.0"}'''
