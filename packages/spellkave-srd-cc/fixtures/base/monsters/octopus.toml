payload_json = '{"text":"## Octopus\n\n_Small Beast, Unaligned_\n\n**AC** 12 **Initiative** +2 (12) <br>\n**HP** 3 (1d6) <br>\n**Speed** 5 ft., Swim 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>4</td>\n      <td>-3</td>\n      <td>-3</td>\n      <td><strong>DEX</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CON</strong></td>\n      <td>11</td>\n      <td>+0</td>\n      <td>+0</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>3</td>\n      <td>-4</td>\n      <td>-4</td>\n      <td><strong>WIS</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+0</td>\n      <td><strong>CHA</strong></td>\n      <td>4</td>\n      <td>-3</td>\n      <td>-3</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Perception +2, Stealth +6<br>\n**Senses** Darkvision 30 ft.; Passive Perception 12<br>\n**Languages** None<br>\n**CR** 0 (XP 10; PB +2)\n\n### Traits\n\n<hr>\n\n**_Compression._** The octopus can move through a space as narrow as 1 inch without expending extra movement to do so.\n\n**_Water Breathing._** The octopus can breathe only underwater.\n\n### Actions\n\n<hr>\n\n**_Tentacles._** _Melee Attack Roll:_ +4, reach 5 ft. _Hit:_ 1 Bludgeoning damage.\n\n### Reactions\n\n<hr>\n\n**_Ink Cloud (1/Day)._** _Trigger:_ A creature ends its turn within 5 feet of the octopus while underwater. _Response:_ The octopus releases ink that fills a 5-foot Cube centered on itself, and the octopus moves up to its Swim Speed. The Cube is Heavily Obscured for 1 minute or until a strong current or similar effect disperses the ink.","source":"cache/markdown/animals.md:4652-4732","license":"CC-BY-4.0"}'
