iped), _Minor Illusion_<br>\n&emsp;**1/Day Each:** _Geas_, _Major Image_, _Scrying_\n\n#### Bonus Actions\n\n<hr>\n\n**_Leap._** The lamia jumps up to 30 feet by spending 10 feet of movement.","source":"cache/markdown/monsters-A-Z.md:10462-10542","license":"CC-BY-4.0"}'
