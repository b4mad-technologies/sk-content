payload_json = '''{"text":"### Flesh Golem\n\n_Medium Construct, Neutral_\n\n**AC** 9 **Initiative** −1 (9) <br>\n**HP** 127 (15d8 + 60) <br>\n**Speed** 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>19</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>9</td>\n      <td>−1</td>\n      <td>−1</td>\n      <td><strong>CON</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>6</td>\n      <td>−2</td>\n      <td>−2</td>\n      <td><strong>WIS</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+0</td>\n      <td><strong>CHA</strong></td>\n      <td>5</td>\n      <td>−3</td>\n      <td>−3</td>\n    </tr>\n  </tbody>\n</table>\n\n**Immunities** Lightning, Poison; Charmed, Exhaustion, Frightened, Paralyzed, Petrified, Poisoned<br>\n**Senses** Darkvision 60 ft.; Passive Perception 10<br>\n**Languages** Understands Common plus one other language but can't speak<br>\n**CR** 5 (XP 1,800; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Aversion to Fire._** If the golem takes Fire damage, it has Disadvantage on attack rolls and ability checks until the end of its next turn.\n\n**_Berserk._** Whenever the golem starts its turn Bloodied, roll 1d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object. Once the golem goes berserk, it remains so until it is destroyed or it is no longer Bloodied. <br>\n&emsp;The golem's creator, if within 60 feet of the berserk golem, can try to calm it by taking an action to make a DC 15 Charisma (Persuasion) check; the golem must be able to hear its creator. If this check succeeds, the golem ceases being berserk until the start of its next turn, at which point it resumes rolling for the Berserk trait again if it is still Bloodied.\n\n**_Immutable Form._** The golem can't shape-shift.\n\n**_Lightning Absorption._** Whenever the golem is subjected to Lightning damage, it regains a number of Hit Points equal to the Lightning damage dealt.\n\n**_Magic Resistance._** The golem has Advantage on saving throws against spells and other magical effects.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The golem makes two Slam attacks.\n\n**_Slam._** _Melee Attack Roll:_ +7, reach 5 ft. _Hit:_ 13 (2d8 + 4) Bludgeoning damage plus 4 (1d8) Lightning damage.","source":"cache/markdown/monsters-A-Z.md:6212-6295","license":"CC-BY-4.0"}'''
