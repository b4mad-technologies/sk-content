e creature Charmed by the succubus within 5 feet. _Failure:_ 13 (3d8) Psychic damage. _Success:_ Half damage. _Failure or Success:_ The target's Hit Point maximum decreases by an amount equal to the damage taken.\n\n#### Bonus Actions\n\n<hr>\n\n**_Shape-Shift._** The succubus shape-shifts into a Medium or Small Humanoid, or it returns to its true form. Its game statistics are the same in each form, except its Fly Speed is available only in its true form. Any equipment it is wearing or carrying isn't transformed.","source":"cache/markdown/monsters-A-Z.md:16743-16830","license":"CC-BY-4.0"}'''
