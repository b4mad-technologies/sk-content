on_ <br>\n&emsp;**2/Day Each:** _Fly_, _Lightning Bolt_ (level 7 version) <br>\n&emsp;**1/Day Each:** _Cone of Cold_ (level 9 version), _Mind Blank_ (cast before combat), _Scrying_, _Teleport_\n\n#### Bonus Actions\n\n<hr>\n\n**_Misty Step (3/Day)._** The mage casts _Misty Step_, using the same spellcasting ability as Spellcasting.\n\n#### Reactions\n\n<hr>\n\n**_Protective Magic (3/Day)._** The archmage casts _Counterspell_ or _Shield_ in response to the spell's trigger, using the same spellcasting ability as Spellcasting.","source":"cache/markdown/monsters-A-Z.md:10819-10912","license":"CC-BY-4.0"}'''
