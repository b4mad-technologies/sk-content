) Slashing damage plus 9 (2d8) Poison damage.\n\n#### Bonus Actions\n\n<hr>\n\n**_Leap._** The hezrou jumps up to 30 feet by spending 10 feet of movement.","source":"cache/markdown/monsters-A-Z.md:9136-9221","license":"CC-BY-4.0"}'
