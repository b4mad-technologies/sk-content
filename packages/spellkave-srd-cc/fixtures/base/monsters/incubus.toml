payload_json = '''{"text":"### Incubus\n\n_Medium Fiend, Neutral Evil_\n\n**AC** 15 **Initiative** +3 (13) <br>\n**HP** 66 (12d8 + 12) <br>\n**Speed** 30 ft., Fly 60 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>8</td>\n      <td>−1</td>\n      <td>−1</td>\n      <td><strong>DEX</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>CON</strong></td>\n      <td>13</td>\n      <td>+1</td>\n      <td>+1</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>WIS</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>CHA</strong></td>\n      <td>20</td>\n      <td>+5</td>\n      <td>+5</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Deception +9, Insight +5, Perception +5, Persuasion +9, Stealth +7<br>\n**Resistances** Cold, Fire, Poison, Psychic<br>\n**Senses** Darkvision 60 ft.; Passive Perception 15<br>\n**Languages** Abyssal, Common, Infernal; telepathy 60 ft.<br>\n**CR** 4 (XP 1,100; PB +2)\n\n#### Traits\n\n<hr>\n\n**_Succubus Form._** When the incubus finishes a Long Rest, it can shape-shift into a **Succubus**, using that stat block instead of this one. Any equipment it is wearing or carrying isn't transformed.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The incubus makes two Restless Touch attacks.\n\n**_Restless Touch._** _Melee Attack Roll:_ +7, reach 5 ft. _Hit:_ 15 (3d6 + 5) Psychic damage, and the target is cursed for 24 hours or until the incubus dies. Until the curse ends, the target gains no benefit from finishing Short Rests.\n\n**_Spellcasting._** The incubus casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 15): <br>\n&emsp;**At Will:** _Disguise Self, Etherealness_ <br>\n&emsp;**1/Day Each:** _Dream, Hypnotic Pattern_\n\n#### Bonus Actions\n\n<hr>\n\n**_Nightmare (Recharge 6)._** _Wisdom Saving Throw:_ DC 15, one creature the incubus can see within 60 feet. _Failure:_ If the target has 20 Hit Points or fewer, it has the Unconscious condition for 1 hour, until it takes damage, or until a creature within 5 feet of it takes an action to wake it. Otherwise, the target takes 18 (4d8) Psychic damage.","source":"cache/markdown/monsters-A-Z.md:9944-10029","license":"CC-BY-4.0"}'''
