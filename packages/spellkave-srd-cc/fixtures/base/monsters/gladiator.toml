payload_json = '{"text":"### Gladiator\n\n_Medium or Small Humanoid, Neutral_\n\n**AC** 16 **Initiative** +5 (15) <br>\n**HP** 112 (15d8 + 45) <br>\n**Speed** 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+7</td>\n      <td><strong>DEX</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+5</td>\n      <td><strong>CON</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+6</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+0</td>\n      <td><strong>WIS</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+4</td>\n      <td><strong>CHA</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Athletics +10, Performance +5<br>\n**Gear** Shield, Spears (3), Studded Leather Armor<br>\n**Senses** Passive Perception 11<br>\n**Languages** Common<br>\n**CR** 5 (XP 1,800; PB +3)\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The gladiator makes three Spear attacks. It can replace one attack with a use of Shield Bash.\n\n**_Spear._** _Melee or Ranged Attack Roll:_ +7, reach 5 ft. or range 20/60 ft. _Hit:_ 11 (2d6 + 4) Piercing damage.\n\n**_Shield Bash._** _Strength Saving Throw:_ DC 15, one creature within 5 feet that the gladiator can see. _Failure:_ 9 (2d4 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.\n\n#### Reactions\n\n<hr>\n\n**_Parry._** _Trigger:_ The gladiator is hit by a melee attack roll while holding a weapon. _Response:_ The gladiator adds 3 to its AC against that attack, possibly causing it to miss.","source":"cache/markdown/monsters-A-Z.md:7094-7171","license":"CC-BY-4.0"}'
