payload_json = '''{"text":"### Ancient Bronze Dragon\n\n_Gargantuan Dragon (Metallic), Lawful Good_\n\n**AC** 22 **Initiative** +14 (24) <br>\n**HP** 444 (24d20 + 192) <br>\n**Speed** 40 ft., Fly 80 ft., Swim 40 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>29</td>\n      <td>+9</td>\n      <td>+9</td>\n      <td><strong>DEX</strong></td>\n      <td>10</td>\n      <td>+0</td>\n      <td>+7</td>\n      <td><strong>CON</strong></td>\n      <td>27</td>\n      <td>+8</td>\n      <td>+8</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>WIS</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+10</td>\n      <td><strong>CHA</strong></td>\n      <td>25</td>\n      <td>+7</td>\n      <td>+7</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Insight +10, Perception +17, Stealth +7<br>\n**Immunities** Lightning<br>\n**Senses** Blindsight 60 ft., Darkvision 120 ft.; Passive Perception 27<br>\n**Languages** Common, Draconic<br>\n**CR** 22 (XP 41,000, or 50,000 in lair; PB +7)\n\n#### Traits\n\n<hr>\n\n**_Amphibious._** The dragon can breathe air and water.\n\n**_Legendary Resistance (4/Day, or 5/Day in Lair)._** If the dragon fails a saving throw, it can choose to succeed instead.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The dragon makes three Rend attacks. It can replace one attack with a use of (A) Repulsion Breath or (B) Spellcasting to cast _Guiding Bolt_ (level 2 version).\n\n**_Rend._** _Melee Attack Roll:_ +16, reach 15 ft. _Hit:_ 18 (2d8 + 9) Slashing damage plus 9 (2d8) Lightning damage.\n\n**_Lightning Breath (Recharge 5–6)._** _Dexterity Saving Throw:_ DC 23, each creature in a 120-foot-long, 10-foot-wide Line. _Failure:_ 82 (15d10) Lightning damage. _Success:_ Half damage.\n\n**_Repulsion Breath._** _Strength Saving Throw:_ DC 23, each creature in a 30-foot Cone. _Failure:_ The target is pushed up to 60 feet straight away from the dragon and has the Prone condition.\n\n**_Spellcasting._** The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 22, +14 to hit with spell attacks): <br>\n&emsp;**At Will:** _Detect Magic_, _Guiding Bolt_ (level 2 version), _Shapechange_ (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell), _Speak with Animals_, _Thaumaturgy_ <br>\n&emsp;**1/Day Each:** _Detect Thoughts_, _Control Water_, _Scrying_, _Water Breathing_\n\n#### Legendary Actions\n\n<hr>\n\n_Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns._\n\n**_Guiding Light._** The dragon uses Spellcasting to cast _Guiding Bolt_ (level 2 version).\n\n**_Pounce._** The dragon moves up to half its Speed, and it makes one Rend attack.\n\n**_Thunderclap._** _Constitution Saving Throw:_ DC 22, each creature in a 20-foot-radius Sphere centered on a point the dragon can see within 120 feet. _Failure:_ 13 (3d8) Thunder damage, and the target has the Deafened condition until the end of its next turn.","source":"cache/markdown/monsters-A-Z.md:3044-3141","license":"CC-BY-4.0"}'''
