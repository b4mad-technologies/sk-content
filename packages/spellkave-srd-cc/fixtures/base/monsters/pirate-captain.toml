ack roll while holding a weapon. _Response:_ The pirate adds 3 to its AC against that attack, possibly causing it to miss. On a miss, the pirate makes one Rapier attack against the triggering creature if within range.","source":"cache/markdown/monsters-A-Z.md:13039-13122","license":"CC-BY-4.0"}'''
