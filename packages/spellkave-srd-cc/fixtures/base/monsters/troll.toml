 Attack Roll:_ +7, reach 10 ft. _Hit:_ 11 (2d6 + 4) Slashing damage.\n\n#### Bonus Actions\n\n<hr>\n\n**_Charge._** The troll moves up to half its Speed straight toward an enemy it can see.","source":"cache/markdown/monsters-A-Z.md:17182-17264","license":"CC-BY-4.0"}'''
