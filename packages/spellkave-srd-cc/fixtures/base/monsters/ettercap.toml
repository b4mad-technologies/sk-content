charge 5–6)._** _Dexterity Saving Throw:_ DC 12, one Large or smaller creature the ettercap can see within 30 feet. _Failure:_ The target has the Restrained condition until the web is destroyed (AC 10; HP 5; Vulnerability to Fire damage; Immunity to Bludgeoning, Poison, and Psychic damage).\n\n#### Bonus Actions\n\n<hr>\n\n**_Reel._** The ettercap pulls one creature within 30 feet of itself that is Restrained by its Web Strand up to 25 feet straight toward itself.","source":"cache/markdown/monsters-A-Z.md:5886-5972","license":"CC-BY-4.0"}'''
