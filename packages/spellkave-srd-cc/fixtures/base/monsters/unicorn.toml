payload_json = '''{"text":"### Unicorn\n\n_Large Celestial, Lawful Good_\n\n**AC** 12 **Initiative** +8 (18) <br>\n**HP** 97 (13d10 + 26) <br>\n**Speed** 50 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CON</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>11</td>\n      <td>+0</td>\n      <td>+0</td>\n      <td><strong>WIS</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>CHA</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n    </tr>\n  </tbody>\n</table>\n\n**Immunities** Poison; Charmed, Paralyzed, Poisoned <br>\n**Senses** Darkvision 60 ft.; Passive Perception 13 <br>\n**Languages** Celestial, Elvish, Sylvan; telepathy 120 ft. <br>\n**CR** 5 (XP 1,800; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Legendary Resistance (3/Day)._** If the unicorn fails a saving throw, it can choose to succeed instead.\n\n**_Magic Resistance._** The unicorn has Advantage on saving throws against spells and other magical effects.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The unicorn makes one Hooves attack and one Radiant Horn attack.\n\n**_Hooves._** _Melee Attack Roll:_ +7, reach 5 ft. _Hit:_ 11 (2d6 + 4) Bludgeoning damage.\n\n**_Radiant Horn._** _Melee Attack Roll:_ +7, reach 5 ft. _Hit:_ 9 (1d10 + 4) Radiant damage.\n\n**_Spellcasting._** The unicorn casts one of the following spells, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 14): <br>\n&emsp;**At Will:** _Detect Evil and Good, Druidcraft_ <br>\n&emsp;**1/Day Each:** _Calm Emotions, Dispel Evil and Good, Entangle, Pass without Trace, Word of Recall_\n\n#### Bonus Actions\n\n<hr>\n\n**_Unicorn's Blessing (3/Day)._** The unicorn touches another creature with its horn and casts _Cure Wounds_ or _Lesser Restoration_ on that creature, using the same spellcasting ability as Spellcasting.\n\n#### Legendary Actions\n\n<hr>\n\n_Legendary Action Uses: 3. Immediately after another creature's turn, the unicorn can expend a use to take one of the following actions. The unicorn regains all expended uses at the start of each of its turns._\n\n**_Charging Horn._** The unicorn moves up to half its Speed without provoking Opportunity Attacks, and it makes one Radiant Horn attack.\n\n**_Shimmering Shield._** The unicorn targets itself or one creature it can see within 60 feet of itself. The target gains 10 (3d6) Temporary Hit Points, and its AC increases by 2 until the end of the unicorn's next turn. <br>\n&emsp;The unicorn can't take this action again until the start of its next turn.","source":"cache/markdown/monsters-A-Z.md:17343-17442","license":"CC-BY-4.0"}'''
