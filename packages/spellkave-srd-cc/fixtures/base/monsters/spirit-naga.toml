payload_json = '{"text":"### Spirit Naga\n\n_Large Fiend, Chaotic Evil_\n\n**AC** 17 **Initiative** +3 (13) <br>\n**HP** 135 (18d10 + 36) <br>\n**Speed** 40 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+6</td>\n      <td><strong>CON</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+5</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>WIS</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+5</td>\n      <td><strong>CHA</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+6</td>\n    </tr>\n  </tbody>\n</table>\n\n**Immunities** Poison; Charmed, Poisoned<br>\n**Senses** Darkvision 60 ft.; Passive Perception 12<br>\n**Languages** Abyssal, Common<br>\n**CR** 8 (XP 3,900; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Fiendish Restoration._** If it dies, the naga returns to life in 1d6 days and regains all its Hit Points. Only a _Wish_ spell can prevent this trait from functioning.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The naga makes three attacks, using Bite or Necrotic Ray in any combination.\n\n**_Bite._** _Melee Attack Roll:_ +7, reach 10 ft. _Hit:_ 7 (1d6 + 4) Piercing damage plus 14 (4d6) Poison damage.\n\n**_Necrotic Ray._** _Ranged Attack Roll:_ +6, range 60 ft. _Hit:_ 21 (6d6) Necrotic damage.\n\n**_Spellcasting._** The naga casts one of the following spells, requiring no Somatic or Material components and using Intelligence as the spellcasting ability (spell save DC 14): <br>\n&emsp;**At Will:** _Detect Magic_, _Mage Hand_, _Minor Illusion_, _Water Breathing_ <br>\n&emsp;**2/Day Each:** _Detect Thoughts_, _Dimension Door_, _Hold Person_ (level 3 version), _Lightning Bolt_ (level 4 version)","source":"cache/markdown/monsters-A-Z.md:16178-16258","license":"CC-BY-4.0"}'
