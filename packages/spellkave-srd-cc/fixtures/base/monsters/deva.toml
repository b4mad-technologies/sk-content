payload_json = '{"text":"### Deva\n\n_Medium Celestial (Angel), Lawful Good_\n\n**AC** 17 **Initiative** +4 (14) <br>\n**HP** 229 (27d8 + 108) <br>\n**Speed** 30 ft., Fly 90 ft. (hover) <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>DEX</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n      <td><strong>CON</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+4</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>WIS</strong></td>\n      <td>20</td>\n      <td>+5</td>\n      <td>+9</td>\n      <td><strong>CHA</strong></td>\n      <td>20</td>\n      <td>+5</td>\n      <td>+9</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Insight +9, Perception +9<br>\n**Resistances** Radiant<br>\n**Immunities** Charmed, Exhaustion, Frightened<br>\n**Senses** Darkvision 120 ft.; Passive Perception 19<br>\n**Languages** All; telepathy 120 ft.<br>\n**CR** 10 (XP 5,900; PB +4)\n\n#### Traits\n\n<hr>\n\n**_Exalted Restoration._** If the deva dies outside Mount Celestia, its body disappears, and it gains a new body instantly, reviving with all its Hit Points somewhere in Mount Celestia.\n\n**_Magic Resistance._** The deva has Advantage on saving throws against spells and other magical effects.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The deva makes two Holy Mace attacks.\n\n**_Holy Mace._** _Melee Attack Roll:_ +8, reach 5 ft. _Hit:_ 7 (1d6 + 4) Bludgeoning damage plus 18 (4d8) Radiant damage.\n\n**_Spellcasting._** The deva casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 17): <br>\n&emsp;**At Will:** _Detect Evil and Good_, _Shapechange_ (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) <br>\n&emsp;**1/Day Each:** _Commune_, _Raise Dead_\n\n#### Bonus Actions\n\n<hr>\n\n**_Divine Aid (2/Day)._** The deva casts _Cure Wounds_, _Lesser Restoration_, or _Remove Curse_, using the same spellcasting ability as Spellcasting.","source":"cache/markdown/monsters-A-Z.md:4939-5027","license":"CC-BY-4.0"}'
