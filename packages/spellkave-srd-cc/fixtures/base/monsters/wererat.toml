 ft. _Hit:_ 6 (1d6 + 3) Slashing damage.\n\n**_Hand Crossbow (Humanoid or Hybrid Form Only)._** _Ranged Attack Roll:_ +5, range 30/120 ft. _Hit:_ 6 (1d6 + 3) Piercing damage.\n\n#### Bonus Actions\n\n<hr>\n\n**_Shape-Shift._** The wererat shape-shifts into a Medium rat-humanoid hybrid or a Small rat, or it returns to its true humanoid form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed.","source":"cache/markdown/monsters-A-Z.md:18231-18310","license":"CC-BY-4.0"}'''
