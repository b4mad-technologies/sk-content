payload_json = '''{"text":"### Cloaker\n\n_Large Aberration, Chaotic Neutral_\n\n**AC** 14 **Initiative** +5 (15) <br>\n**HP** 91 (14d10 + 14) <br>\n**Speed** 10 ft., Fly 40 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>DEX</strong></td>\n      <td>15</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CON</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>13</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>WIS</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+2</td>\n      <td><strong>CHA</strong></td>\n      <td>7</td>\n      <td>−2</td>\n      <td>−2</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Stealth +5<br>\n**Immunities** Frightened<br>\n**Senses** Darkvision 120 ft.; Passive Perception 12<br>\n**Languages** Deep Speech, Undercommon<br>\n**CR** 8 (XP 3,900; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Light Sensitivity._** While in Bright Light, the cloaker has Disadvantage on attack rolls.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The cloaker makes one Attach attack and two Tail attacks.\n\n**_Attach._** _Melee Attack Roll:_ +6, reach 5 ft. _Hit:_ 13 (3d6 + 3) Piercing damage. If the target is a Large or smaller creature, the cloaker attaches to it. While the cloaker is attached, the target has the Blinded condition, and the cloaker can't make Attach attacks against other targets. In addition, the cloaker halves the damage it takes (round down), and the target takes the same amount of damage. <br>\n&emsp;The cloaker can detach itself by spending 5 feet of movement. The target or a creature within 5 feet of it can take an action to try to detach the cloaker, doing so by succeeding on a DC 14 Strength (Athletics) check.\n\n**_Tail._** _Melee Attack Roll:_ +6, reach 10 ft. _Hit:_ 8 (1d10 + 3) Slashing damage.\n\n#### Bonus Actions\n\n<hr>\n\n**_Moan._** _Wisdom Saving Throw:_ DC 13, each creature in a 60-foot Emanation originating from the cloaker. _Failure:_ The target has the Frightened condition until the end of the cloaker's next turn. _Success:_ The target is immune to this cloaker's Moan for the next 24 hours.\n\n**_Phantasms (Recharge after a Short or Long Rest)._** The cloaker casts the _Mirror Image_ spell, requiring no spell components and using Wisdom as the spellcasting ability. The spell ends early if the cloaker starts or ends its turn in Bright Light.","source":"cache/markdown/monsters-A-Z.md:3811-3897","license":"CC-BY-4.0"}'''
