until the start of the naga's next turn. _Success:_ Half damage only.\n\n**_Spellcasting._** The naga casts one of the following spells, requiring no Somatic or Material components and using Wisdom as the spellcasting ability (spell save DC 16): <br>\n&emsp;**At Will:** _Thaumaturgy_ <br>\n&emsp;**1/Day Each:** _Clairvoyance_, _Cure Wounds_ (level 6 version), _Flame Strike_ (level 6 version), _Geas_, _True Seeing_","source":"cache/markdown/monsters-A-Z.md:8668-8749","license":"CC-BY-4.0"}'''
