payload_json = '''{"text":"### Ancient Red Dragon\n\n_Gargantuan Dragon (Chromatic), Chaotic Evil_\n\n**AC** 22 **Initiative** +14 (24) <br>\n**HP** 507 (26d20 + 234) <br>\n**Speed** 40 ft., Climb 40 ft., Fly 80 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>30</td>\n      <td>+10 +10</td>\n      <td>DEX</td>\n      <td><strong>DEX</strong></td>\n      <td>10 +0</td>\n      <td>+7</td>\n      <td>CON 29</td>\n      <td><strong>CON</strong></td>\n      <td>29</td>\n      <td>+9 +9</td>\n      <td>INT</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>18</td>\n      <td>+4 +4</td>\n      <td>WIS</td>\n      <td><strong>WIS</strong></td>\n      <td>15 +2</td>\n      <td>+9</td>\n      <td>CHA 27</td>\n      <td><strong>CHA</strong></td>\n      <td>27</td>\n      <td>+8 +8</td>\n      <td>+8 +8</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Perception +16, Stealth +7<br>\n**Immunities** Fire<br>\n**Senses** Blindsight 60 ft., Darkvision 120 ft.; Passive Perception 26<br>\n**Languages** Common, Draconic<br>\n**CR** 24 (XP 62,000, or 75,000 in lair; PB +7)\n\n#### Traits\n\n<hr>\n\n**_Legendary Resistance (4/Day, or 5/Day in Lair)._** If the dragon fails a saving throw, it can choose to succeed instead.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The dragon makes three Rend attacks. It can replace one attack with a use of Spellcasting to cast _Scorching Ray_ (level 3 version).\n\n**_Rend._** _Melee Attack Roll:_ +17, reach 15 ft. _Hit:_ 19 (2d8 + 10) Slashing damage plus 10 (3d6) Fire damage.\n\n**_Fire Breath (Recharge 5–6)._** _Dexterity Saving Throw:_ DC 24, each creature in a 90-foot Cone. _Failure:_ 91 (26d6) Fire damage. _Success:_ Half damage.\n\n**_Spellcasting._** The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 23, +15 to hit with spell attacks): <br>\n&emsp;**At Will:** _Command_ (level 2 version), _Detect Magic_, _Scorching Ray_ (level 3 version) <br>\n&emsp;**1/Day Each:** _Fireball_ (level 6 version), _Scrying_\n\n#### Legendary Actions\n\n<hr>\n\n_Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns._\n\n**_Commanding Presence._** The dragon uses Spellcasting to cast _Command_ (level 2 version). The dragon can't take this action again until the start of its next turn.\n\n**_Fiery Rays._** The dragon uses Spellcasting to cast _Scorching Ray_ (level 3 version). The dragon can't take this action again until the start of its next turn.\n\n**_Pounce._** The dragon moves up to half its Speed, and it makes one Rend attack.","source":"cache/markdown/monsters-A-Z.md:14058-14151","license":"CC-BY-4.0"}'''
