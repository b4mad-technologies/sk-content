et has Disadvantage on Strength-based D20 Tests and subtracts 3 (1d6) from its damage rolls. It repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.","source":"cache/markdown/monsters-A-Z.md:7572-7651","license":"CC-BY-4.0"}'''
