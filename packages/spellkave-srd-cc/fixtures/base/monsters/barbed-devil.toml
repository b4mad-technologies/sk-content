payload_json = '''{"text":"### Barbed Devil\n\n_Medium Fiend (Devil), Lawful Evil_\n\n**AC** 15 **Initiative** +3 (13) <br>\n**HP** 110 (13d8 + 52) <br>\n**Speed** 30 ft., Climb 30 ft. <br>\n\n<table>\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n      <th></th>\n      <th></th>\n      <th>MOD</th>\n      <th>SAVE</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>STR</strong></td>\n      <td>16</td>\n      <td>+3</td>\n      <td>+6</td>\n      <td><strong>DEX</strong></td>\n      <td>17</td>\n      <td>+3</td>\n      <td>+3</td>\n      <td><strong>CON</strong></td>\n      <td>18</td>\n      <td>+4</td>\n      <td>+7</td>\n    </tr>\n    <tr>\n      <td><strong>INT</strong></td>\n      <td>12</td>\n      <td>+1</td>\n      <td>+1</td>\n      <td><strong>WIS</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+5</td>\n      <td><strong>CHA</strong></td>\n      <td>14</td>\n      <td>+2</td>\n      <td>+5</td>\n    </tr>\n  </tbody>\n</table>\n\n**Skills** Deception +5, Insight +5, Perception +8<br>\n**Resistances** Cold<br>\n**Immunities** Fire, Poison; Poisoned<br>\n**Senses** Darkvision 120 ft. (unimpeded by magical Darkness); Passive Perception 18<br>\n**Languages** Infernal; telepathy 120 ft.<br>\n**CR** 5 (XP 1,800; PB +3)\n\n#### Traits\n\n<hr>\n\n**_Barbed Hide._** At the start of each of its turns, the devil deals 5 (1d10) Piercing damage to any creature it is grappling or any creature grappling it.\n\n**_Diabolical Restoration._** If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.\n\n**_Magic Resistance._** The devil has Advantage on saving throws against spells and other magical effects.\n\n#### Actions\n\n<hr>\n\n**_Multiattack._** The devil makes one Claws attack and one Tail attack, or it makes two Hurl Flame attacks.\n\n**_Claws._** _Melee Attack Roll:_ +6, reach 5 ft. _Hit:_ 10 (2d6 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13) from both claws.\n\n**_Tail._** _Melee Attack Roll:_ +6, reach 10 ft. _Hit:_ 14 (2d10 + 3) Slashing damage.\n\n**_Hurl Flame._** _Ranged Attack Roll:_ +5, range 150 ft. _Hit:_ 17 (5d6) Fire damage. If the target is a flammable object that isn't being worn or carried, it starts burning.","source":"cache/markdown/monsters-A-Z.md:1095-1179","license":"CC-BY-4.0"}'''
