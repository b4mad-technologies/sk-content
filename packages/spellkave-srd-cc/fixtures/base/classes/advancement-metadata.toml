[[metadata_namespaces]]
audience = "public"
bundle_id = "srd"
description = """class,level -> capability id: an unconditional grant a class receives at a given level. target_kind = entity_definition, target_ref = the granted class-feature/capability entity's own id, payload_json = {"class": <slug>, "level": <n>}. ADR-0073 rung 4 (D-4): the world behaves identically whether a row exists or not — only a DM-side reader consumes it (`packages/spellkave-srd-cc/src/dm/data/advancement.ts`)."""
namespace = "srd.advancement_grant"
on_demand = true

[[metadata_namespaces]]
audience = "public"
bundle_id = "srd"
description = """class,level,choice_group -> one MEMBER entity id of a choose-N menu at that level (payload_json = {"class": <slug>, "level": <n>, "choice_group": <string>, "choose_n": <n>, "recommended"?: <member id>, "rechoose"?: "none"|"long_rest_one"}), grouped by choice_group so a reader can reconstruct one menu from its member rows. Real rows: Fighter L1 Fighting Style (srd.feat.fighting_style members, recommended Defense), every class' L3 subclass menu (choose-1-of-1), and every class' L4 ASI-or-feat menu (ASI + Grappler, recommended ASI). Shape: docs/advancement-choice.md + bead sk-609b.3 (design trail) + bead sk-609b.5 (design trail)."""
namespace = "srd.advancement_choice"
on_demand = true
