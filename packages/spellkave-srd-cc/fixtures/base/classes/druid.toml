payload_json = '{"text":"#### Level 3: Circle of the Land Spells\n\nWhenever you finish a Long Rest, choose one type of land: arid, polar, temperate, or tropical. Consult the table below that corresponds to the chosen type; you have the spells listed for your Druid level and lower prepared.\n\n**Arid Land**\n\n<table>\n  <thead>\n    <tr>\n      <th>Druid Level</th>\n      <th>Circle Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Blur, Burning Hands, Fire Bolt</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Fireball</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Blight</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Wall of Stone</td>\n    </tr>\n  </tbody>\n</table>\n\n**Polar Land**\n\n<table>\n  <thead>\n    <tr>\n      <th>Druid Level</th>\n      <th>Circle Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Fog Cloud, Hold Person, Ray of Frost</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Sleet Storm</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Ice Storm</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Cone of Cold</td>\n    </tr>\n  </tbody>\n</table>\n\n**Temperate Land**\n\n<table>\n  <thead>\n    <tr>\n      <th>Druid Level</th>\n      <th>Circle Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Misty Step, Shocking Grasp, Sleep</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Lightning Bolt</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Freedom of Movement</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Tree Stride</td>\n    </tr>\n  </tbody>\n</table>\n\n**Tropical Land**\n\n<table>\n  <thead>\n    <tr>\n      <th>Druid Level</th>\n      <th>Circle Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Acid Splash, Ray of Sickness, Web</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Stinking Cloud</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      