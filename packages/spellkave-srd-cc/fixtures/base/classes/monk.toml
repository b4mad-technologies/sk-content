[[condition_definitions.hooks]]
detail_filter_source = "$event.detail.entity_id == target.stat('core/entity_id') && $event.detail.resource_id == 'srd/hp' && $event.detail.delta < 0 && target.status('srd/condition/deflect-expended') == false"
event_kind = "Layer2.ResourceDelta"
expression_source = "invoke_outcome_graph('srd/monk/deflect-attacks/mitigate')"

