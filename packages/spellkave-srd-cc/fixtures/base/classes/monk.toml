payload_json = '''{"text":"#### Level 10: Heightened Focus\n\nYour Flurry of Blows, Patient Defense, and Step of the Wind gain the following benefits.\n\n**_Flurry of Blows._** You can expend 1 Focus Point to use Flurry of Blows and make three Unarmed Strikes with it instead of two.\n\n**_Patient Defense._** When you expend a Focus Point to use Patient Defense, you gain a number of Temporary Hit Points equal to two rolls of your Martial Arts die.\n\n**_Step of the Wind._** When you expend a Focus Point to use Step of the Wind, you can choose a willing creature within 5 feet of yourself that is Large or smaller. You move the creature with you until the end of your turn. The creature's movement doesn't provoke Opportunity Attacks.","source":"cache/markdown/classes.md:5216-5225","license":"CC-BY-4.0"}'''
