payload_json = '''{"text":"### Paladin Spell List\n\nThis section presents the Paladin spell list. The spells are organized by spell level and then alphabetized, and each spell's school of magic is listed. In the Special column, _C_ means the spell requires Concentration, _R_ means it's a Ritual, and _M_ means it requires a specific Material component.\n\n#### Level 1 Paladin Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Bless</td>\n      <td>Enchantment</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Command</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Cure Wounds</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Detect Evil and Good</td>\n      <td>Divination</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Detect Magic</td>\n      <td>Divination</td>\n      <td>C, R</td>\n    </tr>\n    <tr>\n      <td>Detect Poison and Disease</td>\n      <td>Divination</td>\n      <td>C, R</td>\n    </tr>\n    <tr>\n      <td>Divine Favor</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Divine Smite</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Heroism</td>\n      <td>Enchantment</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Protection from Evil and Good</td>\n      <td>Abjuration</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Purify Food and Drink</td>\n      <td>Transmutation</td>\n      <td>R</td>\n    </tr>\n    <tr>\n      <td>Searing Smite</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Shield of Faith</td>\n      <td>Abjuration</td>\n      <td>C</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 2 Paladin Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Aid</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Find Steed</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Gentle Repose</td>\n      <td>Necromancy</td>\n      <td>R, M</td>\n    </tr>\n    <tr>\n      <td>Lesser Restoration</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Locate Object</td>\n      <td>Divination</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Magic Weapon</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Prayer of Healing</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Protection from Poison</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Shining Smite</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Warding Bond</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Zone of Truth</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 3 Paladin Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Create Food and Water</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Daylight</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Dispel Magic</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Magic Circle</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Remove Curse</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Revivify</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 4 Paladin Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead