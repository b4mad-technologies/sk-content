payload_json = '''{"text":"#### Level 13: Use Magic Device\n\nYou've learned how to maximize use of magic items, granting you the following benefits.\n\n_Attunement._ You can attune to up to four magic items at once.\n\n_Charges._ Whenever you use a magic item property that expends charges, roll 1d6. On a roll of 6, you use the property without expending the charges.\n\n_Scrolls._ You can use any _Spell Scroll_, using Intelligence as your spellcasting ability for the spell. If the spell is a cantrip or a level 1 spell, you can cast it reliably. If the scroll contains a higher-level spell, you must first succeed on an Intelligence (Arcana) check (DC 10 plus the spell's level). On a successful check, you cast the spell from the scroll. On a failed check, the scroll disintegrates.","source":"cache/markdown/classes.md:7157-7166","license":"CC-BY-4.0"}'''
