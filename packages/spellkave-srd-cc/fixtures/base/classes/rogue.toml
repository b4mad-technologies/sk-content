default_visibility = "Public"
description = "Once per turn you can deal extra damage when you hit with a finesse or ranged weapon, given advantage or an active ally near the target."
display_name = "Sneak Attack"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/rogue/thieves-cant"
default_visibility = "Public"
description = "You know a secret language used to share messages with other criminals and rogues. You can understand it and use it to communicate discreetly."
display_name = "Thieves' Cant"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/expertise/acrobatics"
default_visibility = "Public"
description = "Your training makes you exceptionally skilled at Acrobatics. When you make an Acrobatics check using your Proficiency Bonus, you add it twice."
display_name = "Expertise: Skill: Acrobatics"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/expertise/animal-handling"
default_visibility = "Public"
description = "Your training with Animal Handling lets you add twice your Proficiency Bonus to checks you make with that skill."
display_name = "Expertise: Skill: Animal Handling"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/expertise/arcana"
default_visibility = "Public"
