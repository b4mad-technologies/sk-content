ismatic Spray</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Project Image</td>\n      <td>Illusion</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Regenerate</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Resurrection</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Symbol</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Teleport</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 8 Bard Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Antipathy/Sympathy</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Befuddlement</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Dominate Monster</td>\n      <td>Enchantment</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Glibness</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Mind Blank</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Power Word Stun</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 9 Bard Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Foresight</td>\n      <td>Divination</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Power Word Heal</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Power Word Kill</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Prismatic Wall</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>True Polymorph</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n  </tbody>\n</table>\n\n### Bard Subclass: College of Lore\n\n_Plumb the Depths of Magical Knowledge_\n\nBards of the College of Lore collect spells and secrets from diverse sources, such as scholarly tomes, mystical rites, and peasant tales. The college's members gather in libraries and universities to share their lore with one another. They also meet at festivals or affairs of state, where they can expose corruption, unravel lies, and poke fun at self-important figures of authority.\n\n#### Level 3: Bonus Proficiencies\n\nYou gain proficiency with three skills of your choice.\n\n#### Level 3: Cutting Words\n\nYou learn to use your wit to supernaturally distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of yourself makes a damage roll or succeeds on an ability check or attack roll, you can take a Reaction to expend one use of your Bardic Inspiration; roll your Bardic Inspiration die, and subtract the number rolled from the creature's roll, reducing the damage or potentially turning the success into a failure.\n\n#### Level 6: Magical Discoveries\n\nYou learn two spells of your choice. These spells can come from the Cleric, Druid, or Wizard spell list or any combination thereof (see a class's section for its spell list). A spell you choose must be a cantrip or a spell for which you have spell slots, as shown in the Bard Features table.\n\nYou always have the chosen spells prepared, and whenever you gain a Bard level, you can replace one of the spells with another spell that meets these requirements.\n\n#### Level 14: Peerless Skill\n\nWhen you make an ability check or attack roll and fail, you can expend one use of Bardic Inspiration; roll the Bardic Inspiration die, and add the number rolled to the d20, potentially turning a failure into a success. On a failure, the Bardic Inspiration isn't expended.","source":"cache/markdown/classes.md:373-1745","license":"CC-BY-4.0"}'''
