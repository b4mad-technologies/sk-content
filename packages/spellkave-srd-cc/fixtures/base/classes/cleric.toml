namespace = "srd.text"
payload_json = '{"text":"#### Level 3: Preserve Life\n\nAs a Magic action, you present your Holy Symbol and expend a use of your Channel Divinity to evoke healing energy that can restore a number of Hit Points equal to five times your Cleric level. Choose Bloodied creatures within 30 feet of yourself (which can include you), and divide those Hit Points among them. This feature can restore a creature to no more than half its Hit Point maximum.","source":"cache/markdown/classes.md:3001-3004","license":"CC-BY-4.0"}'
