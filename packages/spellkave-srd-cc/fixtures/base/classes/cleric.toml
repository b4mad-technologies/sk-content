payload_json = '{"text":"#### Level 7: Blessed Strikes\n\nDivine power infuses you in battle. You gain one of the following options of your choice (if you get either option from a Cleric subclass in an older book, use only the option you choose for this feature).\n\n_Divine Strike._ Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra 1d8 Necrotic or Radiant damage (your choice).\n\n_Potent Spellcasting._ Add your Wisdom modifier to the damage you deal with any Cleric cantrip.","source":"cache/markdown/classes.md:2239-2246","license":"CC-BY-4.0"}'
