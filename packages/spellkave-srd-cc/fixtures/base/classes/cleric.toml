  <tr>\n      <td>Sending</td>\n      <td>Divination</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Speak with Dead</td>\n      <td>Necromancy</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Spirit Guardians</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Tongues</td>\n      <td>Divination</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Water Walk</td>\n      <td>Transmutation</td>\n      <td>R</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 4 Cleric Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Aura of Life</td>\n      <td>Abjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Banishment</td>\n      <td>Abjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Control Water</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Death Ward</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Divination</td>\n      <td>Divination</td>\n      <td>R, M</td>\n    </tr>\n    <tr>\n      <td>Freedom of Movement</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Guardian of Faith</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Locate Creature</td>\n      <td>Divination</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Stone Shape</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 5 Cleric Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Commune</td>\n      <td>Divination</td>\n      <td>R</td>\n    </tr>\n    <tr>\n      <td>Contagion</td>\n      <td>Necromancy</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Dispel Evil and Good</td>\n      <td>Abjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Flame Strike</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Geas</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Greater Restoration</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Hallow</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Insect Plague</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Legend Lore</td>\n      <td>Divination</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Mass Cure Wounds</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Planar Binding</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Raise Dead</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Scrying</td>\n      <td>Divination</td>\n      <td>C, M</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 6 Cleric Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Blade Barrier</td>\n      <td>Evocation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Create Undead</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Find the Path</td>\n      <td>Divination</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Forbiddance</td>\n      <td>Abjuration</td>\n      <td>R, M</td>\n    </tr>\n    <tr>\n      <td>Harm</td>\n      <td>Necromancy</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Heal</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Heroes' Feast</td>\n      <td>Conjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Planar Ally</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Sunbeam</td>\n      <td>Evocation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>True Seeing</td>\n      <td>Divination</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Word of Recall</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 7 Cleric Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Conjure Celestial</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Divine Word</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Etherealness</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Fire Storm</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Plane Shift</td>\n      <td>Conjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Regenerate</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Resurrection</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Symbol</td>\n      <td>Abjuration</td>\n      <td>M</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 8 Cleric Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Antimagic Field</td>\n      <td>Abjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Control Weather</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Earthquake</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Holy Aura</td>\n      <td>Abjuration</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Sunburst</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 9 Cleric Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Astral Projection</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Gate</td>\n      <td>Conjuration</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Mass Heal</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Power Word Heal</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>True Resurrection</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n  </tbody>\n</table>\n\n### Cleric Subclass: Life Domain\n\n_Soothe the Hurts of the World_\n\nThe Life Domain focuses on the positive energy that helps sustain all life in the multiverse. Clerics who tap into this domain are masters of healing, using that life force to cure many hurts.\n\nExistence itself relies on the positive energy associated with this domain, so a Cleric of almost any religious tradition might choose it. This domain is particularly associated with agricultural deities, gods of healing or endurance, and gods of home and community. Religious orders of healing also seek the magic of this domain.\n\n#### Level 3: Disciple of Life\n\nWhen a spell you cast with a spell slot restores Hit Points to a creature, that creature regains additional Hit Points on the turn you cast the spell. The additional Hit Points equal 2 plus the spell slot's level.\n\n#### Level 3: Life Domain Spells\n\nYour connection to this divine domain ensures you always have certain spells ready. When you reach a Cleric level specified in the Life Domain Spells table, you thereafter always have the listed spells prepared.\n\n**Life Domain Spells**\n\n<table>\n  <thead>\n    <tr>\n      <th>Cleric Level</th>\n      <th>Prepared Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Aid, Bless, Cure Wounds, Lesser Restoration</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Mass Healing Word, Revivify</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Aura of Life, Death Ward</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Greater Restoration, Mass Cure Wounds</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 3: Preserve Life\n\nAs a Magic action, you present your Holy Symbol and expend a use of your Channel Divinity to evoke healing energy that can restore a number of Hit Points equal to five times your Cleric level. Choose Bloodied creatures within 30 feet of yourself (which can include you), and divide those Hit Points among them. This feature can restore a creature to no more than half its Hit Point maximum.\n\n#### Level 6: Blessed Healer\n\nThe healing spells you cast on others heal you as well. Immediately after you cast a spell with a spell slot that restores Hit Points to one or more creatures other than yourself, you regain Hit Points equal to 2 plus the spell slot's level.\n\n#### Level 17: Supreme Healing\n\nWhen you would normally roll one or more dice to restore Hit Points to a creature with a spell or Channel Divinity, don't roll those dice for the healing; instead use the highest number possible for each die. For example, instead of restoring 2d6 Hit Points to a creature with a spell, you restore 12.","source":"cache/markdown/classes.md:1747-3011","license":"CC-BY-4.0"}'''
