. This feature can restore a creature to no more than half its Hit Point maximum.\n\n#### Level 6: Blessed Healer\n\nThe healing spells you cast on others heal you as well. Immediately after you cast a spell with a spell slot that restores Hit Points to one or more creatures other than yourself, you regain Hit Points equal to 2 plus the spell slot's level.\n\n#### Level 17: Supreme Healing\n\nWhen you would normally roll one or more dice to restore Hit Points to a creature with a spell or Channel Divinity, don't roll those dice for the healing; instead use the highest number possible for each die. For example, instead of restoring 2d6 Hit Points to a creature with a spell, you restore 12.","source":"cache/markdown/classes.md:2956-3011","license":"CC-BY-4.0"}'''
