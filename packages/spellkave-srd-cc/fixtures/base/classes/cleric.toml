[[metadata_attachments]]
bundle_id = "srd"
namespace = "srd.text"
payload_json = '{"text":"#### Level 3: Life Domain Spells\n\nYour connection to this divine domain ensures you always have certain spells ready. When you reach a Cleric level specified in the Life Domain Spells table, you thereafter always have the listed spells prepared.\n\n**Life Domain Spells**\n\n<table>\n  <thead>\n    <tr>\n      <th>Cleric Level</th>\n      <th>Prepared Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Aid, Bless, Cure Wounds, Lesser Restoration</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Mass Healing Word, Revivify</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Aura of Life, Death Ward</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Greater Restoration, Mass Cure Wounds</td>\n    </tr>\n  </tbody>\n</table>","source":"cache/markdown/classes.md:2968-3000","license":"CC-BY-4.0"}'
source = "manifest"
target_kind = "entity_definition"
target_ref = "srd/class-feature/cleric/life-domain/life-domain-spells"

