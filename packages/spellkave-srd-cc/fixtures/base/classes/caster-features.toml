[[niche_definitions]]
bundle_id = "srd"
description = "A cleric’s sacred power, used to produce a divine effect granted by your calling. You spend it when a feature tells you to do so."
display_name = "Channel Divinity (Cleric)"
niche_id = "capability:srd/class-feature/cleric/channel-divinity"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "A sacred power granted by your oath. You use it to fuel certain paladin features, then regain uses when you rest."
display_name = "Channel Divinity (Paladin)"
niche_id = "capability:srd/class-feature/paladin/channel-divinity"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "You magically take the form of a beast you have learned to emulate. You use this feature to assume that form for a limited time, gaining its physical traits while retaining key parts of yourself."
display_name = "Wild Shape"
niche_id = "capability:srd/class-feature/druid/wild-shape"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "A healing reserve you carry with you. You spend points from it to restore a creature’s health or cure certain ailments by touch."
display_name = "Lay On Hands"
niche_id = "capability:srd/class-feature/paladin/lay-on-hands"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "A ranger specialty that marks certain creature kinds as familiar quarry. You gain related tracking and knowledge benefits against the kinds you choose."
display_name = "Favored Enemy"
niche_id = "capability:srd/class-feature/ranger/favored-enemy"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "You draw on your inborn magic to heighten your spells for a limited time. You activate it as a bonus action, gaining its benefits until the effect ends."
display_name = "Innate Sorcery"
niche_id = "capability:srd/class-feature/sorcerer/innate-sorcery"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "Once per day after a short rest, you can regain expended spell power. The spells you recover must fit within your class’s recovery limit."
display_name = "Arcane Recovery"
niche_id = "capability:srd/class-feature/wizard/arcane-recovery"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "You briefly focus to regain some expended magical power. You can use it once between rests."
display_name = "Magical Cunning"
niche_id = "capability:srd/class-feature/warlock/magical-cunning"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "When you hit a creature with a melee weapon attack, you can expend a spell slot to deal extra radiant damage to it."
display_name = "Divine Smite"
niche_id = "capability:srd/class-feature/paladin/divine-smite"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "You draw on an inner reserve of magical power to fuel your sorcerer abilities. You can convert that power into spell slots or turn spell slots into more of it."
display_name = "Font of Magic"
niche_id = "capability:srd/class-feature/sorcerer/font-of-magic"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "You use your druid magic to temporarily summon a spirit in animal form to aid you as a familiar. You perform the summoning by spending a use of your Wild Shape."
display_name = "Wild Companion"
niche_id = "capability:srd/class-feature/druid/wild-companion"
predicate_source = ""
provider = "actor"

[[niche_definitions]]
bundle_id = "srd"
description = "You can cast Mage Armor on yourself whenever you wish, without spending a spell slot or providing material components."
display_name = "Armor of Shadows"
niche_id = "capability:srd/eldritch-invocation/armor-of-shadows"
predicate_source = ""
provider = "actor"

