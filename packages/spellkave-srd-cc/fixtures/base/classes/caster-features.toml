[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/cleric/channel-divinity"
default_visibility = "Public"
description = "You call on sacred power to produce a Channel Divinity effect granted by your class or subclass. You use it to choose from options such as healing, harming, or driving away undead."
display_name = "Channel Divinity"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/paladin/channel-divinity"
default_visibility = "Public"
description = "You draw on sacred power to fuel a Channel Divinity option granted by your oath. You can use it only when an option tells you how to spend it."
display_name = "Channel Divinity (Paladin)"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/bard/bardic-inspiration"
default_visibility = "Public"
description = "You inspire an ally, giving them a die they can spend after rolling to improve a check, attack, or saving throw."
display_name = "Bardic Inspiration"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/druid/wild-shape"
default_visibility = "Public"
description = "You magically take on a beast’s form for a limited time. You use it to gain that form’s movement and physical abilities, returning to your normal form when the effect ends."
display_name = "Wild Shape"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/paladin/lay-on-hands"
default_visibility = "Public"
description = "You draw on a pool of healing power to restore a creature’s hit points. Choose how much to spend, up to the power you have remaining."
display_name = "Lay On Hands"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/ranger/favored-enemy"
default_visibility = "Public"
description = "Choose a type of creature you know how to track and fight. You gain special advantages when recalling information about it or pursuing it through the wild."
display_name = "Favored Enemy"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/sorcerer/innate-sorcery"
default_visibility = "Public"
description = "You can draw on your innate magical power to heighten your spellcasting. When you activate it, you gain its benefits for a short time."
display_name = "Innate Sorcery"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/wizard/arcane-recovery"
default_visibility = "Public"
description = "Once between long rests, you recover expended spell slots during a short rest. The slots you regain have a combined level based on your wizard level."
display_name = "Arcane Recovery"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/warlock/magical-cunning"
default_visibility = "Public"
description = "Once between long rests, you can perform a brief rite to regain some of your expended pact magic. You use it when you have time to prepare but cannot complete a long rest."
display_name = "Magical Cunning"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/cleric/life-domain/disciple-of-life"
default_visibility = "Public"
description = "When you cast a spell using a spell slot that restores hit points, each creature healed regains additional hit points equal to 2 plus the spell’s level."
display_name = "Disciple of Life"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/cleric/life-domain/preserve-life"
default_visibility = "Public"
description = "You use your Channel Divinity to restore a large amount of hit points to a wounded creature that is below half its hit point maximum."
display_name = "Preserve Life"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/paladin/divine-smite"
default_visibility = "Public"
description = "After you hit a creature with a melee attack, you can use a bonus action and expend a 1st-level spell slot to deal extra radiant damage to it."
display_name = "Divine Smite"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/sorcerer/font-of-magic"
default_visibility = "Public"
description = "You convert sorcery points into spell slots, or expend spell slots to regain sorcery points. The spell slot’s level determines the points gained or required."
display_name = "Font of Magic"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/metamagic/careful-spell"
default_visibility = "Public"
description = "When you cast a spell that forces saving throws, you can spend 1 sorcery point to protect chosen creatures from its effects if they succeed on the save."
display_name = "Metamagic: Careful Spell"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/class-feature/druid/wild-companion"
default_visibility = "Public"
description = "You use a Magic action and expend a use of Wild Shape to summon a familiar without providing material components. The familiar is a Fey spirit in animal form."
display_name = "Wild Companion"

[[capability_definitions]]
actor_kind = "entity"
bundle_id = "srd"
capability_id = "srd/eldritch-invocation/armor-of-shadows"
default_visibility = "Public"
description = "You can cast Mage Armor on yourself without expending a spell slot."
display_name = "Armor of Shadows"

