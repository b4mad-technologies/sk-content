/td>\n      <td>Evocation</td>\n      <td>C</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 6 Sorcerer Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Chain Lightning</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Circle of Death</td>\n      <td>Necromancy</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Disintegrate</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Eyebite</td>\n      <td>Necromancy</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Flesh to Stone</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Freezing Sphere</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Globe of Invulnerability</td>\n      <td>Abjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Mass Suggestion</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Move Earth</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Sunbeam</td>\n      <td>Evocation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>True Seeing</td>\n      <td>Divination</td>\n      <td>M</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 7 Sorcerer Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Delayed Blast Fireball</td>\n      <td>Evocation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Etherealness</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Finger of Death</td>\n      <td>Necromancy</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Fire Storm</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Plane Shift</td>\n      <td>Conjuration</td>\n      <td>M</td>\n    </tr>\n    <tr>\n      <td>Prismatic Spray</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Reverse Gravity</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Teleport</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 8 Sorcerer Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Demiplane</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Dominate Monster</td>\n      <td>Enchantment</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Earthquake</td>\n      <td>Transmutation</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Incendiary Cloud</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Power Word Stun</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Sunburst</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 9 Sorcerer Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Gate</td>\n      <td>Conjuration</td>\n      <td>C, M</td>\n    </tr>\n    <tr>\n      <td>Meteor Swarm</td>\n      <td>Evocation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Power Word Kill</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Time Stop</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Wish</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n  </tbody>\n</table>\n\n### Sorcerer Subclass: Draconic Sorcery\n\n_Breathe the Magic of Dragons_\n\nYour innate magic comes from the gift of a dragon. Perhaps an ancient dragon facing death bequeathed some of its magical power to you or your ancestor. You might have absorbed magic from a site infused with dragons' power. Or perhaps you handled a treasure taken from a dragon's hoard that was steeped in draconic power. Or you might have a dragon for an ancestor.\n\n#### Level 3: Draconic Resilience\n\nThe magic in your body manifests physical traits of your draconic gift. Your Hit Point maximum increases by 3, and it increases by 1 whenever you gain another Sorcerer level.\n\nParts of you are also covered by dragon-like scales. While you aren't wearing armor, your base Armor Class equals 10 plus your Dexterity and Charisma modifiers.\n\n#### Level 3: Draconic Spells\n\nWhen you reach a Sorcerer level specified in the Draconic Spells table, you thereafter always have the listed spells prepared.\n\n**Draconic Spells**\n\n<table>\n  <thead>\n    <tr>\n      <th>Sorcerer Level</th>\n      <th>Spells</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>3</td>\n      <td>Alter Self, Chromatic Orb, Command, Dragon's Breath</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Fear, Fly</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Arcane Eye, Charm Monster</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Legend Lore, Summon Dragon</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 6: Elemental Affinity\n\nYour draconic magic has an affinity with a damage type associated with dragons. Choose one of those types: Acid, Cold, Fire, Lightning, or Poison.\n\nYou have Resistance to that damage type, and when you cast a spell that deals damage of that type, you can add your Charisma modifier to one damage roll of that spell.\n\n#### Level 14: Dragon Wings\n\nAs a Bonus Action, you can cause draconic wings to appear on your back. The wings last for 1 hour or until you dismiss them (no action required). For the duration, you have a Fly Speed of 60 feet.\n\nOnce you use this feature, you can't use it again until you finish a Long Rest unless you spend 3 Sorcery Points (no action required) to restore your use of it.\n\n#### Level 18: Dragon Companion\n\nYou can cast _Summon Dragon_ without a Material component. You can also cast it once without a spell slot, and you regain the ability to cast it in this way when you finish a Long Rest.\n\nWhenever you start casting the spell, you can modify it so that it doesn't require Concentration. If you do so, the spell's duration becomes 1 minute for that casting.","source":"cache/markdown/classes.md:7171-8688","license":"CC-BY-4.0"}'''
