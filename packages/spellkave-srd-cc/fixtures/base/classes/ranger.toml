description = "Rangers thrive where roads fade and the wild keeps its own counsel. They are patient trackers, sharp-eyed scouts, and stubborn guardians who learn every spoor, storm sign, and hidden trail. Whether guiding companions through hostile country or stalking a dangerous quarry, a ranger turns hard terrain and long odds into familiar ground."
