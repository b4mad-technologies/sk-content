[[metadata_attachments]]
bundle_id = "srd"
namespace = "srd.text"
payload_json = '''{"text":"### Ranger Spell List\n\nThis section presents the Ranger spell list. The spells are organized by spell level and then alphabetized, and each spell's school of magic is listed. In the Special column, _C_ means the spell requires Concentration, _R_ means it's a Ritual, and _M_ means it requires a specific Material component.\n\n#### Level 1 Ranger Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Alarm</td>\n      <td>Abjuration</td>\n      <td>R</td>\n    </tr>\n    <tr>\n      <td>Animal Friendship</td>\n      <td>Enchantment</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Cure Wounds</td>\n      <td>Abjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Detect Magic</td>\n      <td>Divination</td>\n      <td>C, R</td>\n    </tr>\n    <tr>\n      <td>Detect Poison and Disease</td>\n      <td>Divination</td>\n      <td>C, R</td>\n    </tr>\n    <tr>\n      <td>Ensnaring Strike</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Entangle</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Fog Cloud</td>\n      <td>Conjuration</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Goodberry</td>\n      <td>Conjuration</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Hunter's Mark</td>\n      <td>Divination</td>\n      <td>C</td>\n    </tr>\n    <tr>\n      <td>Jump</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Longstrider</td>\n      <td>Transmutation</td>\n      <td>—</td>\n    </tr>\n    <tr>\n      <td>Speak with Animals</td>\n      <td>Divination</td>\n      <td>R</td>\n    </tr>\n  </tbody>\n</table>\n\n#### Level 2 Ranger Spells\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>School</th>\n      <th>Special</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Aid</td>\n      <td>