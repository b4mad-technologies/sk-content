[[dsl_macro_definitions]]
body_source = "cond(level <= 1, 0, cond(level == 2, 300, cond(level == 3, 900, cond(level == 4, 2700, cond(level == 5, 6500, cond(level == 6, 14000, cond(level == 7, 23000, cond(level == 8, 34000, cond(level == 9, 48000, cond(level == 10, 64000, cond(level == 11, 85000, cond(level == 12, 100000, cond(level == 13, 120000, cond(level == 14, 140000, cond(level == 15, 165000, cond(level == 16, 195000, cond(level == 17, 225000, cond(level == 18, 265000, cond(level == 19, 305000, 355000)))))))))))))))))))"
bundle_id = "srd"
description = """SRD: "The Character Advancement table lists the XP you need to advance to a level ... When your XP total equals or exceeds a number in the Experience Points column, you reach the corresponding level." (character-creation.md:657-767 (§ Level Advancement)) Encodes the table's Level -> XP column as a 19-deep cond ladder (no closed-form reduction exists, unlike srd/proficiency_bonus); level <= 1 clamps to 0."""
