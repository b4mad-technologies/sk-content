payload_json = '''{"text":"#### Candle of Invocation\n\n_Wondrous Item, Very Rare (Requires Attunement)_\n\nThis candle's magic is activated when the candle is lit, which requires a Magic action. After burning for 4 hours, the candle is destroyed. You can snuff it out early for use at a later time. Deduct the time it burned in increments of 1 minute from its total burn time.\n\nWhile lit, the candle sheds Dim Light in a 30-foot radius. While you are within that light, you have Advantage on D20 Tests. In addition, a Cleric or Druid in the light can cast level 1 spells they have prepared without expending spell slots.\n\nAlternatively, when you light the candle for the first time, you can cast _Gate_ with it. Doing so destroys the candle. The portal created by the spell\nlinks to a particular Outer Plane chosen by the GM or determined by rolling on the following table.\n\n<table>\n  <thead>\n    <tr>\n      <th>1d100</th>\n      <th>Outer Plane</th>\n      <th>1d100</th>\n      <th>Outer Plane</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>01–05</td>\n      <td>Abyss</td>\n      <td>55–59</td>\n      <td>Gehenna</td>\n    </tr>\n    <tr>\n      <td>06–10</td>\n      <td>Acheron</td>\n      <td>60–64</td>\n      <td>Hades</td>\n    </tr>\n    <tr>\n      <td>11–17</td>\n      <td>Arborea</td>\n      <td>65–69</td>\n      <td>Limbo</td>\n    </tr>\n    <tr>\n      <td>18–25</td>\n      <td>Arcadia</td>\n      <td>70–77</td>\n      <td>Mechanus</td>\n    </tr>\n    <tr>\n      <td>26–33</td>\n      <td>Beastlands</td>\n      <td>78–85</td>\n      <td>Mount Celestia</td>\n    </tr>\n    <tr>\n      <td>34–41</td>\n      <td>Bytopia</td>\n      <td>86–90</td>\n      <td>Nine Hells</td>\n    </tr>\n    <tr>\n      <td>42–46</td>\n      <td>Carceri</td>\n      <td>91–95</td>\n      <td>Pandemonium</td>\n    </tr>\n    <tr>\n      <td>47–54</td>\n      <td>Elysium</td>\n      <td>96–00</td>\n      <td>Ysgard</td>\n    </tr>\n  </tbody>\n</table>","source":"cache/