payload_json = '''{"text":"#### Necklace of Prayer Beads\n\n_Wondrous Item, Rare (Requires Attunement by a Cleric, Druid, or Paladin)_\n\nThis necklace has 1d4 + 2 magic beads made from aquamarine, black pearl, or topaz. It also has many nonmagical beads made from stones such as amber, bloodstone, citrine, coral, jade, pearl, or quartz. If a magic bead is removed from the necklace, that bead loses its magic.\n\nSix types of magic beads exist. The GM decides the type of each bead on the necklace or determines it randomly by rolling on the table below. A necklace can have more than one bead of the same type. To use one, you must be wearing the necklace. Each bead contains a spell that you can cast from it as a Bonus Action (using your spell save DC if a save is necessary). Once a magic bead's spell is cast, that bead can't be used again until the next dawn.\n\n<table>\n  <thead>\n    <tr>\n      <th>1d20</th>\n      <th>Bead</th>\n      <th>Spell</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>1–6</td>\n      <td>Bead of Blessing</td>\n      <td>Bless</td>\n    </tr>\n    <tr>\n      <td>7–12</td>\n      <td>Bead of Curing</td>\n      <td>Cure Wounds (level 2 version)</td>\n    </tr>\n    <tr>\n      <td>13–16</td>\n      <td>Bead of Favor</td>\n      <td>Greater Restoration</td>\n    </tr>\n    <tr>\n      <td>17–18</td>\n      <td>Bead of Smiting</td>\n      <td>Shining Smite</td>\n    </tr>\n    <tr>\n      <td>19</td>\n      <td>Bead of Summons</td>\n      <td>Guardian of Faith</td>\n    </tr>\n    <tr>\n      <td>20</td>\n      <td>Bead of Wind Walking</td>\n      <td>Wind Walk</td>\n    </tr>\n  </tbody>\n</table>","source":"cache/markdown/magic-items.md:3041-3089","license":"CC-BY-4.0"}'''
