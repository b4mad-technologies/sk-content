payload_json = '''{"text":"#### Horn of Valhalla\n\n_Wondrous Item, Rare (Silver or Brass), Very Rare (Bronze), or Legendary (Iron)_\n\nYou can take a Magic action to blow this horn. In response, warrior spirits from the plane of Ysgard appear in unoccupied spaces within 60 feet of you. Each spirit uses the **Berserker** stat block and returns to Ysgard after 1 hour or when it drops to 0 Hit Points. The spirits look like living, breathing warriors, and they have Immunity to the Charmed and Frightened conditions. Once you use the horn, it can't be used again until 7 days have passed.\n\nFour types of _Horn of Valhalla_ are known to exist, each made of a different metal. The horn's type determines how many spirits it summons, as well as the requirement for its use. The GM chooses the horn's type or determines it randomly by rolling on the following table.\n\nIf you blow the horn without meeting its requirement, the summoned spirits attack you. If you meet the requirement, they are Friendly to you and your allies and follow your commands.\n\n<table>\n  <thead>\n    <tr>\n      <th>1d100</th>\n      <th>Horn Type</th>\n      <th>Spirits</th>\n      <th>Requirement</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>01–40</td>\n      <td>Silver</td>\n      <td>2</td>\n      <td>None</td>\n    </tr>\n    <tr>\n      <td>41–75</td>\n      <td>Brass</td>\n      <td>3</td>\n      <td>Proficiency with all Simple weapons</td>\n    </tr>\n    <tr>\n      <td>76–90</td>\n      <td>Bronze</td>\n      <td>4</td>\n      <td>Training with all Medium armor</td>\n    </tr>\n    <tr>\n      <td>91–00</td>\n      <td>Iron</td>\n      <td>5</td>\n      <td>Proficiency with all Martial weapons</td>\n    </tr>\n  </tbody>\n</table>","source":"cache/markdown/magic-items.md:2445-2490","license":"CC-BY-4.0"}'''
