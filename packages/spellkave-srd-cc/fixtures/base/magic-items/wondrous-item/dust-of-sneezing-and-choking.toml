payload_json = '{"text":"#### Dust of Sneezing and Choking\n\n_Wondrous Item, Uncommon_\n\nFound in a small container, this powder resembles _Dust of Disappearance_, and _Identify_ reveals it to be such. There is enough of it for one use.\n\nAs a Utilize action, you can throw the dust into the air, forcing yourself and every creature in a 30-foot Emanation originating from you to make a DC 15 Constitution saving throw. Constructs, Elementals, Oozes, Plants, and Undead succeed on the save automatically.\n\nOn a failed save, a creature begins sneezing uncontrollably; it has the Incapacitated condition and is suffocating. The creature repeats the save at the end of each of its turns, ending the effect on itself on a success. The effect also ends on any creature targeted by a _Lesser Restoration_ spell.","source":"cache/markdown/magic-items.md:1876-1884","license":"CC-BY-4.0"}'
