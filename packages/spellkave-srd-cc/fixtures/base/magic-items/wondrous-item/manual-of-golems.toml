payload_json = '''{"text":"#### Manual of Golems\n\n_Wondrous Item, Very Rare_\n\nThis tome contains information and incantations necessary to make a particular type of golem. The GM chooses the type or determines it randomly by rolling on the accompanying table. To decipher and use the manual, you must be a spellcaster with at least two level 5 spell slots. A creature that can't use a _Manual of Golems_ and attempts to read it takes 6d6 Psychic damage.\n\nTo create a golem, you must spend the time shown on the table, working without interruption with the manual at hand and resting no more than 8 hours per day. You must also pay the specified cost to purchase supplies.\n\nOnce you finish creating the golem, the book is consumed in eldritch flames. The golem becomes animate when the ashes of the manual are sprinkled on it. See \"Monsters\" for the golem's stat block. The golem is under your control, and it understands and obeys your commands.\n\n<table>\n  <thead>\n    <tr>\n      <th>1d20</th>\n      <th>Golem</th>\n      <th>Time</th>\n      <th>Cost</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>1–5</td>\n      <td>Clay Golem</td>\n      <td>30 days</td>\n      <td>65,000 GP</td>\n    </tr>\n    <tr>\n      <td>6–17</td>\n      <td>Flesh Golem</td>\n      <td>60 days</td>\n      <td>50,000 GP</td>\n    </tr>\n    <tr>\n      <td>18</td>\n      <td>Iron Golem</td>\n      <td>120 days</td>\n      <td>100,000 GP</td>\n    </tr>\n    <tr>\n      <td>19–20</td>\n      <td>Stone Golem</td>\n      <td>90 days</td>\n      <td>80,000 GP</td>\n    </tr>\n  </tbody>\n</table>","source":"cache/markdown/magic-items.md:2660-2705","license":"CC-BY-4.0"}'''
