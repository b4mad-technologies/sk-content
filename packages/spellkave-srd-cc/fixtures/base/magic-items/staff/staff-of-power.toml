payload_json = '{"text":"#### Staff of Power\n\n_Staff, Very Rare (Requires Attunement by a Sorcerer, Warlock, or Wizard)_\n\nThis staff has 20 charges and can be wielded as a magic Quarterstaff that grants a +2 bonus to attack rolls and damage rolls made with it. While holding it, you gain a +2 bonus to Armor Class, saving throws, and spell attack rolls.\n\n_Spells._ While holding the staff, you can cast one of the spells on the following table from it, using your spell save DC. The table indicates how many charges you must expend to cast the spell.\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>Charge Cost</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>*Cone of Cold*</td>\n      <td>5</td>\n    </tr>\n    <tr>\n      <td>*Fireball* (level 5 version)</td>\n      <td>5</td>\n    </tr>\n    <tr>\n      <td>*Globe of Invulnerability*</td>\n      <td>6</td>\n    </tr>\n    <tr>\n      <td>*Hold Monster*</td>\n      <td>5</td>\n    </tr>\n    <tr>\n      <td>*Levitate*</td>\n      <td>2</td>\n    </tr>\n    <tr>\n      <td>*Lightning Bolt* (level 5 version)</td>\n      <td>5</td>\n    </tr>\n    <tr>\n      <td>*Magic Missile*</td>\n      <td>1</td>\n    </tr>\n    <tr>\n      <td>*Ray of Enfeeblement*</td>\n      <td>1</td>\n    </tr>\n    <tr>\n      <td>*Wall of Force*</td>\n      <td>5</td>\n    </tr>\n  </tbody>\n</table>\n\n_Regaining Charges._ The staff regains 2d8 + 4 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 1, the staff retains its +2 bonus to attack rolls and damage rolls but loses all other properties. On a 20, the staff regains 1d8 + 2 charges.\n\n_Retributive Strike._ You can take a Magic action to break the staff over your knee or against a solid surface. The staff is destroyed and releases its magic in an explosion that fills a 30-foot Emanation originating from itself. You have a 50 percent chance to instantly travel to a random plane of existence, avoiding the explosion. If you fail to avoid the effect, you take Force damage equal to 16 times the number of charges in the staff. Each other creature in the area makes a DC 17 Dexterity saving throw. On a failed save, a creature takes Force damage equal to 4 times the number of charges in the staff. On a successful save, a creature takes half as much damage.","source":"cache/markdown/magic-items.md:4323-4380","license":"CC-BY-4.0"}'
