payload_json = '{"text":"#### Staff of Swarming Insects\n\n_Staff, Rare (Requires Attunement by a Bard, Cleric, Druid, Sorcerer, Warlock, or Wizard)_\n\nThis staff has 10 charges.\n\n_Insect Cloud._ While holding the staff, you can take a Magic action and expend 1 charge to cause a swarm of harmless flying insects to fill a 30-foot Emanation originating from you. The insects remain for 10 minutes, making the area Heavily Obscured for creatures other than you. A strong wind (like that created by _Gust of Wind_) disperses the swarm and ends the effect.\n\n_Spells._ While holding the staff, you can cast one of the spells on the following table from it, using your spell save DC and spell attack modifier. The table indicates how many charges you must expend to cast the spell.\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>Charge Cost</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>*Giant Insect*</td>\n      <td>4</td>\n    </tr>\n    <tr>\n      <td>*Insect Plague*</td>\n      <td>5</td>\n    </tr>\n  </tbody>\n</table>\n\n_Regaining Charges._ The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 1, a swarm of insects consumes and destroys the staff, then disperses.","source":"cache/markdown/magic-items.md:4392-4421","license":"CC-BY-4.0"}'
