payload_json = '{"text":"#### Staff of the Woodlands\n\n_Staff, Rare (Requires Attunement by a Druid)_\n\nThis staff has 6 charges and can be wielded as a magic Quarterstaff that grants a +2 bonus to attack rolls and damage rolls made with it. While holding it, you have a +2 bonus to spell attack rolls.\n\n_Spells._ While holding the staff, you can cast one of the spells on the following table from it, using your spell save DC. The table indicates how many charges you must expend to cast the spell.\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell</th>\n      <th>Charge Cost</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>*Animal Friendship*</td>\n      <td>1</td>\n    </tr>\n    <tr>\n      <td>*Awaken*</td>\n      <td>5</td>\n    </tr>\n    <tr>\n      <td>*Barkskin*</td>\n      <td>2</td>\n    </tr>\n    <tr>\n      <td>*Locate Animals or Plants*</td>\n      <td>2</td>\n    </tr>\n    <tr>\n      <td>*Pass without Trace*</td>\n      <td>2</td>\n    </tr>\n    <tr>\n      <td>*Speak with Animals*</td>\n      <td>1</td>\n    </tr>\n    <tr>\n      <td>*Speak with Plants*</td>\n      <td>3</td>\n    </tr>\n    <tr>\n      <td>*Wall of Thorns*</td>\n      <td>6</td>\n    </tr>\n  </tbody>\n</table>\n\n_Tree Form._ You can take a Magic action to plant one end of the staff in earth in an unoccupied space and expend 1 charge to transform the staff into a healthy tree. The tree is 60 feet tall and has a 5-foot-diameter trunk, and its branches at the top spread out in a 20-foot radius. The tree appears ordinary but radiates a faint aura of Transmutation magic that can be discerned with the _Detect Magic_ spell. While touching the tree and using a Magic action, you return the staff to its normal form. Any creature in the tree falls when the tree reverts to a staff.\n\n_Regaining Charges._ The staff regains 1d6 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 1, the staff loses its properties and becomes a nonmagical Quarterstaff.","source":"cache/markdown/magic-items.md:4530-4583","license":"CC-BY-4.0"}'
