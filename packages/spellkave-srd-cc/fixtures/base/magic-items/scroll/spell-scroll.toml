payload_json = '''{"text":"#### Spell Scroll\n\n_Scroll, Rarity Varies_\n\nA _Spell Scroll_ bears the words of a single spell, written in a mystical cipher. If the spell is on your spell list, you can read the scroll and cast its spell without Material components. Otherwise, the scroll is unintelligible. Casting the spell by reading the scroll requires the spell's normal casting time. Once the spell is cast, the scroll crumbles to dust. If the casting is interrupted, the scroll isn't lost.\n\nIf the spell is on your spell list but of a higher level than you can normally cast, you make an ability check using your spellcasting ability to determine whether you cast the spell. The DC equals 10 plus the spell's level. On a failed check, the spell disappears from the scroll with no other effect.\n\nThe level of the spell on the scroll determines the spell's saving throw DC and attack bonus, as well as the scroll's rarity, as shown in the following table.\n\n<table>\n  <thead>\n    <tr>\n      <th>Spell Level</th>\n      <th>Rarity</th>\n      <th>Save DC</th>\n      <th>Attack Bonus</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Cantrip</td>\n      <td>Common</td>\n      <td>13</td>\n      <td>+5</td>\n    </tr>\n    <tr>\n      <td>1</td>\n      <td>Common</td>\n      <td>13</td>\n      <td>+5</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>Uncommon</td>\n      <td>13</td>\n      <td>+5</td>\n    </tr>\n    <tr>\n      <td>3</td>\n      <td>Uncommon</td>\n      <td>15</td>\n      <td>+7</td>\n    </tr>\n    <tr>\n      <td>4</td>\n      <td>Rare</td>\n      <td>15</td>\n      <td>+7</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Rare</td>\n      <td>17</td>\n      <td>+9</td>\n    </tr>\n    <tr>\n      <td>6</td>\n      <td>Very Rare</td>\n      <td>17</td>\n      <td>+9</td>\n    </tr>\n    <tr>\n      <td>7</td>\n      <td>Very Rare</td>\n      <td>18</td>\n      <td>+10</td>\n    </tr>\n    <tr>\n      <td>8</td>\n      <td>Very Rare</td>\n      <td>18</td>\n      <td>+10</td>\n    </tr>\n    <tr>\n      <td>9</td>\n      <td>Legendary</td>\n      <td>19</td>\n      <td>+11</td>\n    </tr>\n  </tbody>\n</table>\n\n_Copying a Scroll into a Spellbook._ A Wizard spell on a _Spell Scroll_ can be copied into a spellbook. When a spell is copied in this way, the copier must succeed on an Intelligence (Arcana) check with a DC equal to 10 plus the spell's level. On a successful check, the spell is copied. Whether the check succeeds or fails, the _Spell Scroll_ is destroyed.","source":"cache/markdown/magic-items.md:4086-4169; srd-2024_spell-scroll","license":"CC-BY-4.0"}'''
