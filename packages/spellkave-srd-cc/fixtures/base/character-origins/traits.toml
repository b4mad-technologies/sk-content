delta_source = "-1"
resource = "srd/dragonborn/breath-weapon-uses"

[[consequence_frame_writes]]
ordinal = 1
template_id = "srd/dragonborn/breath-weapon/success"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "TargetActor"
delta_source = "-1d10"
resource = "srd/hp"

[[consequence_frame_writes]]
ordinal = 0
template_id = "srd/trait/relentless-endurance/intercept"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "Actor"
delta_source = "cond(actor.stat('srd/orc/relentless-endurance-uses') >= 1, 1 - actor.stat('srd/hp'), 0)"
resource = "srd/hp"

[[consequence_frame_writes]]
ordinal = 1
template_id = "srd/trait/relentless-endurance/intercept"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "Actor"
delta_source = "cond(actor.stat('srd/orc/relentless-endurance-uses') >= 1, -1, 0)"
resource = "srd/orc/relentless-endurance-uses"

