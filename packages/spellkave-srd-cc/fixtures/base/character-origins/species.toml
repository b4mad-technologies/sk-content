[[metadata_attachments]]
bundle_id = "srd"
namespace = "srd.text"
payload_json = '''{"text":"#### Dragonborn\n\n**Creature Type:** Humanoid\n**Size:** Medium (about 5–7 feet tall)\n**Speed:** 30 feet\n\nAs a Dragonborn, you have these special traits.\n\n_Draconic Ancestry._ Your lineage stems from a dragon progenitor. Choose the kind of dragon from the Draconic Ancestors table. Your choice affects your Breath Weapon and Damage Resistance traits as well as your appearance.\n\n**Draconic Ancestors**\n\n<table>\n  <thead>\n    <tr>\n      <th>Dragon</th>\n      <th>Damage Type</th>\n      <th>Dragon</th>\n      <th>Damage Type</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Black</td>\n      <td>Acid</td>\n      <td>Gold</td>\n      <td>Fire</td>\n    </tr>\n    <tr>\n      <td>Blue</td>\n      <td>Lightning</td>\n      <td>Green</td>\n      <td>Poison</td>\n    </tr>\n    <tr>\n      <td>Brass</td>\n      <td>Fire</td>\n      <td>Red</td>\n      <td>Fire</td>\n    </tr>\n    <tr>\n      <td>Bronze</td>\n      <td>Lightning</td>\n      <td>Silver</td>\n      <td>Cold</td>\n    </tr>\n    <tr>\n      <td>Copper</td>\n      <td>Acid</td>\n      <td>White</td>\n      <td>Cold</td>\n    </tr>\n  </tbody>\n</table>\n\n_Breath Weapon._ When you take the Attack action on your turn, you can replace one of your attacks with an exhalation of magical energy in either a 15-foot Cone or a 30-foot Line that is 5 feet wide (choose the shape each time). Each creature in that area must make a Dexterity saving throw (DC 8 plus your Constitution modifier and Proficiency Bonus). On a failed save, a creature takes 1d10 damage of the type determined by your Draconic Ancestry trait. On a successful save, a creature takes half as much damage. This damage increases by 1d10 when you reach character levels 5 (2d10), 11 (3d10), and 17 (4d10).\n\nYou can use this Breath Weapon a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.\n\n_Damage Resistance._ You have Resistance to the damage type determined by your Draconic Ancestry trait.\n\n_Darkvision._ You have Darkvision with a range of 60 feet.\n\n_Draconic Flight._ When you reach character level 5, you can channel draconic magic to give yourself temporary flight. As a Bonus Action, you sprout spectral wings on your back that last for 10 minutes or until you retract the wings (no action required) or have the Incapacitated condition. During that time, you have a Fly Speed equal to your Speed. Your wings appear to be made of the same energy as your Breath Weapon. Once you use this trait, you can't use it again until you finish a Long Rest.","source":"cache/markdown/character-origins.md:97-160","license":"CC-BY-4.0"}'''
source = "manifest"
target_kind = "entity_definition"
target_ref = "srd/species/dragonborn"

[[metadata_attachments]]
bundle_id = "srd"
namespace = "srd.text"
payload_json = '{"text":"#### Dwarf\n\n**Creature Type:** Humanoid\n**Size:** Medium (about 4–5 feet tall)\n**Speed:** 30 feet\n\nAs a Dwarf, you have these special traits.\n\n_Darkvision._ You have Darkvision with a range of 120 feet.\n\n_Dwarven Resilience._ You have Resistance to Poison damage. You also have Advantage on saving throws you make to avoid or end the Poisoned condition.\n\n_Dwarven Toughness._ Your Hit Point maximum increases by 1, and it increases by 1 again whenever you gain a level.\n\n_Stonecunning._ As a Bonus Action, you gain Tremorsense with a range of 60 feet for 10 minutes. You must be on a stone surface or touching a stone surface to use this Tremorsense. The stone can be natural or worked.\n\nYou can use this Bonus Action a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.","source":"cache/markdown/character-origins.md:162-178","license":"CC-BY-4.0"}'
source = "manifest"
target_kind = "entity_definition"
target_ref = "srd/species/dwarf"

[[metadata_attachments]]
bundle_id = "srd"
namespace = "srd.text"
payload_json = '''{"text":"#### Elf\n\n**Creature Type:** Humanoid\n**Size:** Medium (about 5–6 feet tall)\n**Speed:** 30 feet\n\nAs an Elf, you have these special traits.\n\n_Darkvision._ You have Darkvision with a range of 60 feet.\n\n_Elven Lineage._ You are part of a lineage that grants you supernatural abilities. Choose a lineage from the Elven Lineages table. You gain the level 1 benefit of that lineage.\n\nWhen you reach character levels 3 and 5, you learn a higher-level spell, as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage).\n\n**Elven Lineages**\n\n<table>\n  <thead>\n    <tr>\n      <th>Lineage</th>\n      <th>Level 1</th>\n      <th>Level 3</th>\n      <th>Level 5</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Drow</td>\n      <td>The range of your Darkvision increases to 120 feet. You also know the Dancing Lights cantrip.</td>\n      <td>Faerie Fire</td>\n      <td>Darkness</td>\n    </tr>\n    <tr>\n      <td>High Elf</td>\n      <td>You know the Prestidigitation cantrip. Whenever you finish a Long Rest, you can replace that cantrip with a different cantrip from the Wizard spell list.</td>\n      <td>Detect Magic</td>\n      <td>Misty Step</td>\n    </tr>\n    <tr>\n      <td>Wood Elf</td>\n      <td>Your Speed increases to 35 feet. You also know the Druidcraft cantrip.</td>\n      <td>Longstrider</td>\n      <td>Pass without Trace</td>\n    </tr>\n  </tbody>\n</table>\n\n_Fey Ancestry._ You have Advantage on saving throws you make to avoid or end the Charmed condition.\n\n_Keen Senses._ You have proficiency in the Insight, Perception, or Survival skill.\n\n_Trance._ You don't need to sleep, and magic can't put you to sleep. You can finish a Long Rest in 4 hours if you spend those hours in a trancelike meditation, during which you retain consciousness.","source":"cache/markdown/character-origins.md:180-233","license":"CC-BY-4.0"}'''
source = "manifest"
target_kind = "entity_definition"
target_ref = "srd/species/elf"

[[metadata_attachments]]
bundle_id = "srd"
namespace = "srd.text"
payload_json = '''{"text":"#### Gnome\n\n**Creature Type:** Humanoid\n**Size:** Small (about 3–4 feet tall)\n**Speed:** 30 feet\n\nAs a Gnome, you have these special traits.\n\n_Darkvision._ You have Darkvision with a range of 60 feet.\n\n_Gnomish Cunning._ You have Advantage on Intelligence, Wisdom, and Charisma saving throws.\n\n_Gnomish Lineage._ You are part of a lineage that grants you supernatural abilities. Choose one of the following options; whichever one you choose, Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage):\n\n**Forest Gnome.** You know the _Minor Illusion_ cantrip. You also always have the _Speak with Animals_ spell prepared. You can cast it without a spell slot a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest. You can also use any spell slots you have to cast the spell.\n\n**Rock Gnome.** You know the _Mending_ and _Prestidigitation_ cantrips. In addition, you can spend 10 minutes casting _Prestidigitation_ to create a Tiny clockwork device (AC 5, 1 HP), such as a toy, fire starter, or music box. When you create the device, you determine its function by choosing one effect from _Prestidigitation_; the device produces that effect whenever you or another creature takes a Bonus Action to activate it with a touch. If the chosen effect has options within it, you choose one of those options for the device when you create it. For example, if you choose the spell's ignite-extinguish effect, you determine whether the device ignites or extinguishes fire; the device doesn't do both. You can have three such devices in existence at a time, and each falls apart 8 hours after its creation or when you dismantle it with a touch as a Utilize action.","source":"cache/markdown/character-origins.md:235-251","license":"CC-BY-4.0"}'''
source = "manifest"
target_kind = "entity_definition"
target_ref = "srd/species/gnome"

