payload_json = '''{"text":"#### Heroes' Feast\n\n_Level 6 Conjuration (Bard, Cleric, Druid)_\n\n**Casting Time:** 10 minutes\n**Range:** Self\n**Components:** V, S, M (a gem-encrusted bowl worth 1,000+ GP, which the spell consumes)\n**Duration:** Instantaneous\n\nYou conjure a feast that appears on a surface in an unoccupied 10-foot Cube next to you. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don't set in until this hour is over. Up to twelve creatures can partake of the feast.\n\nA creature that partakes gains several benefits, which last for 24 hours. The creature has Resistance to Poison damage, and it has Immunity to the Frightened and Poisoned conditions. Its Hit Point maximum also increases by 2d10, and it gains the same number of Hit Points.","source":"cache/markdown/spells.md:3138-3149","license":"CC-BY-4.0"}'''
