payload_json = '{"text":"#### Irresistible Dance\n\n_Level 6 Enchantment (Bard, Wizard)_\n\n**Casting Time:** Action\n**Range:** 30 feet\n**Components:** V\n**Duration:** Concentration, up to 1 minute\n\nOne creature that you can see within range must make a Wisdom saving throw. On a successful save, the target dances comically until the end of its next turn, during which it must spend all its movement to dance in place.\n\nOn a failed save, the target has the Charmed condition for the duration. While Charmed, the target dances comically, must use all its movement to dance in place, and has Disadvantage on Dexterity saving throws and attack rolls, and other creatures have Advantage on attack rolls against it. On each of its turns, the target can take an action to collect itself and repeat the save, ending the spell on itself on a success.","source":"cache/markdown/spells.md:3398-3409","license":"CC-BY-4.0"}'
