payload_json = '''{"text":"#### Augury\n\n_Level 2 Divination (Cleric, Druid, Wizard)_\n\n**Casting Time:** 1 minute or Ritual\n**Range:** Self\n**Components:** V, S, M (specially marked sticks, bones, cards, or other divinatory tokens worth 25+ GP)\n**Duration:** Instantaneous\n\nYou receive an omen from an otherworldly entity about the results of a course of action that you plan to take within the next 30 minutes. The GM chooses the omen from the Omens table.\n\n**Omens**\n\n<table>\n  <thead>\n    <tr>\n      <th>Omen</th>\n      <th>For Results That Will Be …</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Weal</td>\n      <td>Good</td>\n    </tr>\n    <tr>\n      <td>Woe</td>\n      <td>Bad</td>\n    </tr>\n    <tr>\n      <td>Weal and woe</td>\n      <td>Good and bad</td>\n    </tr>\n    <tr>\n      <td>Indifference</td>\n      <td>Neither good nor bad</td>\n    </tr>\n  </tbody>\n</table>\n\nThe spell doesn't account for circumstances, such as other spells, that might change the results.\n\nIf you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.","source":"cache/markdown/spells.md:619-661","license":"CC-BY-4.0"}'''
