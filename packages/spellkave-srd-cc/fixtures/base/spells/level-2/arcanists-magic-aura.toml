payload_json = '''{"text":"#### Arcanist's Magic Aura\n\n_Level 2 Illusion (Wizard)_\n\n**Casting Time:** Action\n**Range:** Touch\n**Components:** V, S, M (a small square of silk)\n**Duration:** 24 hours\n\nWith a touch, you place an illusion on a willing creature or an object that isn't being worn or carried. A creature gains the Mask effect below, and an object gains the False Aura effect below. The effect lasts for the duration. If you cast the spell on the same target every day for 30 days, the illusion lasts until dispelled.\n\n_Mask (Creature)._ Choose a creature type other than the target's actual type. Spells and other magical effects treat the target as if it were a creature of the chosen type.\n\n_False Aura (Object)._ You change the way the target appears to spells and magical effects that detect magical auras, such as _Detect Magic_. You can make a nonmagical object appear magical, make a magic item appear nonmagical, or change the object's aura so that it appears to belong to a school of magic you choose.","source":"cache/markdown/spells.md:585-598","license":"CC-BY-4.0"}'''
