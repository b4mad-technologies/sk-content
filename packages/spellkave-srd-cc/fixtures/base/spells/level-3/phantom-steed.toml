payload_json = '''{"text":"#### Phantom Steed\n\n_Level 3 Illusion (Wizard)_\n\n**Casting Time:** 1 minute or Ritual\n**Range:** 30 feet\n**Components:** V, S\n**Duration:** 1 hour\n\nA Large, quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature's appearance, and it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed.\n\nFor the duration, you or a creature you choose can ride the steed. The steed uses the Riding Horse stat block (see \"Monsters\"), except it has a Speed of 100 feet and can travel 13 miles in an hour. When the spell ends, the steed gradually fades, giving the rider 1 minute to dismount. The spell ends early if the steed takes any damage.","source":"cache/markdown/spells.md:4065-4076","license":"CC-BY-4.0"}'''
