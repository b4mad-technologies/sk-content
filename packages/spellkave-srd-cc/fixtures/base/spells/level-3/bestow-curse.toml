payload_json = '''{"text":"#### Bestow Curse\n\n_Level 3 Necromancy (Bard, Cleric, Wizard)_\n\n**Casting Time:** Action\n**Range:** Touch\n**Components:** V, S\n**Duration:** Concentration, up to 1 minute\n\nYou touch a creature, which must succeed on a Wisdom saving throw or become cursed for the duration. Until the curse ends, the target suffers one of the following effects of your choice:\n\n- Choose one ability. The target has Disadvantage on ability checks and saving throws made with that ability.\n- The target has Disadvantage on attack rolls against you.\n- In combat, the target must succeed on a Wisdom saving throw at the start of each of its turns or be forced to take the Dodge action on that turn.\n  • If you deal damage to the target with an attack roll or a spell, the target takes an extra 1d8 Necrotic damage.\n\n_Using a Higher-Level Spell Slot._ If you cast this spell using a level 4 spell slot, you can maintain Concentration on it for up to 10 minutes. If you use a level 5+ spell slot, the spell doesn't require Concentration, and the duration becomes 8 hours (level 5–6 slot) or 24 hours (level 7–8 slot). If you use a level 9 spell slot, the spell lasts until dispelled.","source":"cache/markdown/spells.md:754-770","license":"CC-BY-4.0"}'''
