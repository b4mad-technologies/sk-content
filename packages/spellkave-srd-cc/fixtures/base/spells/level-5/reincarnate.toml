payload_json = '''{"text":"#### Reincarnate\n\n_Level 5 Necromancy (Druid)_\n\n**Casting Time:** 1 hour\n**Range:** Touch\n**Components:** V, S, M (rare oils worth 1,000+ GP, which the spell consumes)\n**Duration:** Instantaneous\n\nYou touch a dead Humanoid or a piece of one. If the creature has been dead no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d10 and consult the table below to determine the body's species, or the GM chooses another playable species.\n\n<table>\n  <thead>\n    <tr>\n      <th>1d10</th>\n      <th>Species</th>\n      <th>1d10</th>\n      <th>Species</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>1</td>\n      <td>Roll again.</td>\n      <td>6</td>\n      <td>Goliath</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>Dragonborn</td>\n      <td>7</td>\n      <td>Halfling</td>\n    </tr>\n    <tr>\n      <td>3</td>\n      <td>Dwarf</td>\n      <td>8</td>\n      <td>Human</td>\n    </tr>\n    <tr>\n      <td>4</td>\n      <td>Elf</td>\n      <td>9</td>\n      <td>Orc</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Gnome</td>\n      <td>10</td>\n      <td>Tiefling</td>\n    </tr>\n  </tbody>\n</table>\n\nThe reincarnated creature makes any choices that a species' description offers, and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.","source":"cache/markdown/spells.md:4538-4592","license":"CC-BY-4.0"}'''
