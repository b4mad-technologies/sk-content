payload_json = '{"text":"#### Control Weather\n\n_Level 8 Transmutation (Cleric, Druid, Wizard)_\n\n**Casting Time:** 10 minutes\n**Range:** Self\n**Components:** V, S, M (burning incense)\n**Duration:** Concentration, up to 8 hours\n\nYou take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell, and it ends early if you go indoors.\n\nWhen you cast the spell, you change the current weather conditions, which are determined by the GM. You can change precipitation, temperature, and wind. It takes 1d4 × 10 minutes for the new\n\nconditions to take effect. Once they do so, you can change the conditions again. When the spell ends, the weather gradually returns to normal.\n\nWhen you change the weather conditions, find a current condition on the following tables and change its stage by one, up or down. When changing the wind, you can change its direction.\n\n**Precipitation**\n\n<table>\n  <thead>\n    <tr>\n      <th>Stage</th>\n      <th>Condition</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>1</td>\n      <td>Clear</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>Light clouds</td>\n    </tr>\n    <tr>\n      <td>3</td>\n      <td>Overcast or ground fog</td>\n    </tr>\n    <tr>\n      <td>4</td>\n      <td>Rain, hail, or snow</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Torrential rain, driving hail, or blizzard</td>\n    </tr>\n  </tbody>\n</table>\n\n**Temperature**\n\n<table>\n  <thead>\n    <tr>\n      <th>Stage</th>\n      <th>Condition</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>1</td>\n      <td>Heat wave</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>Hot</td>\n    </tr>\n    <tr>\n      <td>3</td>\n      <td>Warm</td>\n    </tr>\n    <tr>\n      <td>4</td>\n      <td>Cool</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Cold</td>\n    </tr>\n    <tr>\n      <td>6</td>\n      <td>Freezing</td>\n    </tr>\n  </tbody>\n</table>\n\n**Wind**\n\n<table>\n  <thead>\n    <tr>\n      <th>Stage</th>\n      <th>Condition</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>1</td>\n      <td>Calm</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>Moderate wind</td>\n    </tr>\n    <tr>\n      <td>3</td>\n      <td>Strong wind</td>\n    </tr>\n    <tr>\n      <td>4</td>\n      <td>Gale</td>\n    </tr>\n    <tr>\n      <td>5</td>\n      <td>Storm</td>\n    </tr>\n  </tbody>\n</table>","source":"cache/markdown/spells.md:1368-1486","license":"CC-BY-4.0"}'
