payload_json = '{"text":"#### Create or Destroy Water\n\n_Level 1 Transmutation (Cleric, Druid)_\n\n**Casting Time:** Action\n**Range:** 30 feet\n**Components:** V, S, M (a mix of water and sand)\n**Duration:** Instantaneous\n\nYou do one of the following:\n\n**Create Water.** You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot Cube within range, extinguishing exposed flames there.\n\n**Destroy Water.** You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot Cube within range.\n\n_Using a Higher-Level Spell Slot._ You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1.","source":"cache/markdown/spells.md:1510-1525","license":"CC-BY-4.0"}'
