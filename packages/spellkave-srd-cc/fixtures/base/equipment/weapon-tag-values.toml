[[tag_value_definitions]]
bundle_id = "srd"
description = "Ammunition. You can use a weapon that has the Ammunition property to make a ranged attack only if you have ammunition to fire from it. The type of ammunition required is specified with the weapon's range. Each attack expends one piece of ammunition. Drawing the ammunition is part of the attack (you need a free hand to load a one-handed weapon). After a fight, you can spend 1 minute to recover half the ammunition (round down) you used in the fight; the rest is lost."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.ammunition"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Cleave. If you hit a creature with a melee attack roll using this weapon, you can make a melee attack roll with the weapon against a second creature within 5 feet of the first that is also within your reach. On a hit, the second creature takes the weapon's damage, but don't add your ability modifier to that damage unless that modifier is negative. You can make this extra attack only once per turn."
prefix = "srd.weapon.mastery"
tag = "srd.weapon.mastery.cleave"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Finesse. When making an attack with a Finesse weapon, use your choice of your Strength or Dexterity modifier for the attack and damage rolls. You must use the same modifier for both rolls."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.finesse"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Graze. If your attack roll with this weapon misses a creature, you can deal damage to that creature equal to the ability modifier you used to make the attack roll. This damage is the same type dealt by the weapon, and the damage can be increased only by increasing the ability modifier."
prefix = "srd.weapon.mastery"
tag = "srd.weapon.mastery.graze"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Heavy. You have Disadvantage on attack rolls with a Heavy weapon if it's a Melee weapon and your Strength score isn't at least 13 or if it's a Ranged weapon and your Dexterity score isn't at least 13."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.heavy"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Light. When you take the Attack action on your turn and attack with a Light weapon, you can make one extra attack as a Bonus Action later on the same turn. That extra attack must be made with a different Light weapon, and you don't add your ability modifier to the extra attack's damage unless that modifier is negative."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.light"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Loading. You can fire only one piece of ammunition from a Loading weapon when you use an action, a Bonus Action, or a Reaction to fire it, regardless of the number of attacks you can normally make."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.loading"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Nick. When you make the extra attack of the Light property, you can make it as part of the Attack action instead of as a Bonus Action. You can make this extra attack only once per turn."
prefix = "srd.weapon.mastery"
tag = "srd.weapon.mastery.nick"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Push. If you hit a creature with this weapon, you can push the creature up to 10 feet straight away from yourself if it is Large or smaller."
prefix = "srd.weapon.mastery"
tag = "srd.weapon.mastery.push"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Reach. A Reach weapon adds 5 feet to your reach when you attack with it, as well as when determining your reach for Opportunity Attacks with it."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.reach"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Sap. If you hit a creature with this weapon, that creature has Disadvantage on its next attack roll before the start of your next turn."
prefix = "srd.weapon.mastery"
tag = "srd.weapon.mastery.sap"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Slow. If you hit a creature with this weapon and deal damage to it, you can reduce its Speed by 10 feet until the start of your next turn. If the creature is hit more than once by weapons that have this property, the Speed reduction doesn't exceed 10 feet."
prefix = "srd.weapon.mastery"
tag = "srd.weapon.mastery.slow"

[[tag_value_definitions]]
bundle_id = "srd"
description = "Thrown. If a weapon has the Thrown property, you can throw the weapon to make a ranged attack, and you can draw that weapon as part of the attack. If the weapon is a Melee weapon, use the same ability modifier for the attack and damage rolls that you use for a melee attack with that weapon."
prefix = "srd.weapon.property"
tag = "srd.weapon.property.thrown"

[[tag_value_definitions]]
