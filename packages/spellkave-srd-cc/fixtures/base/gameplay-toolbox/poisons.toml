payload_json = '{"text":"#### Burnt Othur Fumes (500 GP)\n\n_Inhaled Poison_\n\nA creature subjected to Burnt Othur Fumes must succeed on a DC 13 Constitution saving throw or take 10 (3d6) Poison damage, and it must repeat the save at the start of each of its turns. On each successive failed save, the creature takes 3 (1d6) Poison damage. After three successful saves, the poison ends.","source":"cache/markdown/gameplay-toolbox.md:427-431; gameplay-toolbox.md:Burnt Othur Fumes (500 GP)","license":"CC-BY-4.0"}'
