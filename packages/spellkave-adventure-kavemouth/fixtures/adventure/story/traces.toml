[[trace_kind_definitions]]
bundle_id = "kavemouth"
description = "A typed companion command footprint, inscribed at the addressee's current place: 'command' is the authored command word, 'addressee' the bound companion's entity id (carry_addressee). Place-visible on purpose — addressing is not privacy, so bystanders at that place may perceive it; the addressee alone is expected to act on it. Perceptible to an arriving observer for 30 ticks; that window is discovery only and says nothing about whether the command is still valid."
kind_id = "kavemouth/adventure/trace/companion_command"
location_kinds = "place_node"
perceptible_for_ticks = 30
schema_json = '{"command":"string","addressee":"integer"}'

